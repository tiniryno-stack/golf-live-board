<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Golf Board">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Golf Live Board</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <!-- iOS launch images (home screen app only; feature 020). The mark sits 300pt from the top, where #loader draws it. -->
  <link rel="apple-touch-startup-image" href="img/startup/startup-se-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="img/startup/startup-13mini-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="img/startup/startup-14-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="img/startup/startup-15-16-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="img/startup/startup-16pro-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="img/startup/startup-plus-promax-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="img/startup/startup-16promax-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <style>
    /* The loading screen (feature 020) is styled here, not in styles.css, so it is right from the first
       paint, before the loader below has fetched the CSS. Colors = design tokens (dark / light). */
    /* The page itself is painted from the first frame too: until styles.css loads, an unpainted page is white,
       and on the home screen app (a page ~one status bar shorter than the screen) that showed as a white
       sliver at the bottom for a frame (Nov 5). */
    html, body { margin: 0; background: #0a0b0d; color-scheme: dark; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f2f3f5; color-scheme: light; }
    .loader { --ld-bg: #0a0b0d; --ld-text: #f4f5f7; --ld-muted: #a7acb4; --ld-ball: #3ddc84; --ld-button: #f4f5f7; --ld-on-button: #0a0b0d; }
    [data-theme="light"] .loader { --ld-bg: #f2f3f5; --ld-text: #0b0d10; --ld-muted: #4f555e; --ld-ball: #12a35c; --ld-button: #0b0d10; --ld-on-button: #ffffff; }
    .loader {
      position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: max(100dvh, var(--app-h, 100dvh)); z-index: 100;
      background: var(--bg, var(--ld-bg)); color: var(--text, var(--ld-text));
      font-family: Geist, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; padding-top: 300px; box-sizing: border-box;
      transition: opacity 280ms cubic-bezier(.2, .8, .2, 1);
    }
    .loader.gone { opacity: 0; pointer-events: none; }
    .loader[hidden] { display: none; }
    .ld-mark { display: block; width: 120px; height: 120px; overflow: visible; }
    .ld-ring { transform-origin: 42px 58px; }
    .ld-ball { fill: var(--cart-you, var(--ld-ball)); transform-origin: 42px 58px; }
    .ld-ball.orbit { animation: ld-orbit 1000ms linear infinite; }
    .loader.stopped .ld-ball.orbit { animation-play-state: paused; }
    .ld-ball.drop { transform-origin: 73.1px 26.9px; animation: ld-drop 460ms cubic-bezier(.4, 0, 1, 1) both; }
    .ld-ring.dip { animation: ld-settle 420ms cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes ld-orbit { to { transform: rotate(360deg); } }
    @keyframes ld-drop { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 70% { transform: translate(-31px, 31px) scale(.55); opacity: 1; } 100% { transform: translate(-31px, 31px) scale(.22); opacity: 0; } }
    @keyframes ld-settle { 0%, 30% { transform: translate(0, 0); } 55% { transform: translate(0, 2px); } 100% { transform: translate(0, 0); } }
    .ld-name { font-size: 20px; line-height: 24px; font-weight: 800; letter-spacing: -0.6px; margin-top: 22px; }
    .ld-text { min-height: 120px; margin-top: 28px; width: 100%; padding: 0 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .ld-text > * { margin: 0; animation: ld-fade 280ms cubic-bezier(.2, .8, .2, 1) both; }
    .ld-text .ld-sub { font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text-muted, var(--ld-muted)); }
    .ld-text .ld-small { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted, var(--ld-muted)); margin-top: 6px; }
    .ld-text .ld-head { font-size: 22px; line-height: 28px; font-weight: 700; }
    .ld-text .ld-head + .ld-sub { margin-top: 6px; }
    .ld-text .ld-btn { margin-top: 18px; height: 52px; padding: 0 28px; border: 0; border-radius: var(--radius-lg, 16px); background: var(--button, var(--ld-button)); color: var(--on-button, var(--ld-on-button)); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
    @keyframes ld-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ld-ball.orbit, .ld-ball.drop, .ld-ring.dip, .ld-text > * { animation: none; } }
  </style>
  <script>
    // Theme before first paint: dark by default, light if this phone chose it.
    try { if (JSON.parse(localStorage.getItem('glb.theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
    // Home screen app: the real screen height before the first paint too (app.js keeps it updated), so the
    // loading screen covers the whole screen from frame one. Same rule as app.js; standalone = no Safari bars.
    try {
      if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) {
        var tall = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        document.documentElement.style.setProperty('--app-h', (innerHeight > innerWidth ? tall : short) + 'px');
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap">
  <!-- Supabase client (pinned; no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script>
    // Loader: ask for version.json fresh (never from cache), then load that version's CSS and JS.
    // An import map points every module at ?v=<version>, so imports inside the app get the new files
    // too. Phones (home screen apps especially) otherwise keep running cached files for minutes.
    // Offline or missing version.json → the last version this phone saw, else plain URLs.
    (function () {
      var base = document.baseURI;
      function go(info) {
        var v = info && info.v;
        var q = v ? '?v=' + v : '';
        var imports = {};
        (info && info.files || []).forEach(function (f) { if (/\.js$/.test(f) && v) imports[new URL(f, base).href] = new URL(f + q, base).href; });
        var map = document.createElement('script');
        map.type = 'importmap';
        map.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(map);
        ['css/tokens.css', 'css/styles.css'].forEach(function (f) {
          var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f + q; document.head.appendChild(l);
        });
        var start = function () { var s = document.createElement('script'); s.type = 'module'; s.src = 'js/app.js' + q; document.head.appendChild(s); };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
      }
      var key = 'glb.version';
      fetch('version.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (info) { try { localStorage.setItem(key, JSON.stringify(info)); } catch (e) {} go(info); })
        .catch(function () { var saved = null; try { saved = JSON.parse(localStorage.getItem(key)); } catch (e) {} go(saved); });
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar"></header>
    <main id="content" class="content"></main>
    <nav id="tabbar" class="tabbar" aria-label="Round"></nav>
  </div>
  <div id="banners" class="banner-root"></div>
  <div id="toasts" class="toast-root" aria-live="polite"></div>
  <div id="overlay" class="overlay-root"></div>
  <div id="sheet" class="sheet-root"></div>

  <div class="landscape" role="alert">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
    Turn your phone upright
  </div>

  <div id="loader" class="loader" role="status" aria-label="Golf Live Board">
    <svg class="ld-mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ld-ring" cx="42" cy="58" r="30" fill="none" stroke="currentColor" stroke-width="13"/>
      <circle class="ld-ball orbit" cx="73.1" cy="26.9" r="11"/>
    </svg>
    <div class="ld-name">Golf Live Board</div>
    <div class="ld-text" aria-live="polite"></div>
  </div>
  <noscript>Golf Live Board needs JavaScript.</noscript>
</body>
</html>
