<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Round · Player card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--gold:#F5C64A;--dbl:#FF6B6B;--dblBg:rgba(255,107,107,0.16);--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#FFFFFF;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--gold:#8A6000;--dbl:#B42318;--dblBg:rgba(180,35,24,0.10);--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 8px 12px 0; height: 56px; display: flex; align-items: center">
<a href="A-Card.dc.html" style="height: 48px; padding: 0 14px 0 8px; border-radius: 24px; background: var(--s1); display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--tx); text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Scorecard</a>
</div>

<div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 20px 0">
<div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--meT)"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--me)"></span>Hogan’s Heroes</div>
<div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">Andrew B.</div>
<div style="font-size: 14px; color: var(--tx2); margin-top: 2px">Hcp 14 · thru 11 · net 38 (−5)</div>
</div>
<div style="text-align: right">
<div class="mono" style="font-size: 64px; font-weight: 700; letter-spacing: -3px; line-height: 0.9">46</div>
<div class="mono" style="font-size: 15px; font-weight: 700; color: var(--tx2); margin-top: 4px">+3 gross</div>
</div>
</div>

<sc-for list="{{nines}}" as="n" hint-placeholder-count="2">
<div style="margin: 14px 16px 0; border-radius: 18px; background: var(--s1); padding: 12px 10px 10px">
<div style="display: flex; justify-content: space-between; padding: 0 4px 8px">
<span style="font-size: 14px; font-weight: 700">{{n.title}}</span>
<span class="mono" style="font-size: 13px; color: var(--tx2)">{{n.sum}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); row-gap: 4px">
<sc-for list="{{n.holes}}" as="h" hint-placeholder-count="9">
<div style="{{h.colSt}}">
<span class="mono" style="font-size: 11px; color: var(--tx2)">{{h.n}}</span>
<span class="mono" style="{{h.st}}">{{h.v}}</span>
<span style="font-size: 10px; color: var(--tx2); white-space: nowrap">par {{h.par}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 14px 16px 0">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="border-radius: 14px; background: var(--s1); padding: 10px 10px 12px">
<div class="mono" style="font-size: 26px; font-weight: 700; line-height: 1">{{s.n}}</div>
<div style="font-size: 12px; color: var(--tx2); margin-top: 4px">{{s.label}}</div>
<div style="{{s.barSt}}"></div>
</div>
</sc-for>
</div>

<div style="margin: 14px 16px 0; border-radius: 16px; background: var(--tint); border: 1px solid var(--me); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--meT); flex: none; margin-top: 1px"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg>
<div style="font-size: 15px; line-height: 1.35; font-weight: 500">Back-to-back birdies on 10 and 11. That’s −2 on the back after +5 on the front.</div>
</div>

<nav style="margin: auto 12px 10px; display: flex; gap: 4px; padding: 5px; background: var(--s1); border: 1px solid var(--ln); border-radius: 22px">
<a href="Main.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; color: var(--tx2); text-decoration: none; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Enter</a>
<a href="A-Matches-v3a-expand.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; color: var(--tx2); text-decoration: none; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg>Matches</a>
<a href="A-Board.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; color: var(--tx2); text-decoration: none; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg>Board</a>
<a href="A-Card.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; background: var(--btn); color: var(--btnT); text-decoration: none; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg>Card</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var parF = [5, 4, 3, 4, 4, 5, 3, 4, 4], parB = [4, 3, 4, 5, 4, 3, 5, 4, 4];
    var F = [6, 4, 2, 5, 6, 5, 4, 4, 5], B = [3, 2];
    function sym(s, pr) {
      var b = 'width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-size: 16px; font-weight: 700; ';
      if (s === null || s === undefined) return b + 'border-radius: 14px; border: 1.5px dashed var(--ln); color: transparent';
      var d = s - pr;
      if (d <= -2) return b + 'border-radius: 14px; border: 4px double var(--tx)';
      if (d === -1) return b + 'border-radius: 14px; border: 1.5px solid var(--tx)';
      if (d === 1) return b + 'border-radius: 4px; border: 1.5px solid var(--tx2)';
      if (d >= 2) return b + 'border-radius: 4px; border: 4px double var(--dbl); background: var(--dblBg); color: var(--dbl)';
      return b;
    }
    function nine(title, sum, par, sc, start, cur) {
      return { title: title, sum: sum, holes: par.map(function (pr, i) {
        var s = sc[i];
        return { n: start + i, par: pr, v: (s === null || s === undefined) ? '–' : String(s), st: sym(s, pr),
          colSt: 'display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; border-radius: 10px' + (start + i === cur ? '; background: var(--tint)' : '') };
      }) };
    }
    var stat = function (n, label, color) { return { n: n, label: label, barSt: 'height: 4px; border-radius: 2px; margin-top: 8px; background: ' + color + '; width: ' + Math.max(18, n * 25) + '%' }; };
    return {
      mode: this.props.mode ?? 'dark',
      nines: [nine('Front 9', '41 · +5', parF, F, 1, 0), nine('Back 9', '5 thru 2 · −2', parB, B, 10, 11)],
      stats: [stat(3, 'Birdies', 'var(--gold)'), stat(3, 'Pars', 'var(--tx2)'), stat(4, 'Bogeys', 'var(--tx2); opacity: 0.5'), stat(1, 'Double+', 'var(--dbl)')]
    };
  }
}
</script>
</body>
</html>
