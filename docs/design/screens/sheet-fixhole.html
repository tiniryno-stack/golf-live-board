<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter · fix a hole sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--org:#FF9A4A;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--err:#FF5A5A;--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10);--scrim:rgba(0,0,0,0.6);--shC:none;--shS:0 -8px 32px rgba(0,0,0,0.5)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#DDE0E5;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--org:#B85A00;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--err:#C8282D;--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10);--scrim:rgba(11,13,16,0.35);--shC:0 1px 2px rgba(11,13,16,0.06),0 4px 12px rgba(11,13,16,0.05);--shS:0 -8px 32px rgba(11,13,16,0.16)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="padding: 20px 20px 0; display: flex; align-items: flex-end; gap: 12px">
<div style="flex: 1"><div class="lbl">HOLE</div><div class="mono" style="font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1">14</div></div>
<div style="text-align: right; font-size: 15px; color: var(--tx2)">Par 5 · 512 yd<br>SI 7</div>
</div>
<div style="margin: 18px 16px 0; height: 210px; border-radius: 22px; background: var(--s1)"></div>
<div style="margin: 10px 16px 0; height: 210px; border-radius: 22px; background: var(--s1)"></div>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="dialog" aria-label="Fix hole 14" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--s1); border-radius: 28px 28px 0 0; box-shadow: var(--shS); padding: 10px 16px 24px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: var(--ln); margin: 0 auto 12px"></div>
<div style="display: flex; align-items: flex-start; gap: 12px"><div style="flex: 1"><div style="font-size: 22px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15">Fix hole 14</div><div style="font-size: 15px; color: var(--tx2); margin-top: 4px">Opened from the hole menu (⋯). Organizer or host link only.</div></div><button aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: var(--s2); font-size: 22px; flex: none">×</button></div>
<div class="lbl" style="margin-top: 20px">PAR</div>
<div style="display: flex; gap: 8px; margin-top: 8px"><button style="flex: 1; height: 56px; border-radius: 14px; border: 1px solid var(--ln); background: var(--bg); font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 700">3</button><button style="flex: 1; height: 56px; border-radius: 14px; border: 2px solid var(--tx); background: var(--s3); font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 700">4</button><button style="flex: 1; height: 56px; border-radius: 14px; border: 1px solid var(--ln); background: var(--bg); font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 700">5</button><button style="flex: 1; height: 56px; border-radius: 14px; border: 1px solid var(--ln); background: var(--bg); font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 700">6</button></div>
<div style="font-size: 13px; color: var(--tx2); margin-top: 8px">The card said par 5. Scores already in stay; points are re-counted.</div>
<div class="lbl" style="margin-top: 20px">STROKE INDEX</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
<button aria-label="Minus one" style="width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--ln); background: var(--bg); font-size: 26px">−</button>
<div class="mono" style="flex: 1; text-align: center; font-size: 34px; font-weight: 700">7</div>
<button aria-label="Plus one" style="width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--ln); background: var(--bg); font-size: 26px">+</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: var(--warnBg); border: 1px solid var(--warn); font-size: 14px; color: var(--warn); font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>Changes the card for all 8 players.</div>
<button style="width: 100%; height: 58px; margin-top: 16px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 17px; font-weight: 700">Save hole 14</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.mode ?? 'dark' }; }
}
</script>
</body>
</html>
