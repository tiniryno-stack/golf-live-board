<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scorecard check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--tMe:rgba(61,220,132,0.10);--warn:#F5C64A;--warnBg:rgba(245,198,74,0.12);--btn:#F4F5F7;--btnT:#0A0B0D}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--tMe:rgba(18,163,92,0.09);--warn:#8A6000;--warnBg:rgba(138,96,0,0.09);--btn:#0B0D10;--btnT:#FFFFFF}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
input::placeholder{color:var(--tx2)}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; padding: 4px 12px 0; height: 52px">
<a href="Setup-2-Round.dc.html" style="height: 48px; display: flex; align-items: center; gap: 2px; color: var(--tx2); text-decoration: none; font-size: 16px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Back</a>
</div>
<div style="padding: 2px 20px 0">
<div class="lbl">{{course}}</div>
<div style="font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">Scorecard check</div>
</div>

<div style="{{statusSt}}">
<div style="{{statusHeadSt}}">{{statusHead}}</div>
<sc-for list="{{issues}}" as="i" hint-placeholder-count="0">
<div style="display: flex; gap: 8px; margin-top: 8px; font-size: 14px; line-height: 1.35"><span style="color: var(--warn); font-weight: 700">•</span><span>{{i}}</span></div>
</sc-for>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="2"><span class="mono" style="font-size: 11px; padding: 4px 8px; border-radius: 6px; background: var(--s2); color: var(--tx2)">{{s}}</span></sc-for>
</div>
</div>

<sc-for list="{{nines}}" as="n" hint-placeholder-count="2">
<div style="margin: 12px 16px 0; border-radius: 18px; background: var(--s1); padding: 10px 8px 10px">
<sc-for list="{{n.rows}}" as="r" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 42px repeat(9, minmax(0, 1fr)) 36px; gap: 3px; align-items: center; margin-top: 3px">
<div style="{{r.labelSt}}">{{r.label}}</div>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="9">
<sc-if value="{{c.input}}" hint-placeholder-val="{{ true }}"><input class="mono" value="{{c.v}}" placeholder="{{c.ph}}" aria-label="{{c.aria}}" inputmode="numeric" style="{{c.st}}"></sc-if>
<sc-if value="{{c.head}}" hint-placeholder-val="{{ false }}"><div class="mono" style="text-align: center; font-size: 12px; font-weight: 700; color: var(--tx2)">{{c.v}}</div></sc-if>
</sc-for>
<div class="mono" style="{{r.totSt}}">{{r.tot}}</div>
</div>
</sc-for>
</div>
</sc-for>

<div style="margin: 12px 20px 0; font-size: 13px; color: var(--tx2); line-height: 1.45">{{hint}}</div>
<div style="margin: 8px 20px 0; font-size: 11px; color: var(--tx2); opacity: 0.85">{{credit}}</div>

<div style="margin: auto 16px 16px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{hasSecondary}}" hint-placeholder-val="{{ false }}"><button style="height: 52px; border-radius: 16px; border: 1px solid var(--ln); background: transparent; font-size: 16px; font-weight: 600">{{secondary}}</button></sc-if>
<button style="{{primarySt}}">{{primary}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"variant":{"editor":"enum","options":["good","fix","hand"],"default":"good"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var V = this.props.variant ?? 'good';
    var D = {
      good: { course: 'TWIN CREEKS · BLUE TEES',
        parF: [5, 4, 3, 4, 4, 5, 3, 4, 4], parB: [4, 3, 4, 5, 4, 3, 5, 4, 4],
        hcpF: [5, 11, 15, 1, 7, 3, 17, 9, 13], hcpB: [6, 16, 10, 2, 8, 18, 4, 12, 14],
        bad: {}, head: '✓ All good · par 72 · hole handicaps 1–18', tone: 'good', issues: [],
        sources: ['Checked against the card', 'Used in 3 rounds'],
        hint: 'Tap any number to change it. The organizer can also fix a hole mid-round from the ••• menu.',
        credit: 'Course data © OpenStreetMap contributors (ODbL 1.0) via OpenGolfAPI',
        primary: 'Looks right', primaryOn: true },
      fix: { course: 'BEAR CREEK · COURSE 2',
        parF: [5, 4, 3, 4, 4, 3, null, 4, 5], parB: [4, 4, 3, 8, 4, 5, 3, 4, 4],
        hcpF: [7, 13, 4, 1, 11, 15, 17, 3, 5], hcpB: [8, 6, 4, 2, 10, 18, 16, 12, 14],
        bad: { 'p7': 1, 'p14': 1, 'h3': 1, 'h12': 1 }, head: '3 things to fix before you start', tone: 'warn',
        issues: ['Hole 7 has no par.', 'Hole 14 says par 8. Par is always 3 to 6.', 'Handicap 4 is on holes 3 and 12, and 9 isn’t used. Each number 1–18 goes on one hole.'],
        sources: ['From course data', 'Not checked yet'],
        hint: 'Copy from the paper card. Hcp is the “Handicap” row: 1 is the hardest hole.',
        credit: 'Course data © OpenStreetMap contributors (ODbL 1.0) via OpenGolfAPI',
        primary: 'Fix 3 things to continue', primaryOn: false },
      hand: { course: 'OLD MILL LINKS · ENTERED BY HAND',
        parF: [4, 5, 3, 4, 4, 4, 3, 5, 4], parB: [null, null, null, null, null, null, null, null, null],
        hcpF: [9, 3, 17, 5, 13, 1, 15, 7, 11], hcpB: [null, null, null, null, null, null, null, null, null],
        bad: {}, head: '9 of 18 holes filled in', tone: 'hand', issues: [],
        sources: ['Entered by you'],
        hint: 'Copy the Par and Handicap rows from the paper card. Hcp 1 = hardest hole, 18 = easiest, each used once.',
        credit: '',
        primary: 'Save card · 9 holes left', primaryOn: false, secondary: 'Start now, finish it during the round' }
    }[V];
    function cell(v, key, aria, holeBlank) {
      var bad = D.bad[key];
      var empty = v === null;
      return { input: true, head: false, v: empty ? '' : String(v), ph: '–', aria: aria,
        st: 'width: 100%; height: 44px; box-sizing: border-box; border-radius: 8px; text-align: center; font-size: 15px; font-weight: 600; padding: 0; outline: none; ' +
          (bad ? 'border: 2px solid var(--warn); background: var(--warnBg)' : (empty ? 'border: 1.5px dashed var(--ln); background: transparent' : 'border: 0; background: var(--s2)')) };
    }
    function sum(a) { var s = 0, ok = true; a.forEach(function (x) { if (x === null) ok = false; else s += x; }); return ok ? String(s) : '–'; }
    function nine(par, hcp, start, totLabel) {
      return { rows: [
        { label: 'Hole', labelSt: 'font-size: 11px; color: var(--tx2)', cells: par.map(function (x, i) { return { input: false, head: true, v: String(start + i) }; }), tot: totLabel, totSt: 'text-align: center; font-size: 10px; color: var(--tx2)' },
        { label: 'Par', labelSt: 'font-size: 13px; font-weight: 600', cells: par.map(function (x, i) { return cell(x, 'p' + (start + i), 'Hole ' + (start + i) + ' par'); }), tot: sum(par), totSt: 'text-align: center; font-size: 14px; font-weight: 700' },
        { label: 'Hcp', labelSt: 'font-size: 13px; font-weight: 600', cells: hcp.map(function (x, i) { return cell(x, 'h' + (start + i), 'Hole ' + (start + i) + ' handicap'); }), tot: '', totSt: '' }
      ] };
    }
    var toneSt = {
      good: 'border: 1.5px solid var(--meT); background: var(--tMe)',
      warn: 'border: 1.5px solid var(--warn); background: var(--warnBg)',
      hand: 'border: 1px solid var(--ln); background: var(--s1)'
    }[D.tone];
    var headColor = D.tone === 'good' ? 'var(--meT)' : (D.tone === 'warn' ? 'var(--warn)' : 'var(--tx)');
    return {
      mode: this.props.mode ?? 'dark',
      course: D.course,
      statusSt: 'margin: 14px 16px 0; border-radius: 18px; padding: 12px 14px; ' + toneSt,
      statusHeadSt: 'font-size: 16px; font-weight: 700; color: ' + headColor,
      statusHead: D.head, issues: D.issues, sources: D.sources,
      nines: [nine(D.parF, D.hcpF, 1, 'OUT'), nine(D.parB, D.hcpB, 10, 'IN')],
      hint: D.hint, credit: D.credit,
      hasSecondary: !!D.secondary, secondary: D.secondary || '',
      primary: D.primary,
      primarySt: 'height: 60px; border-radius: 18px; border: 0; font-size: 18px; font-weight: 700; ' + (D.primaryOn ? 'background: var(--btn); color: var(--btnT)' : 'background: var(--s2); color: var(--tx2)')
    };
  }
}
</script>
</body>
</html>
