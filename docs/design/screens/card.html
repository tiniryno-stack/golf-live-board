<!doctype html>

<head>

<title>Night Round · Card</title>

</head>

<style>

button{font:inherit;color:inherit;cursor:pointer}
.fold{overflow:hidden;transition:max-height 460ms cubic-bezier(.2,.8,.2,1),opacity 320ms ease}
.chev{transition:transform 320ms ease}

</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 18px 20px 0">
<div>
<div class="mono" style="font-size: 11px; letter-spacing: 1.2px; color: var(--tx2); font-weight: 600">TWIN CREEKS · BLUE TEES</div>
<div style="font-size: 30px; font-weight: 800; letter-spacing: -0.9px; margin-top: 2px">Scorecard</div>
</div>
<div class="seg" style="display: flex; padding: 3px; border-radius: 12px; background: var(--s1)">

<button style="height: 42px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; font-size: 13px; color: var(--tx2)">Net</button>
</div>
</div>

<div class="seg" style="display: flex; gap: 4px; margin: 14px 16px 0; padding: 4px; border-radius: 14px; background: var(--s1)">
<button onClick="{{showFront}}" style="{{frontSt}}">Front 9</button>
<button onClick="{{showBack}}" style="{{backSt}}">Back 9</button>

<div class="fold" style="{{mineBarSt}}">
<button onClick="{{openMine}}" style="width: calc(100% - 32px); margin: 12px 16px 0; height: 56px; border-radius: 16px; border: 1.5px solid var(--me); background: var(--tint); display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left">
<span style="flex: 1">
<span class="mono" style="display: block; font-size: 10px; letter-spacing: 1.1px; color: var(--meT); font-weight: 600">YOUR GROUP · ON 11</span>
<span style="display: block; font-size: 14px; font-weight: 600; margin-top: 2px">Andrew B. · Sean · Sam · Jake</span>
</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--meT)"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>

<div class="fold" style="{{mineFullSt}}">
<div style="margin: 12px 16px 0; border-radius: 18px; background: var(--s1); padding: 8px 8px 6px">

</sc-if>
<sc-if value="{{g.isRow}}" hint-placeholder-val="{{ true }}">
<a href="{{g.href}}" style="{{g.rowSt}}">
<div style="{{g.labelSt}}">{{g.label}}</div>
<sc-for list="{{g.cells}}" as="c" hint-placeholder-count="9">
<div style="{{c.wrap}}"><span class="mono" style="{{c.st}}">{{c.v}}</span></div>
</sc-for>
<div class="mono" style="{{g.totSt}}">{{g.tot}}</div>

</sc-if>
</sc-for>
</div>
</div>

<div style="margin: 12px 16px 0; border-radius: 18px; border: 1px solid var(--ln); overflow: hidden">
<button onClick="{{toggleOther}}" style="width: 100%; min-height: 52px; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; font-size: 14px; text-align: left">
<span class="mono" style="font-size: 11px; color: var(--tx2); letter-spacing: 1px">{{otherLbl}}</span>
<span style="color: var(--blue); font-weight: 700">Shank</span>
<span style="color: var(--tx2)">+</span>
<span style="color: var(--vio); font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Bogey Brigade</span>
<span class="mono" style="font-size: 12px; color: var(--tx2)">on 10</span>
<svg class="chev" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="{{chevSt}}"><path d="M6 9l6 6 6-6"></path></svg>

<span class="mono" style="flex: 1; text-align: right; font-size: 12px; color: var(--tx2)">{{g.right}}</span>
</div>
</sc-if>
<sc-if value="{{g.isRow}}" hint-placeholder-val="{{ true }}">
<a href="{{g.href}}" style="{{g.rowSt}}">
<div style="{{g.labelSt}}">{{g.label}}</div>
<sc-for list="{{g.cells}}" as="c" hint-placeholder-count="9">
<div style="{{c.wrap}}"><span class="mono" style="{{c.st}}">{{c.v}}</span></div>
</sc-for>
<div class="mono" style="{{g.totSt}}">{{g.tot}}</div>
</a>
</sc-if>
</sc-for>
</div>
</div>
</div>

<div style="display: flex; justify-content: center; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--tx2)">
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 6px; border: 3px double var(--tx); box-sizing: border-box"></span>Eagle</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 6px; border: 1.5px solid var(--tx); box-sizing: border-box"></span>Birdie</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid var(--tx2); box-sizing: border-box"></span>Bogey</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 2px; background: var(--dblBg); border: 3px double var(--dbl); box-sizing: border-box"></span>Double+</span>
</div>

<nav style="margin: auto 12px 10px; display: flex; gap: 4px; padding: 5px; background: var(--s1); border: 1px solid var(--ln); border-radius: 22px">
<a href="Main.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; color: var(--tx2); text-decoration: none; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Enter</a>
<a href="A-Matches-v3a-expand.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; color: var(--tx2); text-decoration: none; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg>Matches</a>
<a href="A-Board.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; color: var(--tx2); text-decoration: none; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg>Board</a>
<a href="A-Card.dc.html" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 17px; background: var(--btn); color: var(--btnT); text-decoration: none; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg>Card</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"startNine":{"editor":"enum","options":["back","front"],"default":"back"},"startGroup":{"editor":"enum","options":["mine","other"],"default":"mine"},"$preview":{"width":393,"height":852}}'>
