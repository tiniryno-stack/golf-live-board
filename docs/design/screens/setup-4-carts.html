<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New round · Players and carts (8 players)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--tMe:rgba(61,220,132,0.10);--tBlue:rgba(91,155,255,0.12);--tPink:rgba(255,111,181,0.12);--tVio:rgba(177,140,255,0.12);--btn:#F4F5F7;--btnT:#0A0B0D}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--tMe:rgba(18,163,92,0.09);--tBlue:rgba(26,95,208,0.08);--tPink:rgba(192,42,112,0.08);--tVio:rgba(110,63,208,0.08);--btn:#0B0D10;--btnT:#FFFFFF}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 0; height: 52px">
<a href="Setup-Game-Pick.dc.html" style="height: 48px; display: flex; align-items: center; gap: 2px; color: var(--tx2); text-decoration: none; font-size: 16px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Game</a>
<div style="display: flex; gap: 4px"><span style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></span><span style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></span><span style="width: 22px; height: 4px; border-radius: 2px; background: var(--ln)"></span></div>
</div>
<div style="padding: 2px 20px 0">
<div class="lbl">STEP 4 · CART GAME SETUP</div>
<div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">8 players, 4 carts</div>
</div>

<div style="margin: 14px 16px 0; height: 56px; border-radius: 16px; background: var(--s1); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px">
<div style="flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 700">Cart game</span> <span style="color: var(--tx2)">· 8 players · Twin Creeks</span></div>
<button style="height: 48px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--s2); font-size: 14px; font-weight: 600">Change</button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin: 16px 20px 8px">
<div style="font-size: 13px; color: var(--tx2)">Paired like your last round · tap two names to swap</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 16px">
<sc-for list="{{carts}}" as="c" hint-placeholder-count="4">
<div style="{{c.cardSt}}">
<div class="mono" style="{{c.tagSt}}">{{c.tag}}</div>
<div style="{{c.nameSt}}">{{c.name}}</div>
<sc-for list="{{c.players}}" as="p" hint-placeholder-count="2">
<button style="width: 100%; height: 48px; margin-top: 6px; border-radius: 12px; border: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 15px; font-weight: 600"><span>{{p.n}}</span><span class="mono" style="font-size: 12px; color: var(--tx2)">{{p.h}}</span></button>
</sc-for>
</div>
</sc-for>
</div>

<div style="display: flex; gap: 8px; margin: 10px 16px 0">
<button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid var(--ln); background: transparent; font-size: 14px; font-weight: 600">Shuffle carts</button>
<button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid var(--ln); background: transparent; font-size: 14px; font-weight: 600">Edit players</button>
</div>

<a href="Setup-F3-Game.dc.html" style="margin: auto 16px 0; min-height: 56px; border-radius: 16px; background: var(--s1); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--tx); text-decoration: none">
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Game &amp; matchups</span><span style="display: block; font-size: 12px; color: var(--tx2); margin-top: 2px">Match play · low ball + total · 3 rotations</span></span>
<span style="font-size: 13px; color: var(--tx2)">Optional</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--tx2)"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="Setup-Share.dc.html" style="margin: 8px 16px 16px; height: 60px; border-radius: 18px; background: var(--btn); color: var(--btnT); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Start round · 8 players</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    function cart(tag, name, c, t, players, placeholder) {
      return { tag: tag, name: name, players: players,
        cardSt: 'border-radius: 18px; background: ' + t + '; border: 1.5px solid ' + c + '; padding: 12px 10px 10px',
        tagSt: 'font-size: 11px; letter-spacing: 1px; font-weight: 700; color: ' + c,
        nameSt: 'font-size: 15px; font-weight: 700; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis' + (placeholder ? '; color: var(--tx2); font-weight: 500; font-style: italic' : '') };
    }
    return {
      mode: this.props.mode ?? 'dark',
      carts: [
        cart('CART A · YOU', 'Hogan’s Heroes', 'var(--meT)', 'var(--tMe)', [{ n: 'Andrew B.', h: '14' }, { n: 'Sean', h: '18' }]),
        cart('CART B', 'Shank Redemption', 'var(--blue)', 'var(--tBlue)', [{ n: 'Mike', h: '12' }, { n: 'Tyler', h: '16' }]),
        cart('CART C', 'Fore Play', 'var(--pink)', 'var(--tPink)', [{ n: 'Sam', h: '10' }, { n: 'Jake', h: '15' }]),
        cart('CART D', 'Names itself on join', 'var(--vio)', 'var(--tVio)', [{ n: 'Chris', h: '17' }, { n: 'Christopher', h: '20' }], true)
      ]
    };
  }
}
</script>
</body>
</html>
