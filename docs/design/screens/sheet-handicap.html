<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Players · handicap sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--org:#FF9A4A;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--err:#FF5A5A;--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10);--scrim:rgba(0,0,0,0.6);--shC:none;--shS:0 -8px 32px rgba(0,0,0,0.5)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#DDE0E5;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--org:#B85A00;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--err:#C8282D;--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10);--scrim:rgba(11,13,16,0.35);--shC:0 1px 2px rgba(11,13,16,0.06),0 4px 12px rgba(11,13,16,0.05);--shS:0 -8px 32px rgba(11,13,16,0.16)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 0"><button aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: var(--s1); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button><div class="lbl" style="flex: 1">STEP 2 OF 3</div></div>
<div style="padding: 14px 20px 0"><div style="font-size: 32px; font-weight: 800; letter-spacing: -1px">Players</div></div>
<div style="padding: 12px 16px 0"><div style="display: grid; grid-template-columns: minmax(0,1fr) 64px 48px; gap: 8px"><div></div><div class="lbl" style="text-align: center">HCP</div><div></div></div><div style="display: grid; grid-template-columns: minmax(0,1fr) 64px 48px; align-items: center; gap: 8px; height: 60px; border-bottom: 1px solid var(--ln)"><div style="font-size: 17px; font-weight: 600">Andrew <span class="lbl" style="color: var(--meT)">YOU</span></div><div class="mono" style="height: 40px; border-radius: 10px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-weight: 700">12</div><div></div></div><div style="display: grid; grid-template-columns: minmax(0,1fr) 64px 48px; align-items: center; gap: 8px; height: 60px; border-bottom: 1px solid var(--ln)"><div style="font-size: 17px; font-weight: 600">Sean</div><div class="mono" style="height: 40px; border-radius: 10px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-weight: 700">18</div><div></div></div><div style="display: grid; grid-template-columns: minmax(0,1fr) 64px 48px; align-items: center; gap: 8px; height: 60px; border-bottom: 1px solid var(--ln)"><div style="font-size: 17px; font-weight: 600">Jake</div><div class="mono" style="height: 40px; border-radius: 10px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-weight: 700">9</div><div></div></div><div style="display: grid; grid-template-columns: minmax(0,1fr) 64px 48px; align-items: center; gap: 8px; height: 60px; border-bottom: 1px solid var(--ln)"><div style="font-size: 17px; font-weight: 600">Sam</div><div class="mono" style="height: 40px; border-radius: 10px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-weight: 700">22</div><div></div></div><div style="display: grid; grid-template-columns: minmax(0,1fr) 64px 48px; align-items: center; gap: 8px; height: 60px; border-bottom: 1px solid var(--ln)"><div style="font-size: 17px; font-weight: 600">Mike</div><div class="mono" style="height: 40px; border-radius: 10px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-weight: 700">5</div><div></div></div></div>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="dialog" aria-label="Sean’s handicap" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--s1); border-radius: 28px 28px 0 0; box-shadow: var(--shS); padding: 10px 16px 24px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: var(--ln); margin: 0 auto 12px"></div>
<div style="display: flex; align-items: flex-start; gap: 12px"><div style="flex: 1"><div style="font-size: 22px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15">Sean’s handicap</div><div style="font-size: 15px; color: var(--tx2); margin-top: 4px">Strokes he gets over 18 holes. Tap a number to type it.</div></div><button aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: var(--s2); font-size: 22px; flex: none">×</button></div>
<div style="display: flex; align-items: center; gap: 12px; margin: 20px 0 8px">
<button aria-label="Minus one" style="width: 88px; height: 88px; border-radius: 22px; border: 1px solid var(--ln); background: var(--bg); font-size: 36px">−</button>
<div style="flex: 1; text-align: center"><div class="mono" style="font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1">18</div><div style="font-size: 13px; color: var(--tx2); margin-top: 4px">was 17 last round</div></div>
<button aria-label="Plus one" style="width: 88px; height: 88px; border-radius: 22px; border: 1px solid var(--ln); background: var(--bg); font-size: 36px">+</button>
</div>
<div style="display: flex; gap: 8px; margin: 14px 0 16px">
<button style="flex: 1; height: 48px; border-radius: 12px; border: 0; background: var(--s2); font-size: 15px; font-weight: 600">Use full</button>
<button style="flex: 1; height: 48px; border-radius: 12px; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: var(--tx2)">No strokes</button>
</div>
<button style="width: 100%; height: 58px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 17px; font-weight: 700">Done</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.mode ?? 'dark' }; }
}
</script>
</body>
</html>
