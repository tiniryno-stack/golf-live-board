<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · first time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--org:#FF9A4A;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--err:#FF5A5A;--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10);--scrim:rgba(0,0,0,0.6);--shC:none;--shS:0 -8px 32px rgba(0,0,0,0.5)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#DDE0E5;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--org:#B85A00;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--err:#C8282D;--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10);--scrim:rgba(11,13,16,0.35);--shC:0 1px 2px rgba(11,13,16,0.06),0 4px 12px rgba(11,13,16,0.05);--shS:0 -8px 32px rgba(11,13,16,0.16)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; height: 48px">
<div style="width: 36px; height: 36px; border-radius: 18px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">AD</div>
<div style="flex: 1; font-size: 15px; font-weight: 600">Andrew</div>
<button style="height: 48px; padding: 0 16px; border-radius: 12px; border: 0; background: transparent; font-size: 15px; font-weight: 600">Settings</button>
</div>
<div style="padding: 18px 20px 0"><div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Golf Live Board</div></div>

<div style="margin: 28px 16px 0; border-radius: 22px; border: 1.5px dashed var(--ln); padding: 28px 20px; text-align: center">
<div style="width: 64px; height: 64px; border-radius: 32px; background: var(--s2); display: flex; align-items: center; justify-content: center; margin: 0 auto"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></div>
<div style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-top: 14px">No rounds yet</div>
<div style="font-size: 15px; color: var(--tx2); margin-top: 6px; line-height: 1.4">Start one and text the code to your group, or join a round a friend started.</div>
</div>

<div style="margin: 20px 20px 0">
<label for="jc" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px">Got a code from a friend?</label>
<div style="display: flex; gap: 8px">
<input id="jc" placeholder="e.g. TC4821" class="mono" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid var(--ln); background: var(--s1); padding: 0 14px; font-family: 'Geist Mono', monospace; font-size: 18px; letter-spacing: 3px; color: var(--tx); outline: none">
<button style="height: 52px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--s2); font-size: 16px; font-weight: 600">Join</button>
</div>
</div>

<div style="margin: auto 16px 8px; display: flex; flex-direction: column; align-items: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--tx2)"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
</div>
<button style="margin: 0 16px 16px; height: 60px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New round</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.mode ?? 'dark' }; }
}
</script>
</body>
</html>
