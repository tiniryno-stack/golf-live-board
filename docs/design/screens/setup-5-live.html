<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New round · Share the code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--btn:#F4F5F7;--btnT:#0A0B0D}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--btn:#0B0D10;--btnT:#FFFFFF}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 36px 20px 0; text-align: center">
<div style="width: 56px; height: 56px; border-radius: 28px; margin: 0 auto; background: var(--me); color: var(--btnT); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
<div style="font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-top: 14px">Round is live</div>
<div style="font-size: 15px; color: var(--tx2); margin-top: 4px">Twin Creeks · Fri · Blue tees · 3 players</div>
</div>

<div style="margin: 24px 16px 0; border-radius: 22px; background: var(--s1); padding: 18px 16px 16px; text-align: center">
<div class="lbl">JOIN CODE</div>
<div class="mono" style="font-size: 52px; font-weight: 700; letter-spacing: 8px; margin-top: 6px; padding-left: 8px">TC4821</div>
<div class="mono" style="font-size: 13px; color: var(--tx2); margin-top: 6px">[app link]/j/TC4821</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
<button style="height: 54px; border-radius: 14px; border: 0; background: var(--btn); color: var(--btnT); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>Text the group</button>
<button style="height: 54px; border-radius: 14px; border: 0; background: var(--s2); font-size: 16px; font-weight: 600">Copy link</button>
</div>
</div>

<div style="margin: 14px 16px 0; border-radius: 20px; background: var(--warnBg); border: 1.5px dashed var(--warn); padding: 14px 16px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--warn)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Organizer only · screenshot this, keep it private</div>
<div style="display: grid; grid-template-columns: 82px minmax(0, 1fr); row-gap: 10px; align-items: center; margin-top: 12px; font-size: 14px">
<div style="color: var(--tx2)">Admin PIN</div>
<div class="mono" style="font-size: 22px; font-weight: 700; letter-spacing: 4px">7319</div>
<div style="color: var(--tx2)">Host link</div>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0"><span class="mono" style="flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[app link]/h/TC4821</span><button style="height: 48px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--s2); font-size: 13px; font-weight: 600">Copy</button></div>
</div>
<div style="font-size: 12px; color: var(--tx2); margin-top: 10px; line-height: 1.4">Lets you fix scores and the scorecard from any phone if this one dies.</div>
</div>

<button style="margin: auto 16px 16px; height: 60px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 18px; font-weight: 700">Open the round</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.mode ?? 'dark' }; }
}
</script>
</body>
</html>
