<!-- @dsCard group="Teams" height=120 subtitle="Matchup rows and tee groups" -->
<div class="root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
.root{font-family:var(--font-sans);color:var(--text);background:var(--bg);padding:16px;max-width:393px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:var(--radius-xl);background:var(--surface-1)}
.h{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);width:46px}
.pair{display:flex;align-items:center;gap:4px}
.vs{font-size:11px;color:var(--text-muted)}
.c{font-size:13px;font-weight:700;min-width:32px;height:30px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;border-radius:var(--radius-sm);border:1.5px solid;white-space:nowrap}
</style>
<div class="row">
<span class="h">7–12</span>
<span class="pair"><span class="c" style="color:var(--cart-you-text);background:var(--tint-you);border-color:var(--cart-you-text)">A · You</span><span class="vs">vs</span><span class="c" style="color:var(--cart-c);background:var(--tint-c);border-color:var(--cart-c)">C</span></span>
<span class="pair" style="margin-left:8px"><span class="c" style="color:var(--cart-b);background:var(--tint-b);border-color:var(--cart-b)">B</span><span class="vs">vs</span><span class="c" style="color:var(--cart-d);background:var(--tint-d);border-color:var(--cart-d)">D</span></span>
</div>
</div>
