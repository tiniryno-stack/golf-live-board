<!-- @dsCard height=288 -->
<div class="root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
.root{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;left:480px;top:0}
.you{fill:var(--cart-you)}.b{fill:var(--cart-b)}.c{fill:var(--cart-c)}.d{fill:var(--cart-d)}.s2{fill:var(--surface-2)}
.ring{fill:none;stroke:var(--bg);stroke-width:6}
.sq{fill:none;stroke:var(--bg);stroke-width:6}
.t{position:absolute;left:40px;bottom:36px;max-width:440px}
.n{font-size:80px;line-height:.95;font-weight:800;letter-spacing:-3px;color:var(--text)}
.g{margin-top:14px;font-size:14px;color:var(--text-muted)}
</style>
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
<!-- blocks: cart-you 176x240 (radius-2xl), cart-b and cart-c 128x112 (radius-lg), cart-d 140x240 bleeding off the right edge (radius-2xl), surface-2 strip 128x24
     arrangement: one tall green slab, two stacked team blocks, a violet slab bleeding right — the 2x2 cart grid stretched into columns
     pattern: literal score marks (birdie ring, bogey square) cut from the ground — the system's defining motif
     steps/radii: gaps space-4 (16), inset space-6 (24); radius-2xl 24, radius-lg 16, radius-sm 8 on the square -->
<rect class="you" x="20" y="24" width="176" height="240" rx="24"/>
<rect class="b" x="212" y="24" width="128" height="112" rx="16"/>
<rect class="c" x="212" y="152" width="128" height="112" rx="16"/>
<rect class="d" x="356" y="24" width="140" height="240" rx="24"/>
<circle class="ring" cx="108" cy="144" r="52"/>
<circle class="ring" cx="276" cy="80" r="26"/>
<rect class="sq" x="386" y="104" width="64" height="64" rx="8"/>
</svg>
<div class="t"><div class="n">Golf Live<br>Board</div><div class="g">Night Round · fast scoring and live trash talk for your group.</div></div>
</div>
