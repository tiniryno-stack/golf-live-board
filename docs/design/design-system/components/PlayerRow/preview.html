<div class="root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
.root{font-family:var(--font-sans);color:var(--text);background:var(--bg);padding:16px;max-width:393px;box-sizing:border-box}
.hd{display:flex;align-items:flex-end;padding:0 0 8px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:1.1px;color:var(--text-muted);font-weight:600}

.r{min-height:58px;display:flex;align-items:center;gap:2px;padding:0 2px 0 14px}
.r+.r{border-top:1px solid var(--line)}
.n{flex:1}.n b{display:block;font-size:16px;font-weight:600}.n i{display:block;font-style:normal;font-size:12px;color:var(--text-muted);margin-top:2px}
.n i.you{color:var(--cart-you-text)}
.pill{width:64px;height:44px;flex:none;border-radius:var(--radius-md);border:0;background:var(--surface-2);font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--text)}
.pill.add{background:transparent;border:1.5px dashed var(--line);color:var(--text-muted);font-size:13px}
.x{width:48px;height:48px;border:0;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex:none}
