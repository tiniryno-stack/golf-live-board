<!-- @dsCard group="Teams" height=260 subtitle="Tint plus full outline, never a side stripe" -->
<div class="root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
.root{font-family:var(--font-sans);color:var(--text);background:var(--bg);padding:16px;max-width:393px;box-sizing:border-box;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.c{border-radius:var(--radius-xl);padding:12px 10px 10px;border:1.5px solid}
.tag{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;font-weight:700}
.nm{font-size:15px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.ph{color:var(--text-muted);font-weight:500;font-style:italic}
.p{width:100%;height:48px;margin-top:6px;border-radius:var(--radius-md);border:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:inherit;font-size:15px;font-weight:600;color:var(--text);box-sizing:border-box}
.p span{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
</style>
<div class="c" style="background:var(--tint-you);border-color:var(--cart-you-text)"><div class="tag" style="color:var(--cart-you-text)">CART A · YOU</div><div class="nm">Hogan’s Heroes</div><button class="p">Andrew B.<span>14</span></button><button class="p">Sean<span>18</span></button></div>
<div class="c" style="background:var(--tint-d);border-color:var(--cart-d)"><div class="tag" style="color:var(--cart-d)">CART D</div><div class="nm ph">Names itself on join</div><button class="p">Chris<span>17</span></button><button class="p">Christopher<span>20</span></button></div>
</div>
