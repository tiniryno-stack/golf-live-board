<!-- @dsCard group="Feedback" height=200 subtitle="Confirms an action, then leaves" -->
<div class="root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
.root{font-family:var(--font-sans);color:var(--text);background:var(--bg);padding:20px 16px;max-width:393px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px}
.t{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 8px 0 16px;border-radius:24px;background:var(--surface-2);box-shadow:var(--shadow-float);font-size:15px;font-weight:600}
.t svg{flex:none}
.u{height:40px;padding:0 14px;border-radius:20px;border:0;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--text-muted)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--warn)}
</style>
<div class="t" style="padding-right:16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Link copied</div>
<div class="t"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Sean removed<button class="u">Undo</button></div>
<div class="pill"><span class="dot"></span>Reconnecting… scores will send when you’re back</div>
</div>
