<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter · as built today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--dbl:#FF6B6B;--dblBg:rgba(255,107,107,0.16);--glass:rgba(24,26,31,0.72);--glassLn:rgba(255,255,255,0.09);--dock:inset 0 1px 0 rgba(255,255,255,.10),0 0 28px rgba(255,255,255,.06);--card:none}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#FFFFFF;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--dbl:#B42318;--dblBg:rgba(180,35,24,0.10);--glass:rgba(255,255,255,0.74);--glassLn:rgba(11,13,16,0.08);--dock:0 8px 24px rgba(11,13,16,.12);--card:0 1px 2px rgba(11,13,16,.06),0 4px 12px rgba(11,13,16,.05)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; position: relative; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 0; height: 44px">
<div style="width: 32px; height: 32px; border-radius: 16px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">AD</div>
<div style="font-size: 15px; font-weight: 600">Andrew</div>
<div style="flex: 1; text-align: right; font-size: 14px; color: var(--tx2)">Sherrill Park · Sat</div>
</div>

<div style="display: flex; align-items: center; padding: 6px 8px 0">
<button aria-label="Previous hole" style="width: 52px; height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex: 1; text-align: center">
<div style="font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1">Hole 16</div>
<div style="font-size: 15px; color: var(--tx2); margin-top: 4px">Par 4 · Hcp 9 · 388 yds</div>
</div>
<button aria-label="Next hole" style="width: 52px; height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; opacity: 0.35"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>

<div style="margin: 12px 16px 0; border-radius: 24px; background: var(--s1); border: 1.5px solid var(--me); padding: 12px; box-shadow: var(--card)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--me)"></span><span style="color: var(--tx2); font-weight: 600">vs</span><span>Joseph + Jay</span></div>
<div class="mono" style="font-size: 13px"><span style="color: var(--meT); font-weight: 700">UP 2</span><span style="color: var(--tx2)"> · CUP 5½–3½</span></div>
</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="2">
<div style="{{p.rowSt}}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
<div style="font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px">{{p.name}}<span style="{{p.strokeSt}}"></span></div>
<div class="mono" style="{{p.labelSt}}">{{p.label}}</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 10px">
<button onClick="{{p.minus}}" aria-label="Minus" style="width: 88px; height: 88px; border-radius: 20px; border: 1px solid var(--ln); background: var(--bg); font-size: 38px">−</button>
<div style="flex: 1; display: flex; justify-content: center"><span class="mono" style="{{p.mark}}">{{p.v}}</span></div>
<button onClick="{{p.plus}}" aria-label="Plus" style="width: 88px; height: 88px; border-radius: 20px; border: 1px solid var(--ln); background: var(--bg); font-size: 38px">+</button>
</div>
</div>
</sc-for>
</div>

<div style="margin: 10px 16px 0; height: 56px; border-radius: 14px; background: var(--s1); display: flex; align-items: center; gap: 10px; padding: 0 4px 0 14px; box-shadow: var(--card)">
<span style="width: 8px; height: 8px; border-radius: 4px; background: var(--tx2)"></span>
<div style="font-size: 14px; font-weight: 700">Sean + Baker</div>
<div class="mono" style="flex: 1; font-size: 14px; display: flex; align-items: center; gap: 6px; justify-content: flex-end; padding-right: 6px">Sean <span style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">4</span> Baker <span style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; border-radius: 4px; border: 1.5px solid var(--tx2); box-sizing: border-box">5</span></div>
<button style="height: 48px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--s2); font-size: 14px; font-weight: 600">Edit</button>
</div>

<div style="margin: 16px 16px 0; display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="18"><div style="{{s}}"></div></sc-for>
</div>

<button style="{{nextSt}}">{{nextLabel}}</button>

<nav aria-label="Round" style="position: absolute; left: 16px; right: 16px; bottom: 20px; z-index: 10; display: flex; padding: 6px; border-radius: 34px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); border: 1px solid var(--glassLn); box-shadow: var(--dock)">
<a href="Enter-today.dc.html" aria-label="Enter" aria-current="page" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: var(--s3); color: var(--tx)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></a>
<a href="Matches-fill-partial.dc.html" aria-label="Matches" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg></a>
<a href="Board-v2.dc.html" aria-label="Board" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg></a>
<a href="Board-v2.dc.html" aria-label="Card" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { Andrew: 4, Alex: null }; }
  renderVals() {
    var self = this, par = 4;
    function mark(v) {
      var b = 'width: 112px; height: 112px; display: inline-flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 700; letter-spacing: -2px; box-sizing: border-box; ';
      if (v == null) return b + 'border: 2px dashed var(--ln); border-radius: 50%; color: var(--tx2); opacity: .6';
      var d = v - par;
      if (d <= -2) return b + 'border: 9px double var(--tx); border-radius: 50%';
      if (d === -1) return b + 'border: 2px solid var(--tx); border-radius: 50%';
      if (d === 0) return b;
      if (d === 1) return b + 'border: 2px solid var(--tx2); border-radius: 18px';
      return b + 'border: 9px double var(--dbl); border-radius: 18px; background: var(--dblBg); color: var(--dbl)';
    }
    function label(v) { if (v == null) return ['TAP − / + · PAR', 'color: var(--tx2)']; var d = v - par; return [['EAGLE', 'BIRDIE', 'PAR', 'BOGEY', 'DOUBLE', 'TRIPLE'][Math.max(0, Math.min(5, d + 2))], d < 0 ? 'color: var(--meT)' : d >= 2 ? 'color: var(--dbl)' : 'color: var(--tx2)']; }
    var players = ['Andrew', 'Alex'].map(function (n) {
      var v = self.state[n], l = label(v);
      return { name: n, v: v == null ? par : v, mark: mark(v), label: l[0], labelSt: 'font-size: 12px; font-weight: 600; letter-spacing: 1px; ' + l[1],
        strokeSt: n === 'Alex' ? 'width: 7px; height: 7px; border-radius: 4px; background: var(--tx)' : 'display: none',
        rowSt: 'border-radius: 16px; padding: 10px 8px; margin-top: 8px; ' + (v == null ? 'outline: 1.5px dashed var(--ln); outline-offset: -1.5px' : ''),
        minus: function () { var s = {}; s[n] = self.state[n] == null ? par : Math.max(1, self.state[n] - 1); self.setState(s); },
        plus: function () { var s = {}; s[n] = self.state[n] == null ? par : self.state[n] + 1; self.setState(s); } };
    });
    var left = players.filter(function (p) { return self.state[p.name] == null; }).length;
    var segs = []; for (var i = 1; i <= 18; i++) segs.push('flex: 1; height: 6px; border-radius: 3px; background: ' + (i < 16 ? 'var(--tx2)' : i === 16 ? 'var(--tx)' : 'var(--s2)'));
    return { mode: this.props.mode ?? 'dark', players: players, segs: segs,
      nextLabel: left ? 'Next hole · Alex left' : 'Next hole',
      nextSt: 'display: block; width: calc(100% - 32px); margin: 12px 16px 0; height: 58px; border: 0; border-radius: 18px; font-size: 17px; font-weight: 600; ' + (left ? 'background: var(--s2); color: var(--tx2)' : 'background: var(--tx); color: var(--bg)') };
  }
}
</script>
</body>
</html>
