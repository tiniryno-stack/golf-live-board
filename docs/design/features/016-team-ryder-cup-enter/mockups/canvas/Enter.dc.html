<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--dbl:#FF6B6B;--dblBg:rgba(255,107,107,0.16);--glass:rgba(24,26,31,0.72);--glassLn:rgba(255,255,255,0.09);--dock:inset 0 1px 0 rgba(255,255,255,.10),0 0 28px rgba(255,255,255,.06);--card:none}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#FFFFFF;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--dbl:#B42318;--dblBg:rgba(180,35,24,0.10);--glass:rgba(255,255,255,0.74);--glassLn:rgba(11,13,16,0.08);--dock:0 8px 24px rgba(11,13,16,.12);--card:0 1px 2px rgba(11,13,16,.06),0 4px 12px rgba(11,13,16,.05)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="height: 59px; flex: none"></div>

<div style="display: flex; align-items: center; padding: 4px 8px 0">
<button onClick="{{prev}}" aria-label="Previous hole" style="width: 52px; height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; {{prevSt}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex: 1; text-align: center">
<div style="font-size: 36px; font-weight: 800; letter-spacing: -1.3px; line-height: 1">Hole {{hole}}</div>
<div style="font-size: 14px; color: var(--tx2); margin-top: 4px">Par {{par}} · Hcp {{hcp}} · Sherrill Park</div>
</div>
<button onClick="{{next}}" aria-label="Next hole" style="width: 52px; height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; {{nextArrowSt}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>

<div role="group" aria-label="Green: front {{yd.f}}, middle {{yd.m}}, back {{yd.b}}" style="margin: 10px 16px 0; height: 92px; border-radius: 22px; background: var(--s1); display: flex; align-items: center; gap: 14px; padding: 0 14px; flex: none; box-shadow: var(--card)"><svg aria-hidden="true" width="62" height="64" viewBox="0 0 132 134" style="flex: none"><defs><clipPath id="gcr"><path d="M38 8 C78 0 124 6 126 30 C128 54 110 62 98 82 C88 100 94 128 66 128 C38 128 18 106 10 78 C4 52 6 14 38 8 Z"></path></clipPath></defs><g clip-path="url(#gcr)"><rect width="132" height="46" fill="var(--tx)" opacity="0.30"></rect><rect y="46" width="132" height="42" fill="var(--tx)" opacity="0.19"></rect><rect y="88" width="132" height="46" fill="var(--tx)" opacity="0.10"></rect></g><path d="M38 8 C78 0 124 6 126 30 C128 54 110 62 98 82 C88 100 94 128 66 128 C38 128 18 106 10 78 C4 52 6 14 38 8 Z" fill="none" stroke="var(--tx2)" stroke-width="2.5"></path><path d="M0 46 H132 M0 88 H132" stroke="var(--s1)" stroke-width="4" clip-path="url(#gcr)"></path><circle cx="66" cy="67" r="7" fill="var(--tx)"></circle></svg>
<div style="flex: 1; display: grid; grid-template-columns: 1fr 1.35fr 1fr; align-items: end; text-align: center"><span><span class="mono" style="display: block; font-size: 20px; font-weight: 600; color: var(--tx2)">{{yd.f}}</span><span class="mono" style="font-size: 10px; letter-spacing: 1px; font-weight: 600; color: var(--tx2)">FRONT</span></span><span><span class="mono" style="display: block; font-size: 38px; font-weight: 700; letter-spacing: -1.5px; line-height: 1">{{yd.m}}</span><span class="mono" style="font-size: 10px; letter-spacing: 1px; font-weight: 600; color: var(--tx)">MIDDLE</span></span><span><span class="mono" style="display: block; font-size: 20px; font-weight: 600; color: var(--tx2)">{{yd.b}}</span><span class="mono" style="font-size: 10px; letter-spacing: 1px; font-weight: 600; color: var(--tx2)">BACK</span></span></div></div>

<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 50%; top: 120px; transform: translateX(-50%); z-index: 20; padding: 10px 16px; border-radius: 14px; background: var(--tx); color: var(--bg); font-size: 14px; font-weight: 600; box-shadow: var(--dock); white-space: nowrap">Opens the Matches tab</div></sc-if>
<div style="{{cardSt}}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px; min-height: 36px">
<sc-if value="{{mine}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 15px; font-weight: 700"><span style="color: var(--tx2); font-weight: 600">vs</span> Joseph + Jay</div>
<div style="display: flex; align-items: center; gap: 10px"><span class="mono" style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">THRU {{thru}}</span><button onClick="{{openMatch}}" aria-label="Open your match" class="mono" style="{{flagSt}}">{{flag}}</button></div>
</sc-if>
<sc-if value="{{theirs}}" hint-placeholder-val="{{ false }}">
<div><div style="font-size: 15px; font-weight: 700">Sean + Baker</div><div class="mono" style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--tx2); margin-top: 2px">ENTERING FOR THEM</div></div>
<button onClick="{{back}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--s2); font-size: 14px; font-weight: 600">Back</button>
</sc-if>
</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="2">
<div style="margin-top: 8px; padding: 0 2px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 22px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px">{{p.name}}<span style="{{p.strokeSt}}"></span></span><span style="font-size: 12px; color: var(--tx2)">{{p.src}}</span></div>
<div class="mono" style="{{p.labelSt}}">{{p.label}}</div>
</div>
<div style="{{p.gridSt}}">
<button onClick="{{p.lower}}" aria-label="Lower scores" style="{{p.lowerSt}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<sc-for list="{{p.pads}}" as="k" hint-placeholder-count="4">
<button onClick="{{k.pick}}" aria-label="{{k.lbl}}" style="{{k.st}}"><span class="mono" style="{{k.mk}}">{{k.v}}</span></button>
</sc-for>
<button onClick="{{p.higher}}" aria-label="Higher scores" style="{{p.higherSt}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
</sc-for>
</div>

<button onClick="{{flip}}" style="margin: 12px 16px 0; width: calc(100% - 32px); height: 52px; border-radius: 14px; border: 0; background: var(--s1); display: flex; align-items: center; gap: 10px; padding: 0 4px 0 14px; box-shadow: var(--card); text-align: left">
<div style="{{slimSt}}">
<sc-for list="{{slim}}" as="q" hint-placeholder-count="2"><span style="display: flex; align-items: center; gap: 8px">{{q.name}}<span class="mono" style="{{q.mk}}">{{q.v}}</span></span></sc-for>
</div>
<span style="{{slimBtn}}">{{slimLbl}}</span>
</button>

<div style="margin: 14px 16px 0; display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="18"><div style="{{s}}"></div></sc-for>
</div>

<button onClick="{{next}}" style="{{nextSt}}">{{nextLabel}}</button>

<nav aria-label="Round" style="position: absolute; left: 16px; right: 16px; bottom: 38px; z-index: 10; display: flex; padding: 6px; border-radius: 34px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); border: 1px solid var(--glassLn); box-shadow: var(--dock)">
<a href="Enter.dc.html" aria-label="Enter" aria-current="page" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: var(--s3); color: var(--tx)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></a>
<a href="Matches-fill-partial.dc.html" aria-label="Matches" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg></a>
<a href="Board-v2.dc.html" aria-label="Board" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg></a>
<a href="Board-v2.dc.html" aria-label="Card" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg></a>
</nav>
<div aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--tx); opacity: .9"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"pads":{"editor":"enum","options":["5","4"],"default":"4","section":"Input"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Holes 13–18 of a Team Ryder Cup match, Andrew + Alex (you) v Joseph + Jay (3rd tee time).
    // Sean + Baker are the other cart in YOUR tee time; you can enter for them. Joseph + Jay's scores arrive from their phones.
    this.H = { 13: { par: 5, hcp: 3, yd: [228, 241, 255] }, 14: { par: 4, hcp: 11, yd: [140, 152, 163] }, 15: { par: 3, hcp: 17, yd: [149, 156, 168] }, 16: { par: 4, hcp: 9, yd: [131, 142, 150] }, 17: { par: 4, hcp: 5, yd: [160, 171, 184] }, 18: { par: 5, hcp: 1, yd: [205, 219, 236] } };
    this.state = { hole: 16, view: 'mine', win: {},
      scores: { 13: { Andrew: 4, Alex: 5, Joseph: 5, Jay: 5, Sean: 5, Baker: 6 }, 14: { Andrew: 5, Alex: 5, Joseph: 4, Jay: 5, Sean: 4, Baker: 4 }, 15: { Andrew: 3, Alex: 4, Joseph: 3, Jay: 5, Sean: 3, Baker: 4 },
        16: { Andrew: 4, Alex: null, Joseph: 4, Jay: 6, Sean: 4, Baker: null }, 17: { Joseph: 4, Jay: 4 }, 18: {} } };
  }
  // low ball / low total for one hole from the four net scores: 'a' | 'j' | 'p' | null (not all in)
  holeResult(sc) {
    var a = [sc.Andrew, sc.Alex], j = [sc.Joseph, sc.Jay];
    if (a.concat(j).some(function (x) { return x == null; })) return null;
    var lb = Math.min.apply(null, a) < Math.min.apply(null, j) ? 'a' : Math.min.apply(null, a) > Math.min.apply(null, j) ? 'j' : 'p';
    var ta = a[0] + a[1], tj = j[0] + j[1];
    var lt = ta < tj ? 'a' : ta > tj ? 'j' : 'p';
    return { lb: lb, lt: lt, aLow: Math.min.apply(null, a), jLow: Math.min.apply(null, j), ta: ta, tj: tj };
  }
  renderVals() {
    var self = this, s = this.state, hole = s.hole, H = this.H[hole], par = H.par, cap = par * 2, sc = s.scores[hole];
    var mine = s.view === 'mine', N = (this.props.pads ?? '5') === '4' ? 4 : 5;
    // match tally over holes 13..18 from counted holes only
    var ptsA = 0, ptsJ = 0, thru = 0;
    for (var h = 13; h <= 18; h++) { var r = this.holeResult(s.scores[h] || {}); if (!r) continue; thru++; [r.lb, r.lt].forEach(function (k) { if (k === 'a') ptsA++; else if (k === 'j') ptsJ++; else { ptsA += .5; ptsJ += .5; } }); }
    var fr = function (n) { var w = Math.floor(n); return (w || n % 1 === 0 ? w : '') + (n % 1 ? '½' : ''); };
    var diff = ptsA - ptsJ;
    var flag = diff > 0 ? 'UP ' + fr(diff) : diff < 0 ? 'DOWN ' + fr(-diff) : fr(ptsA) + '–' + fr(ptsJ);
    var flagBase = 'display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 26px; border-radius: 8px; font-size: 12px; font-weight: 700; border: 0; padding: 0; margin: 0; cursor: pointer; ';
    var flagSt = flagBase + (diff > 0 ? 'color: var(--bg); background: var(--me)' : diff < 0 ? 'color: var(--tx); background: var(--s3)' : 'color: var(--tx); background: var(--bg); border: 1.5px solid var(--tx2)');

    function label(v) { if (v == null) return ['TAP A SCORE', 'color: var(--tx2)']; var d = v - par; return [d <= -3 ? (v === 1 ? 'ACE' : 'ALBATROSS') : ['EAGLE', 'BIRDIE', 'PAR', 'BOGEY', 'DOUBLE', 'TRIPLE'][Math.max(0, Math.min(5, d + 2))] + (v === cap ? ' · MAX' : ''), d < 0 ? 'color: var(--meT)' : d >= 2 ? 'color: var(--dbl)' : 'color: var(--tx2)']; }
    function pm(v) {
      var b = 'width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-sizing: border-box; ';
      var d = v - par;
      if (d <= -2) return b + 'border: 5px double currentColor; border-radius: 50%';
      if (d === -1) return b + 'border: 2px solid currentColor; border-radius: 50%';
      if (d === 0) return b;
      if (d === 1) return b + 'border: 2px solid currentColor; border-radius: 5px; opacity: .8';
      return b + 'border: 5px double currentColor; border-radius: 5px';
    }
    function setScore(n, v) { var all = JSON.parse(JSON.stringify(s.scores)); all[hole][n] = v; self.setState({ scores: all }); }
    var names = mine ? ['Andrew', 'Alex'] : ['Sean', 'Baker'];
    var players = names.map(function (n) {
      var v = sc[n], l = label(v);
      var key = hole + n, lo = s.win[key] == null ? par - 1 : s.win[key];
      lo = Math.max(1, Math.min(lo, cap - (N - 1)));
      var arrow = function (on) { return 'height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--ln); background: var(--bg); color: var(--tx2); ' + (on ? '' : 'opacity: .3; pointer-events: none'); };
      var pads = []; for (var q = 0; q < N; q++) pads.push(lo + q); pads = pads.map(function (x) {
        var on = v === x, likely = v == null && x === par;
        return { v: x, lbl: n + ' ' + x, mk: pm(x) + (x - par >= 2 && !on ? '; color: var(--dbl)' : ''),
          st: 'height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 0; ' + (on ? 'background: var(--tx); color: var(--bg); border: 0' : 'background: var(--bg); color: var(--tx); border: 1px solid ' + (likely ? 'var(--tx2)' : 'var(--ln)')),
          pick: function () { setScore(n, on ? null : x); } };
      });
      return { name: n, pads: pads, label: l[0], labelSt: 'font-size: 11px; font-weight: 600; letter-spacing: 1px; ' + l[1],
        src: mine ? '' : (v == null ? 'waiting · tap to enter' : 'entered by you · ' + n + ' can still edit'),
        strokeSt: (n === 'Alex' || n === 'Baker') && H.hcp <= 12 ? 'width: 7px; height: 7px; border-radius: 4px; background: var(--tx)' : 'display: none',
        lowerSt: arrow(lo > 1), higherSt: arrow(lo + N - 1 < cap), gridSt: 'display: grid; grid-template-columns: 34px repeat(' + N + ', minmax(0, 1fr)) 34px; gap: 4px; margin-top: 6px',
        lower: function () { var w = Object.assign({}, s.win); w[key] = lo - 1; self.setState({ win: w }); },
        higher: function () { var w = Object.assign({}, s.win); w[key] = lo + 1; self.setState({ win: w }); } };
    });
    var slimNames = mine ? ['Sean', 'Baker'] : ['Andrew', 'Alex'];
    function smallMark(v) {
      var b = 'width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; box-sizing: border-box; ';
      if (v == null) return b + 'border-radius: 50%; border: 2px dashed var(--ln); color: var(--tx2)';
      var d = v - par;
      if (d <= -2) return b + 'border: 4px double var(--tx); border-radius: 50%';
      if (d === -1) return b + 'border: 2px solid var(--tx); border-radius: 50%';
      if (d === 0) return b;
      if (d === 1) return b + 'border: 1.5px solid var(--tx2); border-radius: 4px';
      return b + 'border: 4px double var(--dbl); border-radius: 4px; color: var(--dbl); background: var(--dblBg)';
    }
    var slim = slimNames.map(function (n) { return { name: n, v: sc[n] == null ? par : sc[n], mk: smallMark(sc[n]) }; });
    var missing = ['Andrew', 'Alex', 'Sean', 'Baker'].filter(function (n) { return sc[n] == null; });
    var r = this.holeResult(sc), fourIn = !!r;
    var d = 'width: 11px; height: 11px; border-radius: 50%; box-sizing: border-box; flex: none; ';
    var oneIn = ['Andrew', 'Alex'].every(function (n) { return sc[n] != null; }) || ['Joseph', 'Jay'].every(function (n) { return sc[n] != null; });
    function dot(k) { return !fourIn ? d + (oneIn ? 'border: 2px solid var(--tx2)' : 'border: 2px dashed var(--tx2)') : k === 'a' ? d + 'background: var(--me)' : k === 'j' ? d + 'background: var(--tx2)' : d + 'background: linear-gradient(90deg, var(--me) 50%, var(--tx2) 50%)'; }
    function who(k) { return k === 'a' ? 'you' : k === 'j' ? 'them' : 'halved'; }
    var holeNote;
    if (fourIn) { var g = (r.lb === 'a' ? 1 : r.lb === 'p' ? .5 : 0) + (r.lt === 'a' ? 1 : r.lt === 'p' ? .5 : 0); holeNote = (g === 2 ? 'you take it' : g === 0 ? 'they take it' : g === 1 ? 'split' : g > 1 ? 'mostly yours' : 'mostly theirs') + ' · ' + flag; }
    else if (['Joseph', 'Jay'].every(function (n) { return sc[n] != null; })) holeNote = 'Joseph ' + sc.Joseph + ', Jay ' + sc.Jay + ' · enter yours';
    else holeNote = 'counts when all four are in';
    var segs = []; for (var i = 1; i <= 18; i++) { var done = i < 13 || (i >= 13 && self.holeResult(s.scores[i] || {})); segs.push('flex: 1; height: 6px; border-radius: 3px; background: ' + (i === hole ? 'var(--tx)' : done ? 'var(--tx2)' : 'var(--s2)')); }
    var slimBtn = 'height: 40px; padding: 0 14px; border-radius: 10px; background: var(--s2); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; flex: none';
    return {
      mode: this.props.mode ?? 'dark', hole: hole, par: par, hcp: H.hcp, yd: { f: H.yd[0], m: H.yd[1], b: H.yd[2] },
      mine: mine, theirs: !mine, thru: thru, flag: flag, flagSt: flagSt,
      openMatch: function () { self.setState({ toast: true }); setTimeout(function () { self.setState({ toast: false }); }, 1400); },
      toast: !!s.toast,
      cardSt: 'margin: 10px 16px 0; border-radius: 24px; background: var(--s1); border: 1.5px solid ' + (mine ? 'var(--me)' : 'var(--ln)') + '; padding: 10px 12px 12px; box-shadow: var(--card)',
      players: players, slim: slim,
      slimSt: 'flex: 1; display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 600; ' + (mine ? '' : 'color: var(--meT)'),
      slimBtn: slimBtn + (mine ? '' : '; background: transparent; color: var(--meT); font-family: \'Geist Mono\', monospace; font-size: 11px; letter-spacing: 1px'),
      slimLbl: mine ? 'Edit' : 'YOU',
      flip: function () { self.setState({ view: mine ? 'theirs' : 'mine' }); },
      back: function () { self.setState({ view: 'mine' }); },
      lb: { dot: dot(r && r.lb), tx: fourIn ? ' · ' + who(r.lb) + ' (' + r.aLow + ' v ' + r.jLow + ')' : '' },
      lt: { dot: dot(r && r.lt), tx: fourIn ? ' · ' + who(r.lt) + ' (' + r.ta + ' v ' + r.tj + ')' : '' },
      holeNote: holeNote, segs: segs,
      prev: function () { if (hole > 13) self.setState({ hole: hole - 1, view: 'mine' }); }, prevSt: hole > 13 ? '' : 'opacity: .35',
      next: function () { if (!missing.length && hole < 18) self.setState({ hole: hole + 1, view: 'mine' }); }, nextArrowSt: !missing.length && hole < 18 ? '' : 'opacity: .35',
      nextLabel: hole < 18 ? 'Next hole' : 'Round done',
      nextSt: 'display: block; width: calc(100% - 32px); margin: 14px 16px 0; height: 58px; border: 0; border-radius: 18px; font-size: 17px; font-weight: 600; ' + (missing.length ? 'background: var(--s2); color: var(--tx2)' : 'background: var(--tx); color: var(--bg)')
    };
  }
}
</script>
</body>
</html>
