<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393">
<title>014 Today's game · Team Ryder Cup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="kit.css">
<style>
.side{flex:1;border-radius:var(--radius-lg);border:1.5px solid;padding:12px}
.orow{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line);padding:6px 0}
.orow:first-child{border-top:0}
</style></head><body>
<div class="screen" id="s"></div>
<script src="kit.js"></script>
<script>
var o = [['Holes 1–6', 'Sean + Baker', 'in your group'], ['Holes 7–12', 'Josh + Brandon', '2nd tee time'], ['Holes 13–18', 'Joseph + Jay', '3rd tee time']];
document.getElementById('s').innerHTML =
  '<div class="top"><span style="flex:1"></span><button class="iconbtn" aria-label="Close">' + K.icon('x', 20) + '</button></div>' +
  '<div class="scroll" style="padding-bottom:16px"><div style="padding:4px 20px 0"><div class="t-label muted">TODAY’S GAME</div><div class="t-title" style="margin-top:2px">Team Ryder Cup</div>' +
  '<div class="t-body muted" style="margin-top:6px">Two sides of 8. Your cart plays a different cart every 6 holes.</div></div>' +
  '<div style="display:flex;gap:8px;margin:16px 16px 0">' +
    '<div class="side" style="background:var(--tint-you);border-color:var(--cart-you)"><div class="t-label you">YOUR SIDE</div><div class="t-row you" style="margin-top:4px">Team Andrew</div><div class="t-small muted">4 carts · 8 players</div></div>' +
    '<div class="side" style="background:var(--tint-b);border-color:var(--cart-b)"><div class="t-label away">THEM</div><div class="t-row away" style="margin-top:4px">Team Josh</div><div class="t-small muted">4 carts · 8 players</div></div></div>' +
  '<div class="card" style="margin:10px 16px 0;padding:14px 16px">' +
    '<div class="t-row">12 matches · 1 point each · 6½ wins</div>' +
    '<div class="t-body muted" style="margin-top:6px">Each hole: low ball 1 point, low total 1 point. Most hole points after 6 holes wins the match for your side. A tie is ½ each.</div></div>' +
  '<div class="sec"><span class="t-label muted">YOUR MATCHES · ANDREW + ALEX</span></div>' +
  '<div class="card" style="margin:0 16px;padding:0 16px">' + o.map(function (r) {
    return '<div class="orow"><div class="mono t-small muted" style="width:92px;flex:none">' + r[0] + '</div><div style="flex:1;min-width:0"><div class="t-body away" style="font-weight:600">' + r[1] + '</div><div class="t-small muted">' + r[2] + '</div></div></div>';
  }).join('') + '</div>' +
  '<div class="hint" style="margin:12px 20px 0">' + K.icon('bulb', 16) + '<span>Holes 7–18 are against a cart in another tee time. The app scores it hole by hole; nobody moves.</span></div></div>' +
  '<div class="footer"><button class="btn-primary">Let’s go</button></div>';
</script></body></html>
