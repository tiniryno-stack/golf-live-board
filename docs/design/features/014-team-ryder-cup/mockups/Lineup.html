<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393">
<title>014 New lineup · Team Ryder Cup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="kit.css">
<style>
.hrow{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) 16px minmax(0,1fr);gap:6px;align-items:center;padding:6px 0}
.lrow .pchip{width:100%;justify-content:center;font-size:14px;padding:0 6px;overflow:hidden;text-overflow:ellipsis}
.was{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);text-align:center;margin-top:2px;height:16px}
.stepbtn{width:48px;height:48px;border-radius:var(--radius-md);background:var(--surface-2);font-size:24px}
</style></head><body>
<div class="screen" id="s"></div>
<script src="kit.js"></script>
<script>
var from = 13, open = K.q.get('sheet') !== '0', lineup = [0, 1, 2, 3], sel = null, toastMsg = K.q.get('toast') ? 'Lineup changed from hole 13' : '';
if (K.q.get('matched')) lineup = [2, 3, 0, 1];
var A = ['Andrew + Alex', 'Ant + Steve', 'Justin + Chuck', 'Mitch + Peter'], J = ['Sean + Baker', 'Josh + Brandon', 'Joseph + Jay', 'Elijah + Marcus'];
var ord = ['1st', '2nd', '3rd', '4th'];
function rotOf(h) { return h <= 6 ? 0 : h <= 12 ? 1 : 2; }
function host() {
  return '<div class="top"><div class="t-label muted" style="flex:1;padding-left:4px">HOST SETTINGS · ORGANIZER</div><button class="iconbtn" aria-label="Close">' + K.icon('x', 20) + '</button></div>' +
    '<div style="padding:4px 20px 12px" class="t-title">Host</div><div class="card" style="margin:0 16px">' +
    [['Players', '16 · 2 sides'], ['Rules', 'Team Ryder Cup'], ['New lineup', 'From hole…'], ['Fix a hole', ''], ['Finalize round', '']].map(function (r, i) {
      return '<button class="hrow" style="width:100%;text-align:left;' + (i ? '' : 'border-top:0') + '" ' + (r[0] === 'New lineup' ? 'onclick="open=true;draw()"' : '') + '><span class="t-body" style="flex:1;font-weight:600">' + r[0] + '</span><span class="t-small muted">' + r[1] + '</span>' + K.icon('right', 20, 'color:var(--text-muted)') + '</button>';
    }).join('') + '</div>';
}
function sheet() {
  if (!open) return '';
  var rows = '';
  for (var i = 0; i < 4; i++) {
    var j = lineup[i], moved = j !== i, id = 'L' + i;
    rows += '<div class="lrow"><div class="t-body" style="font-weight:600">' + ord[i] + '</div><span class="pchip y">' + A[i] + '</span><span class="t-small muted" style="text-align:center">v</span>' +
      '<div><button class="pchip o' + (sel === id ? ' sel' : '') + '" onclick="tap(' + i + ')">' + J[j] + '</button></div></div>' +
      '<div class="lrow" style="padding:0;margin-top:-4px"><span></span><span></span><span></span><div class="was">' + (moved ? 'was ' + ord[j] : '') + '</div></div>';
  }
  return '<div class="scrim" onclick="open=false;draw()"></div><div class="sheet"><div class="grab"></div>' +
    '<div style="display:flex;align-items:center;padding:0 8px 0 20px"><div style="flex:1"><div style="font-size:20px;font-weight:800;letter-spacing:-.4px">New lineup</div><div class="t-small muted">Organizer only · who plays in which tee time</div></div>' +
    '<button class="iconbtn" style="background:var(--surface-2);box-shadow:none" aria-label="Close" onclick="open=false;draw()">' + K.icon('x', 20) + '</button></div>' +
    '<div style="overflow-y:auto;padding:0 20px">' +
    '<div style="display:flex;align-items:center;gap:12px;margin-top:16px"><div style="flex:1"><div class="t-body" style="font-weight:600">From hole</div><div class="t-small muted">Holes before ' + from + ' keep their results</div></div>' +
    '<button class="stepbtn" onclick="from=Math.max(2,from-1);draw()" aria-label="Earlier hole">−</button><div class="mono" style="width:40px;text-align:center;font-size:24px;font-weight:700">' + from + '</div><button class="stepbtn" onclick="from=Math.min(18,from+1);draw()" aria-label="Later hole">+</button></div>' +
    '<button class="btn-sec" style="width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="matchUp()">' + K.icon('swap', 18) + 'Play with your opponent</button>' +
    '<div class="hint" style="margin-top:8px">' + K.icon('bulb', 16) + '<span>Puts each cart in the same tee time as the cart it plays on holes ' + ['1–6', '7–12', '13–18'][rotOf(from)] + '. Team Josh carts move.</span></div>' +
    '<div class="t-label muted" style="margin:16px 0 4px">TEE TIMES FROM HOLE ' + from + '</div>' + rows +
    '<div class="t-small muted" style="margin:6px 0 4px">Tap two Team Josh carts to swap. The 12 matches don’t change, only who plays together.</div></div>' +
    '<div class="footer" style="background:transparent;padding-top:14px"><button class="btn-primary" onclick="save()">Save lineup</button></div></div>';
}
function draw() {
  document.getElementById('s').innerHTML = host() + sheet() + '<div class="toast' + (toastMsg ? '' : ' hide') + '" style="bottom:40px">' + K.icon('check', 20) + toastMsg + '</div>';
}
function tap(i) {
  if (sel === null) { sel = 'L' + i; draw(); return; }
  var k = +sel.slice(1); sel = null; if (k !== i) { var t = lineup[k]; lineup[k] = lineup[i]; lineup[i] = t; } draw();
}
function matchUp() { var r = rotOf(from); lineup = [0, 1, 2, 3].map(function (i) { return (i + r) % 4; }); draw(); }
function save() { open = false; toastMsg = 'Lineup changed from hole ' + from; draw(); setTimeout(function () { toastMsg = ''; draw(); }, 2000); }
draw();
</script></body></html>
