<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393">
<title>014 Enter · Team Ryder Cup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="kit.css">
<style>
.step{width:88px;height:88px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:38px;flex:none}
.step:active{background:var(--surface-2)}
.prow{border-radius:var(--radius-lg);padding:10px 8px;margin-top:8px}
.prow.ghost{outline:1.5px dashed var(--line);outline-offset:-1.5px}
.mk{font-family:var(--font-mono);display:inline-flex;align-items:center;justify-content:center;font-weight:700;box-sizing:border-box}
.slim{margin:10px 16px 0;min-height:56px;border-radius:14px;background:var(--surface-1);display:flex;align-items:center;gap:10px;padding:0 4px 0 14px;box-shadow:var(--shadow-card)}
.tag{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:1px;color:var(--text-muted);padding:1px 6px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
</style></head><body>
<div class="screen" id="s"></div>
<script src="kit.js"></script>
<script>
var hole = 17, par = 4;
var rot = K.q.get('rot') === '1' ? 1 : 3; // rotation 1 = opponent in your group; 3 = another tee time
var sc = { Andrew: 4, Alex: null };
function mark(v, size, ghost) {
  var d = v == null ? 0 : v - par, s = 'width:' + size + 'px;height:' + size + 'px;font-size:' + (size > 60 ? 64 : 15) + 'px;letter-spacing:' + (size > 60 ? '-2px' : '0');
  if (v == null) return '<span class="mk" style="' + s + ';border:2px dashed var(--line);border-radius:50%;color:var(--text-muted);opacity:.6">' + par + '</span>';
  if (d <= -2) return '<span class="mk" style="' + s + ';border:' + (size > 60 ? 9 : 4) + 'px double var(--text);border-radius:50%">' + v + '</span>';
  if (d === -1) return '<span class="mk" style="' + s + ';border:2px solid var(--text);border-radius:50%">' + v + '</span>';
  if (d === 0) return '<span class="mk" style="' + s + '">' + v + '</span>';
  if (d === 1) return '<span class="mk" style="' + s + ';border:2px solid var(--text-muted);border-radius:' + Math.round(size * .16) + 'px">' + v + '</span>';
  return '<span class="mk" style="' + s + ';border:' + (size > 60 ? 9 : 4) + 'px double var(--double);background:var(--double-bg);color:var(--double);border-radius:' + Math.round(size * .16) + 'px">' + v + '</span>';
}
function label(v) { if (v == null) return ['TAP − / + · PAR', 'color:var(--text-muted)']; var d = v - par; return [['EAGLE', 'BIRDIE', 'PAR', 'BOGEY', 'DOUBLE', 'TRIPLE'][Math.max(0, Math.min(5, d + 2))], d < 0 ? 'color:var(--cart-you-text)' : d >= 2 ? 'color:var(--double)' : 'color:var(--text-muted)']; }
function prow(n) {
  var v = sc[n], l = label(v);
  return '<div class="prow' + (v == null ? ' ghost' : '') + '"><div style="display:flex;justify-content:space-between;padding:0 2px"><div class="t-row" style="font-weight:700;display:flex;align-items:center;gap:6px">' + n +
    (n === 'Alex' ? '<span aria-label="gets a stroke" style="width:7px;height:7px;border-radius:4px;background:var(--text)"></span>' : '') + '</div><div class="t-label" style="' + l[1] + '">' + l[0] + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:12px;margin-top:10px"><button class="step" onclick="bump(\'' + n + '\',-1)" aria-label="' + n + ' minus">−</button><div style="flex:1;display:flex;justify-content:center">' + mark(v, 112) + '</div><button class="step" onclick="bump(\'' + n + '\',1)" aria-label="' + n + ' plus">+</button></div></div>';
}
function draw() {
  var cross = rot !== 1, oppName = cross ? 'Joseph + Jay' : 'Sean + Baker';
  var status = cross ? 'UP 2 · CUP 5½–3½' : 'UP 1 · CUP 0–0';
  var left = Object.keys(sc).filter(function (k) { return sc[k] == null; }).length;
  var segs = ''; for (var i = 1; i <= 18; i++) segs += '<div style="flex:1;height:6px;border-radius:3px;background:' + (i < hole ? 'var(--text-muted)' : i === hole ? 'var(--text)' : 'var(--surface-2)') + '"></div>';
  var h = '<div class="top" style="height:44px"><div class="avatar">AD</div><div class="t-body" style="font-weight:600">Andrew</div><div class="t-small muted" style="flex:1;text-align:right">Sherrill Park · Sat</div></div>' +
    '<div style="display:flex;align-items:center;padding:6px 8px 0"><button aria-label="Previous hole" style="width:52px;height:52px;display:flex;align-items:center;justify-content:center">' + K.icon('left', 24) + '</button>' +
    '<div style="flex:1;text-align:center"><div style="font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1">Hole ' + (cross ? hole : 3) + '</div><div class="t-body muted" style="margin-top:4px">Par ' + par + ' · Hcp 9 · 388 yds</div></div>' +
    '<button aria-label="Next hole" style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;opacity:.35">' + K.icon('right', 24) + '</button></div>' +
    // your cart card
    '<div style="margin:12px 16px 0;border-radius:var(--radius-2xl);background:var(--surface-1);border:1.5px solid var(--cart-you);padding:12px;box-shadow:var(--shadow-card)">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px"><div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;min-width:0;white-space:nowrap"><span class="dot" style="width:10px;height:10px;border-radius:5px;background:var(--cart-you)"></span><span class="muted" style="font-weight:600">vs</span><span class="away" style="overflow:hidden;text-overflow:ellipsis">' + oppName + '</span></div>' +
    '<div class="mono" style="font-size:13px;white-space:nowrap"><span class="you" style="font-weight:700">' + status.split(' · ')[0] + '</span><span class="muted"> · ' + status.split(' · ')[1] + '</span></div></div>' +
    prow('Andrew') + prow('Alex') + '</div>' +
    // other cart in your group (you can enter for them)
    '<div class="slim"><span class="dot" style="background:var(--cart-b)"></span><div style="font-size:14px;font-weight:700" class="away">Sean + Baker</div>' +
    '<div class="mono" style="flex:1;font-size:14px;display:flex;align-items:center;gap:6px;justify-content:flex-end;padding-right:6px">Sean ' + mark(4, 28) + ' Baker ' + mark(5, 28) + '</div><button class="btn-sec" style="font-size:14px">Edit</button></div>';
  if (cross) h += '<div class="slim" style="min-height:48px;background:transparent;box-shadow:none;border:1px solid var(--line);padding-right:14px"><div style="font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" class="away">Joseph + Jay</div><span class="tag">3RD TEE TIME</span>' +
    '<div class="mono" style="flex:1;font-size:14px;display:flex;align-items:center;gap:6px;justify-content:flex-end">' + mark(4, 28) + mark(null, 28) + '</div></div>';
  h += '<div style="margin:14px 16px 0;display:flex;gap:3px">' + segs + '</div>' +
    '<button class="btn-primary" style="margin-top:12px;height:58px;' + (left ? 'background:var(--surface-2);color:var(--text-muted)' : '') + '">' + (left ? 'Next hole · Alex left' : 'Next hole') + '</button>';
  document.getElementById('s').innerHTML = h + K.tabbar('Enter');
}
function bump(n, d) { sc[n] = sc[n] == null ? par : Math.max(1, sc[n] + d); draw(); }
draw();
</script></body></html>
