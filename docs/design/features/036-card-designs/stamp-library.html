const hash = (s) => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7);
const cell = (c) => { const h = Math.abs(hash(c.slug));
  return `<button class="cell" style="--ink:var(--ink-${c.stamp.ink});--r:${(h % 9) - 4}deg;--fa:${60 + (h % 7) * 20}deg" aria-label="${c.name} stamp">${stamp(c)}<span class="nm">${c.short}</span><span class="ct">${c.access}${c.emblem ? '' : ' · <b>lettering only</b>'}</span></button>`; };
const GROUPS = [['played', 'Played in the app', (c) => c.played], ['dfw', 'Dallas · Fort Worth', (c) => !c.played && c.region === 'DFW'], ['atx', 'Austin', (c) => c.region === 'Austin']];
function render() {
  uid = 0; const cls = state.paper ? 'sheet paper' : 'sheet';
  document.getElementById('out').innerHTML = GROUPS.map(([id, t, f]) => { const list = COURSES.filter(f);
    return `<section id="${id}"><div><div class="k">${list.length} courses</div><h2>${t}</h2></div><div class="${cls}"><div class="grid">${list.map(cell).join('')}</div></div></section>`; }).join('') + `
    <section><div><div class="k">How it works</div><h2>What is in each stamp</h2></div>
      <div class="note"><b>The emblem</b><span>Cut from the club's own logo, words removed, so it is the club's real mark and not a drawing of it.</span></div>
      <div class="note"><b>Name, city, date</b><span>Set by the stamp in our own type. The date is the day you first finished 18 there. Dates here are samples except the three you have played.</span></div>
      <div class="note"><b>Shape and ink</b><span>Picked once per course and kept for everyone: wide emblems get the box, the rest a ring or an oval.</span></div>
      <div class="note"><b>Lettering only</b><span>Tierra Verde, Riverchase, Tangle Ridge, Grey Rock and Hancock have no picture in their logo, so they get a monogram for now.</span></div></section>`;
}
function start() {
  const bar = document.getElementById('bar');
  const mk = (label, fn, on) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; if (on !== undefined) b.setAttribute('aria-pressed', String(on)); b.onclick = fn; bar.appendChild(b); return b; };
  const dark = mk('Dark page', () => { state.paper = false; dark.setAttribute('aria-pressed', 'true'); paper.setAttribute('aria-pressed', 'false'); render(); }, true);
  const paper = mk('Paper page', () => { state.paper = true; paper.setAttribute('aria-pressed', 'true'); dark.setAttribute('aria-pressed', 'false'); render(); }, false);
  for (const [id, t] of GROUPS) mk(t.split(' ')[0] === 'Played' ? 'Played' : t.split(' ·')[0], () => document.getElementById(id).scrollIntoView({ behavior: 'smooth' }));
  render();
  document.getElementById('out').addEventListener('click', (e) => { const c = e.target.closest('.cell'); if (!c) return; const s = c.querySelector('svg'); s.classList.remove('hit'); void s.getBoundingClientRect(); s.classList.add('hit'); });
}
start();
</script>
