<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup · Players</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--btn:#F4F5F7;--btnT:#0A0B0D;--card:none}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--btn:#0B0D10;--btnT:#FFFFFF;--card:0 1px 2px rgba(11,13,16,.06),0 4px 12px rgba(11,13,16,.05)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 0; height: 52px; flex: none">
<a href="Setup-players.dc.html" style="height: 48px; display: flex; align-items: center; gap: 2px; color: var(--tx2); text-decoration: none; font-size: 16px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Course</a>
<div style="display: flex; gap: 4px"><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--ln)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--ln)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--ln)"></i></div>
<span style="width: 72px"></span>
</div>

<div style="flex: 1; overflow: hidden; padding: 2px 20px 0">
<div class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">STEP 2 · PLAYERS</div>
<div style="font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">Who’s playing?</div>
<div style="font-size: 15px; line-height: 20px; color: var(--tx2); margin-top: 4px">16 in. That’s a Team Ryder Cup.</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px">
<button style="height: 44px; padding: 0 14px; border: 1px solid var(--ln); border-radius: 12px; background: transparent; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add a name</button>
<button style="height: 44px; padding: 0 14px; border: 1px solid var(--ln); border-radius: 12px; background: transparent; font-size: 15px; font-weight: 600; color: var(--tx2)">Chucks Bday crew · 8</button>
<button style="height: 44px; padding: 0 14px; border: 1px solid var(--ln); border-radius: 12px; background: transparent; font-size: 15px; font-weight: 600; color: var(--tx2)">Tyler</button>
</div>

<div style="display: flex; align-items: center; margin-top: 18px; padding: 0 4px">
<span class="mono" style="flex: 1; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">16 PLAYERS</span>
<span class="mono" style="width: 64px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">HCP</span>
<span style="width: 48px"></span>
</div>
<div style="margin: 6px -4px 0; background: var(--s1); border-radius: 18px; box-shadow: var(--card); overflow: hidden">
<sc-for list="{{players}}" as="p" hint-placeholder-count="9">
<div style="{{p.rowSt}}">
<div style="flex: 1; min-width: 0">
<div style="{{p.nameSt}}">{{p.name}}</div>
<div style="font-size: 13px; line-height: 18px; color: var(--tx2)">{{p.sub}}</div>
</div>
<span class="mono" style="{{p.hcpSt}}">{{p.hcp}}</span>
<span style="{{p.xSt}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
</div>
</sc-for>
</div>
</div>

<div style="flex: none; padding: 12px 16px 28px; background: var(--bg)">
<a href="Setup-carts.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 18px; background: var(--btn); color: var(--btnT); font-size: 17px; font-weight: 600; text-decoration: none">Next: pick a game</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var P = [['Andrew', 'You · organizer', 9, 1], ['Alex', '', 14], ['Ant', '', 18], ['Steve', '', 11], ['Justin', '', 22], ['Chuck', '', 7], ['Mitch', '', 16], ['Peter', 'New player', null], ['Sean', '', 5]];
    return {
      mode: this.props.mode ?? 'dark',
      players: P.map(function (p, i) {
        return {
          name: p[0], sub: p[1], hcp: p[2] == null ? 'Add' : p[2],
          rowSt: 'display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 4px 0 16px; ' + (i ? 'border-top: 1px solid var(--ln)' : ''),
          nameSt: 'font-size: 17px; line-height: 22px; font-weight: 600; color: ' + (p[3] ? 'var(--meT)' : 'var(--tx)'),
          hcpSt: 'width: 64px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 16px; font-weight: 600; ' + (p[2] == null ? 'border: 1.5px dashed var(--ln); color: var(--tx2); font-family: Geist, sans-serif; font-size: 14px' : 'background: var(--s2)'),
          xSt: 'width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--tx2); ' + (p[3] ? 'visibility: hidden' : '')
        };
      })
    };
  }
}
</script>
</body>
</html>
