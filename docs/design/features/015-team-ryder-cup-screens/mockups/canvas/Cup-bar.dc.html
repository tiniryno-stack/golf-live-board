<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The 6½ bar · states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
</style>
</helmet>
<div class="t {{mode}}" style="width: 880px; height: 620px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; padding: 40px 48px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.5px">One segment per match</div>
<div style="font-size: 15px; color: var(--tx2)">Yours fill from the left, theirs from the right. Cross the line to win.</div>
</div>
<sc-for list="{{states}}" as="b" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) 120px; gap: 24px; align-items: center; padding-top: 18px; border-top: 1px solid var(--ln)">
<div>
<div style="font-size: 17px; line-height: 22px; font-weight: 600">{{b.name}}</div>
<div style="font-size: 13px; line-height: 18px; color: var(--tx2)">{{b.note}}</div>
</div>
<div style="position: relative; display: flex; gap: 12px">
<div style="flex: 1; display: flex; gap: 4px"><sc-for list="{{b.left}}" as="s" hint-placeholder-count="6"><div style="{{s.st}}"></div></sc-for></div>
<div style="flex: 1; display: flex; gap: 4px"><sc-for list="{{b.right}}" as="s" hint-placeholder-count="6"><div style="{{s.st}}"></div></sc-for></div>
<div style="position: absolute; left: 50%; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--tx)"></div>
</div>
<div class="mono" style="text-align: right; font-size: 22px; font-weight: 700"><span style="color: var(--meT)">{{b.a}}</span><span style="color: var(--tx2)"> – {{b.j}}</span></div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":880,"height":620}}'>
class Component extends DCLogic {
  bar(a, j) {
    var out = [], fa = Math.floor(a), fj = Math.floor(j);
    for (var i = 0; i < 12; i++) {
      var bg = 'var(--s2)';
      if (i < fa) bg = 'var(--me)';
      else if (a % 1 && i === fa) bg = 'linear-gradient(90deg, var(--me) 50%, var(--s2) 50%)';
      if (i >= 12 - fj) bg = 'var(--tx2)';
      else if (j % 1 && i === 11 - fj) bg = 'linear-gradient(90deg, var(--s2) 50%, var(--tx2) 50%)';
      out.push({ st: 'flex: 1; height: 18px; border-radius: 4px; background: ' + bg });
    }
    return { left: out.slice(0, 6), right: out.slice(6) };
  }
  renderVals() {
    var self = this;
    var S = [
      ['Before scores', '12 empty segments', 0, 0, '0', '0'],
      ['Live', 'A halved match is half a segment', 5.5, 3.5, '5½', '3½'],
      ['Clinched', 'Green crosses the line', 6.5, 3.5, '6½', '3½'],
      ['Tied', 'Both sides stop at the line', 6, 6, '6', '6'],
      ['They clinch', 'Grey crosses the line', 4, 6.5, '4', '6½']
    ];
    return {
      mode: this.props.mode ?? 'dark',
      states: S.map(function (x) { var b = self.bar(x[2], x[3]); return { name: x[0], note: x[1], a: x[4], j: x[5], left: b.left, right: b.right }; })
    };
  }
}
</script>
</body>
</html>
