<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--glass:rgba(24,26,31,0.72);--glassLn:rgba(255,255,255,0.09);--dock:inset 0 1px 0 rgba(255,255,255,.10),0 0 28px rgba(255,255,255,.06);--card:none}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#FFFFFF;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--glass:rgba(255,255,255,0.74);--glassLn:rgba(11,13,16,0.08);--dock:0 8px 24px rgba(11,13,16,.12);--card:0 1px 2px rgba(11,13,16,.06),0 10px 28px rgba(11,13,16,.09)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
a{color:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; position: relative; overflow: hidden; padding: 22px 20px 0">

<div class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--meT)">HOLES 13–18 · LIVE</div>
<div style="font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin-top: 4px">vs Joseph + Jay</div>
<div style="font-size: 15px; line-height: 20px; color: var(--tx2); margin-top: 4px">They’re in the 3rd tee time</div>

<div style="margin: 18px -4px 0; background: var(--s1); border-radius: 24px; padding: 22px 16px 18px; box-shadow: var(--card); text-align: center">
<div style="font-size: 15px; line-height: 20px; font-weight: 600; color: var(--meT)">Andrew + Alex</div>
<div class="mono" style="font-size: 64px; line-height: 64px; font-weight: 700; letter-spacing: -2px; color: var(--meT); margin-top: 6px">UP 2</div>
<div style="font-size: 15px; line-height: 20px; font-weight: 600; margin-top: 10px">thru 4 · 2 holes to play</div>
<div style="font-size: 15px; line-height: 20px; color: var(--tx2); margin-top: 2px">Win one more hole and it’s yours</div>
<div style="display: flex; gap: 6px; justify-content: center; margin-top: 16px">
<sc-for list="{{holes}}" as="h" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 40px">
<span style="{{h.dot}}"></span>
<span class="mono" style="font-size: 12px; color: var(--tx2)">{{h.n}}</span>
</div>
</sc-for>
</div>
</div>
<a href="Matches-holes.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 48px; margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--tx2); text-decoration: none">Hole by hole<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>

<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px">

<span class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--meT)">+2 FOR TEAM ANDREW</span>
</div>
<div style="display: flex; align-items: center; min-height: 60px; border-top: 1px solid var(--ln); margin-top: 8px">
<div style="flex: 1"><div style="font-size: 13px; line-height: 18px; color: var(--tx2)">Holes 1–6</div><div style="font-size: 15px; line-height: 20px; font-weight: 600">vs Sean + Baker</div></div>
<div style="text-align: right"><div class="mono" style="font-size: 15px; font-weight: 700; color: var(--meT)">won</div><div style="font-size: 13px; color: var(--tx2)">7–5</div></div>
</div>
<div style="display: flex; align-items: center; min-height: 60px; border-top: 1px solid var(--ln)">
<div style="flex: 1"><div style="font-size: 13px; line-height: 18px; color: var(--tx2)">Holes 7–12</div><div style="font-size: 15px; line-height: 20px; font-weight: 600">vs Josh + Brandon</div></div>
<div style="text-align: right"><div class="mono" style="font-size: 15px; font-weight: 700; color: var(--meT)">won</div><div style="font-size: 13px; color: var(--tx2)">7½–4½</div></div>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid var(--ln); text-decoration: none">
<span class="mono" style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">THE CUP</span>
<span style="flex: 1; font-size: 15px; font-weight: 600"><span style="color: var(--meT)">Team Andrew 5½</span><span style="color: var(--tx2)"> – 3½</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--tx2)"><path d="M9 6l6 6-6 6"></path></svg>

<a href="Matches-live.dc.html" aria-label="Matches" aria-current="page" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: var(--s3); color: var(--tx)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg></a>
<a href="Main.dc.html" aria-label="Board" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg></a>
<a href="Main.dc.html" aria-label="Card" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; ';
    var k = ['me', 'them', 'me', 'me', 'live', 'none'];
    return {
      mode: this.props.mode ?? 'dark',
      holes: k.map(function (x, i) {
        var d = base + (x === 'me' ? 'background: var(--me)' : x === 'them' ? 'background: var(--tx2)' : x === 'push' ? 'background: linear-gradient(90deg, var(--me) 50%, var(--tx2) 50%)' : x === 'live' ? 'border: 2px dashed var(--tx2)' : 'border: 2px solid var(--ln)');
        return { n: 13 + i, dot: d };
      })
    };
  }
}
</script>
</body>
