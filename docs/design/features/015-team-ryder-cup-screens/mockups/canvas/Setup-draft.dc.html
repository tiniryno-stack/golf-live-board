<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup · Draft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--tint:rgba(61,220,132,0.10);--btn:#F4F5F7;--btnT:#0A0B0D;--card:none}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--tint:rgba(18,163,92,0.09);--btn:#0B0D10;--btnT:#FFFFFF;--card:0 1px 2px rgba(11,13,16,.06),0 4px 12px rgba(11,13,16,.05)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 0; height: 52px; flex: none">
<a href="Setup-carts.dc.html" style="height: 48px; display: flex; align-items: center; gap: 2px; color: var(--tx2); text-decoration: none; font-size: 16px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Carts</a>
<div style="display: flex; gap: 4px"><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i></div>
<button onClick="{{reset}}" style="height: 48px; padding: 0 8px; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: var(--tx2)">Start over</button>
</div>

<div style="flex: 1; overflow: hidden; padding: 2px 20px 0">
<div class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">STEP 5 · DRAFT</div>
<div style="font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">{{title}}</div>
<div style="font-size: 15px; line-height: 20px; color: var(--tx2); margin-top: 4px">{{sub}}</div>

<sc-if value="{{hasPool}}" hint-placeholder-val="{{ true }}">
<div class="mono" style="margin-top: 18px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">STILL ON THE BOARD</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
<sc-for list="{{pool}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.tap}}" style="height: 48px; border: 0; border-radius: 12px; background: var(--s1); box-shadow: var(--card); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px">{{c.name}}</button>
</sc-for>
</div>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px">
<div>
<div style="{{aHd}}">Team Andrew<span style="{{aTurn}}">PICKING</span></div>
<sc-for list="{{teamA}}" as="c" hint-placeholder-count="4">
<div style="{{c.st}}">{{c.name}}</div>
</sc-for>
</div>
<div>
<div style="{{jHd}}">Team Josh<span style="{{jTurn}}">PICKING</span></div>
<sc-for list="{{teamJ}}" as="c" hint-placeholder-count="4">
<div style="{{c.st}}">{{c.name}}</div>
</sc-for>
</div>
</div>
</div>

<div style="flex: none; padding: 12px 16px 28px; background: var(--bg)">
<a href="Setup-tee.dc.html" style="{{btnSt}}">{{btn}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.carts = ['Ant + Steve', 'Justin + Chuck', 'Mitch + Peter', 'Sean + Baker', 'Joseph + Jay', 'Elijah + Marcus'];
    this.state = { picks: [] }; // in pick order; captains' carts are pre-placed
  }
  renderVals() {
    var self = this, s = this.state;
    // snake: J, A, A, J, J, A  (Andrew's cart is on A, Josh's cart on J already, so Josh picks first)
    var order = ['J', 'A', 'A', 'J', 'J', 'A'];
    var turn = order[s.picks.length];
    var A = ['Andrew + Alex'], J = ['Josh + Brandon'];
    s.picks.forEach(function (c, i) { (order[i] === 'A' ? A : J).push(c); });
    var pool = this.carts.filter(function (c) { return s.picks.indexOf(c) < 0; });
    var done = !turn;
    var hd = function (you, on) { return 'display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; height: 32px; color: ' + (you ? 'var(--meT)' : 'var(--tx2)'); };
    var tag = function (on) { return 'font-family: \'Geist Mono\', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 2px 6px; border-radius: 6px; border: 1px solid currentColor; ' + (on ? '' : 'display: none'); };
    var slot = function (name, you, i) {
      return { name: name, st: 'height: 48px; display: flex; align-items: center; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 6px; ' + (i === 0 ? 'background: ' + (you ? 'var(--tint)' : 'var(--s2)') + '; color: ' + (you ? 'var(--meT)' : 'var(--tx)') : 'border: 1px solid var(--ln)') };
    };
    return {
      mode: this.props.mode ?? 'dark',
      title: done ? 'Sides are set' : (turn === 'A' ? 'Andrew picks' : 'Josh picks'),
      sub: done ? 'Two sides of 4 carts. Tee times next.' : 'Snake order: Josh, Andrew, Andrew, Josh, Josh, Andrew. Tap a cart to take it.',
      hasPool: pool.length > 0,
      pool: pool.map(function (c) { return { name: c, tap: function () { self.setState({ picks: s.picks.concat([c]) }); } }; }),
      teamA: A.map(function (c, i) { return slot(c, true, i); }),
      teamJ: J.map(function (c, i) { return slot(c, false, i); }),
      aHd: hd(true), jHd: hd(false), aTurn: tag(turn === 'A'), jTurn: tag(turn === 'J'),
      reset: function () { self.setState({ picks: [] }); },
      btn: done ? 'Next: tee times' : 'Skip the draft · split in cart order',
      btnSt: 'display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 18px; font-size: 17px; font-weight: 600; text-decoration: none; ' + (done ? 'background: var(--btn); color: var(--btnT)' : 'background: var(--s2); color: var(--tx2)')
    };
  }
}
</script>
</body>
</html>
