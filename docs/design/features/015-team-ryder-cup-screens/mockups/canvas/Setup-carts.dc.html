<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup · Carts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--btn:#F4F5F7;--btnT:#0A0B0D;--card:none}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--btn:#0B0D10;--btnT:#FFFFFF;--card:0 1px 2px rgba(11,13,16,.06),0 4px 12px rgba(11,13,16,.05)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 0; height: 52px; flex: none">
<a href="Setup-players.dc.html" style="height: 48px; display: flex; align-items: center; gap: 2px; color: var(--tx2); text-decoration: none; font-size: 16px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Game</a>
<div style="display: flex; gap: 4px"><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--tx)"></i><i style="width: 22px; height: 4px; border-radius: 2px; background: var(--ln)"></i></div>
<button style="height: 48px; padding: 0 8px; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: var(--tx2); display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>Shuffle</button>
</div>

<div style="flex: 1; overflow: hidden; padding: 2px 20px 0">
<div class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">STEP 4 · TEAM RYDER CUP</div>
<div style="font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">Who rides together?</div>
<div style="font-size: 15px; line-height: 20px; color: var(--tx2); margin-top: 4px">{{hint}}</div>

<div style="margin-top: 16px">
<sc-for list="{{carts}}" as="c" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 8px; min-height: 60px; border-top: 1px solid var(--ln)">
<span class="mono" style="width: 32px; font-size: 13px; font-weight: 600; color: var(--tx2)">{{c.n}}</span>
<button onClick="{{c.p1.tap}}" style="{{c.p1.st}}">{{c.p1.name}}</button>
<span style="font-size: 13px; color: var(--tx2)">+</span>
<button onClick="{{c.p2.tap}}" style="{{c.p2.st}}">{{c.p2.name}}</button>
</div>
</sc-for>
</div>
</div>

<div style="flex: none; padding: 12px 16px 28px; background: var(--bg)">
<a href="Setup-draft.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 18px; background: var(--btn); color: var(--btnT); font-size: 17px; font-weight: 600; text-decoration: none">Next: pick sides</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null, names: ['Andrew', 'Alex', 'Ant', 'Steve', 'Justin', 'Chuck', 'Mitch', 'Peter', 'Sean', 'Baker', 'Josh', 'Brandon', 'Joseph', 'Jay', 'Elijah', 'Marcus'] };
  }
  renderVals() {
    var self = this, s = this.state;
    function chip(i) {
      var you = s.names[i] === 'Andrew', on = s.sel === i;
      return {
        name: s.names[i],
        st: 'flex: 1; height: 48px; border: 0; border-radius: 12px; background: var(--s1); box-shadow: var(--card); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (you ? 'var(--meT)' : 'var(--tx)') + (on ? '; outline: 2px solid var(--tx); outline-offset: 2px' : ''),
        tap: function () {
          if (s.sel === null) { self.setState({ sel: i }); return; }
          if (s.sel === i) { self.setState({ sel: null }); return; }
          var n = s.names.slice(), t = n[s.sel]; n[s.sel] = n[i]; n[i] = t;
          self.setState({ names: n, sel: null });
        }
      };
    }
    var carts = [];
    for (var c = 0; c < 8; c++) carts.push({ n: 'CART ' + (c + 1), p1: chip(c * 2), p2: chip(c * 2 + 1) });
    return {
      mode: this.props.mode ?? 'dark',
      hint: s.sel === null ? 'Paired in the order you added them. Tap two names to swap.' : 'Now tap who they swap with.',
      carts: carts
    };
  }
}
</script>
</body>
</html>
