<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board · live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--glass:rgba(24,26,31,0.72);--glassLn:rgba(255,255,255,0.09);--dock:inset 0 1px 0 rgba(255,255,255,.10),0 0 28px rgba(255,255,255,.06);--card:none}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#FFFFFF;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--glass:rgba(255,255,255,0.74);--glassLn:rgba(11,13,16,0.08);--dock:0 8px 24px rgba(11,13,16,.12);--card:0 1px 2px rgba(11,13,16,.06),0 10px 28px rgba(11,13,16,.09)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="height: 852px; overflow-y: auto; box-sizing: border-box; padding: 14px 16px 120px">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px; height: 48px">
<div style="font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px">Board</div>
<button aria-label="Share the board" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: var(--s1); box-shadow: var(--card); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></button>
</div>

<div style="margin-top: 12px; background: var(--s1); border-radius: 24px; padding: 18px 16px 16px; box-shadow: var(--card)">
<div class="mono" style="text-align: center; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">THE CUP · 3 MATCHES LEFT</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px">
<div>
<div style="font-size: 15px; line-height: 20px; font-weight: 600; color: var(--meT)">Team Andrew</div>
<div class="mono" style="font-size: 64px; line-height: 64px; font-weight: 700; letter-spacing: -2px; color: var(--meT); margin-top: 2px">5½</div>
</div>
<div style="text-align: right">
<div style="font-size: 15px; line-height: 20px; font-weight: 600; color: var(--tx2)">Team Josh</div>
<div class="mono" style="font-size: 64px; line-height: 64px; font-weight: 700; letter-spacing: -2px; margin-top: 2px">3½</div>
</div>
</div>
<div style="position: relative; display: flex; gap: 12px; margin-top: 20px">
<div style="flex: 1; display: flex; gap: 3px"><sc-for list="{{bar.left}}" as="s" hint-placeholder-count="6"><div style="{{s.st}}"></div></sc-for></div>
<div style="flex: 1; display: flex; gap: 3px"><sc-for list="{{bar.right}}" as="s" hint-placeholder-count="6"><div style="{{s.st}}"></div></sc-for></div>
<div style="position: absolute; left: 50%; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--tx)"></div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px">
<span style="font-size: 15px; line-height: 20px; font-weight: 600">1 more point wins it</span>
<span class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">6½ WINS</span>
</div>
</div>

<div style="display: flex; gap: 4px; padding: 4px; margin-top: 16px; border-radius: 16px; background: var(--s1)">
<button onClick="{{showCup}}" style="{{cupSeg}}">Cup</button>
<button onClick="{{showPlayers}}" style="{{playersSeg}}">Players</button>
</div>

<sc-if value="{{isCup}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 20px 4px 4px">
<span class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">NOW · HOLES 13–18</span>
<span class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px"><span style="color: var(--meT)">0</span><span style="color: var(--tx2)"> – 1</span></span>
</div>
<sc-for list="{{now}}" as="r" hint-placeholder-count="4">
<div style="{{r.rowSt}}">
<div style="flex: 1; min-width: 0">
<div style="{{r.topSt}}">{{r.top}}<span style="{{r.youSt}}">YOU</span></div>
<div style="font-size: 15px; line-height: 20px; font-weight: 500; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">v {{r.opp}}</div>
</div>
<div style="text-align: right; flex: none">
<div class="mono" style="{{r.stSt}}">{{r.st}}</div>
<div style="font-size: 13px; line-height: 18px; color: var(--tx2)">{{r.sub}}</div>
</div>
</div>
</sc-for>

<sc-for list="{{rots}}" as="g" hint-placeholder-count="2">
<button onClick="{{g.toggle}}" style="width: 100%; min-height: 56px; margin-top: 8px; padding: 0 4px; border: 0; border-top: 1px solid var(--ln); background: transparent; display: flex; align-items: center; gap: 10px; text-align: left">
<span class="mono" style="flex: 1; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">{{g.label}}</span>
<span class="mono" style="font-size: 15px; font-weight: 700"><span style="color: var(--meT)">{{g.a}}</span><span style="color: var(--tx2)"> – {{g.j}}</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="{{g.chev}}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{g.open}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
<div style="{{r.rowSt}}">
<div style="flex: 1; min-width: 0">
<div style="{{r.topSt}}">{{r.top}}<span style="{{r.youSt}}">YOU</span></div>
<div style="font-size: 15px; line-height: 20px; font-weight: 500; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">v {{r.opp}}</div>
</div>
<div style="text-align: right; flex: none">
<div class="mono" style="{{r.stSt}}">{{r.st}}</div>
<div style="font-size: 13px; line-height: 18px; color: var(--tx2)">{{r.sub}}</div>
</div>
</div>
</sc-for>
</sc-if>
</sc-for>
</sc-if>

<sc-if value="{{isPlayers}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 4px 4px">
<span class="mono" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; color: var(--tx2)">EVERYONE · NET</span>
<span style="font-size: 13px; color: var(--tx2)">Same as today</span>
</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; border-top: 1px solid var(--ln)">
<span class="mono" style="width: 18px; font-size: 13px; color: var(--tx2)">{{p.pos}}</span>
<span style="{{p.nameSt}}">{{p.name}}</span>
<span style="font-size: 13px; color: var(--tx2)">thru {{p.thru}}</span>
<span class="mono" style="width: 40px; text-align: right; font-size: 17px; font-weight: 700">{{p.net}}</span>
</div>
</sc-for>
</sc-if>

</div>

<nav aria-label="Round" style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; padding: 6px; border-radius: 34px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); border: 1px solid var(--glassLn); box-shadow: var(--dock)">
<a href="Matches-live.dc.html" aria-label="Enter" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></a>
<a href="Matches-live.dc.html" aria-label="Matches" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg></a>
<a href="Main.dc.html" aria-label="Board" aria-current="page" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: var(--s3); color: var(--tx)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg></a>
<a href="Main.dc.html" aria-label="Card" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'cup', open: {} };
  }
  bar(a, j) {
    var out = [], fa = Math.floor(a), fj = Math.floor(j);
    for (var i = 0; i < 12; i++) {
      var bg = 'var(--s2)';
      if (i < fa) bg = 'var(--me)';
      else if (a % 1 && i === fa) bg = 'linear-gradient(90deg, var(--me) 50%, var(--s2) 50%)';
      if (i >= 12 - fj) bg = 'var(--tx2)';
      else if (j % 1 && i === 11 - fj) bg = 'linear-gradient(90deg, var(--s2) 50%, var(--tx2) 50%)';
      out.push({ st: 'flex: 1; height: 14px; border-radius: 3px; background: ' + bg });
    }
    return { left: out.slice(0, 6), right: out.slice(6) };
  }
  row(top, opp, res, sub, you) {
    var st = res, stSt = 'font-size: 15px; line-height: 20px; font-weight: 700; ';
    if (res === 'won' || res === 'up') stSt += 'color: var(--meT)';
    else if (res === 'lost' || res === 'down') stSt += 'color: var(--tx2)';
    else if (res === '–') stSt += 'color: var(--tx2)';
    return {
      top: top, opp: opp, st: st, sub: sub,
      rowSt: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 4px; border-top: 1px solid var(--ln)',
      topSt: 'font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (you ? 'var(--meT)' : 'var(--tx)'),
      youSt: you ? 'font-family: \'Geist Mono\', monospace; font-size: 12px; font-weight: 600; letter-spacing: 1px; margin-left: 8px; color: var(--meT)' : 'display: none',
      stSt: stSt
    };
  }
  renderVals() {
    var self = this, s = this.state;
    var seg = function (on) { return 'flex: 1; height: 48px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; ' + (on ? 'background: var(--s3); color: var(--tx)' : 'background: transparent; color: var(--tx2)'); };
    var R = this.row.bind(this);
    var rots = [
      { key: 'r1', label: 'HOLES 7–12', a: '2½', j: '1½', rows: [
        R('Andrew + Alex', 'Josh + Brandon', 'won', '7½–4½', true),
        R('Ant + Steve', 'Joseph + Jay', 'halved', '6–6'),
        R('Justin + Chuck', 'Elijah + Marcus', 'lost', '4–8'),
        R('Mitch + Peter', 'Sean + Baker', 'won', '7–3')] },
      { key: 'r0', label: 'HOLES 1–6', a: '3', j: '1', rows: [
        R('Andrew + Alex', 'Sean + Baker', 'won', '7–5', true),
        R('Ant + Steve', 'Josh + Brandon', 'won', '6½–5½'),
        R('Justin + Chuck', 'Joseph + Jay', 'lost', '4–8'),
        R('Mitch + Peter', 'Elijah + Marcus', 'won', '7–5')] }
    ].map(function (g) {
      var open = !!s.open[g.key];
      return Object.assign(g, { open: open,
        chev: 'color: var(--tx2); flex: none; transition: transform 300ms ease; transform: rotate(' + (open ? 180 : 0) + 'deg)',
        toggle: function () { var o = Object.assign({}, s.open); o[g.key] = !open; self.setState({ open: o }); } });
    });
    return {
      mode: this.props.mode ?? 'dark',
      bar: this.bar(5.5, 3.5),
      isCup: s.view === 'cup', isPlayers: s.view === 'players',
      cupSeg: seg(s.view === 'cup'), playersSeg: seg(s.view === 'players'),
      showCup: function () { self.setState({ view: 'cup' }); },
      showPlayers: function () { self.setState({ view: 'players' }); },
      now: [
        R('Andrew + Alex', 'Joseph + Jay', 'up 2', 'thru 4', true),
        R('Justin + Chuck', 'Sean + Baker', 'lost', '1½–6½'),
        R('Ant + Steve', 'Elijah + Marcus', '–', 'they’re on 12'),
        R('Mitch + Peter', 'Josh + Brandon', '–', 'they’re on 12')
      ].map(function (r, i) { if (i === 0) r.stSt = 'font-size: 15px; line-height: 20px; font-weight: 700; color: var(--meT)'; return r; }),
      rots: rots,
      players: [
        { pos: '1', name: 'Sean', thru: 15, net: '−2' }, { pos: '2', name: 'Andrew', thru: 16, net: '−1', you: 1 },
        { pos: '3', name: 'Josh', thru: 13, net: 'E' }, { pos: 'T4', name: 'Alex', thru: 16, net: '+1' },
        { pos: 'T4', name: 'Chuck', thru: 16, net: '+1' }, { pos: '6', name: 'Baker', thru: 15, net: '+2' }
      ].map(function (p) { p.nameSt = 'flex: 1; font-size: 17px; font-weight: 600; color: ' + (p.you ? 'var(--meT)' : 'var(--tx)'); return p; })
    };
  }
}
</script>
</body>
</html>
