<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393">
<title>m</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--pink:#FF6FB5;--dbl:#FF6B6B;--dblBg:rgba(255,107,107,0.16);--btn:#F4F5F7;--btnT:#0A0B0D}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--pink:#C02A70;--dbl:#B42318;--dblBg:rgba(180,35,24,0.10);--btn:#0B0D10;--btnT:#FFFFFF}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}

.t{--glass:rgba(24,26,31,0.72);--glassLn:rgba(255,255,255,0.09);--shF:0 8px 24px rgba(0,0,0,0.45);--hl:#2A2E35}
.t.light{--glass:rgba(255,255,255,0.74);--glassLn:rgba(11,13,16,0.08);--shF:0 8px 24px rgba(11,13,16,0.12);--hl:#DDE0E5}
.t:not(.light) nav[aria-label="Round"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 0 28px rgba(255,255,255,.06)!important}
</style>
</head><body><div id="root"></div>
<template id="tpl">
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 0; height: 44px">
<div style="width: 32px; height: 32px; border-radius: 16px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">AB</div>
<div style="font-size: 15px; font-weight: 600">Andrew B.</div>
<div style="flex: 1; text-align: right; font-size: 14px; color: var(--tx2)">Twin Creeks · Fri</div>
</div>

<div style="display: flex; align-items: center; padding: 6px 8px 0">
<button aria-label="Previous hole" style="width: 52px; height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex: 1; text-align: center">
<div style="font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1">Hole 11</div>
<div style="font-size: 15px; color: var(--tx2); margin-top: 4px">Par 3 · Hcp 16 · 168 yds</div>
</div>
<button aria-label="Next hole" style="width: 52px; height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; opacity: 0.35"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>


<div style="margin: 12px 16px 0; border-radius: 24px; background: var(--s1); border: 1.5px solid var(--me); padding: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--meT)"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--me)"></span>Hogan’s Heroes</div>
<div class="mono" style="font-size: 13px; color: var(--tx2)">{{teamLine}}</div>
</div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="2">
<div style="{{p.cardSt}}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
<div style="font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px">{{p.name}}<sc-if value="{{p.stroke}}" hint-placeholder-val="{{ false }}"><span aria-label="gets a stroke" style="width: 7px; height: 7px; border-radius: 4px; background: var(--tx)"></span></sc-if></div>
<div class="mono" style="{{p.labelSt}}">{{p.label}}</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 10px">
<button onClick="{{p.minus}}" aria-label="{{p.minusLbl}}" style="width: 88px; height: 88px; border-radius: 20px; border: 1px solid var(--ln); background: var(--bg); font-size: 38px">−</button>
<div style="flex: 1; display: flex; justify-content: center"><span class="mono" style="{{p.shapeSt}}">{{p.v}}</span></div>
<button onClick="{{p.plus}}" aria-label="{{p.plusLbl}}" style="width: 88px; height: 88px; border-radius: 20px; border: 1px solid var(--ln); background: var(--bg); font-size: 38px">+</button>
</div>
</div>
</sc-for>
</div>

<div style="margin: 10px 16px 0; height: 56px; border-radius: 14px; background: var(--s1); display: flex; align-items: center; gap: 10px; padding: 0 4px 0 14px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: var(--pink)"></span>
<div style="font-size: 14px; font-weight: 700; color: var(--pink)">Fore Play</div>
<div class="mono" style="flex: 1; font-size: 14px; display: flex; align-items: center; gap: 6px">Sam <span style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">3</span> Jake <span style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; border-radius: 4px; border: 1.5px solid var(--tx2); box-sizing: border-box">4</span></div>
<button style="height: 48px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--s2); font-size: 14px; font-weight: 600">Edit</button>
</div>

<div style="margin: 16px 16px 0; display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="18"><div style="{{s}}"></div></sc-for>
</div>

<button style="{{nextSt}}">{{nextLabel}}</button>

<nav aria-label="Round" style="margin: auto 16px 20px; display: flex; flex: none; padding: 6px; border-radius: 34px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); border: 1px solid var(--glassLn); box-shadow: var(--shF)"><a href="Main.dc.html" aria-label="Enter" aria-current="page" style="flex: 1; height: 56px; border-radius: 28px; position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; background: var(--hl); color: var(--tx)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></a><a href="A-Matches-v3a-expand.dc.html" aria-label="Matches" style="flex: 1; height: 56px; border-radius: 28px; position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg></a><a href="A-Board.dc.html" aria-label="Board" style="flex: 1; height: 56px; border-radius: 28px; position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg></a><a href="A-Card.dc.html" aria-label="Card" style="flex: 1; height: 56px; border-radius: 28px; position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--tx2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg></a></nav>
</div>
</template>
<script>
class DCLogic{constructor(p){this.props=p;this.state={}}setState(s){Object.assign(this.state,s);draw()}}
class Component extends DCLogic{
  constructor(props) {
    super(props);
    this.state = { andrew: 2, sean: null };
  }
  renderVals() {
    var self = this;
    var PAR = 3;
    var names = { '-2': 'ACE', '-1': 'BIRDIE', '0': 'PAR', '1': 'BOGEY', '2': 'DOUBLE', '3': 'TRIPLE' };
    function shape(s, size, fs) {
      var b = 'display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: ' + size + 'px; height: ' + size + 'px; font-size: ' + fs + 'px; font-weight: 700; line-height: 1; letter-spacing: -2px; ';
      if (s === null) return b + 'border-radius: 50%; border: 2px dashed var(--ln); color: var(--tx2); opacity: 0.6';
      var d = s - PAR;
      if (d <= -2) return b + 'border-radius: 50%; border: 9px double var(--tx)';
      if (d === -1) return b + 'border-radius: 50%; border: 3.5px solid var(--tx)';
      if (d === 1) return b + 'border-radius: 18px; border: 3.5px solid var(--tx2)';
      if (d >= 2) return b + 'border-radius: 18px; border: 9px double var(--dbl); background: var(--dblBg); color: var(--dbl)';
      return b;
    }
    function mk(key, name, stroke) {
      var s = self.state[key];
      var d = s === null ? null : s - PAR;
      var set = function (delta) { return function () { var cur = self.state[key]; var nv = cur === null ? PAR + delta : Math.max(1, Math.min(9, cur + delta)); var o = {}; o[key] = nv; self.setState(o); }; };
      return {
        name: name, stroke: stroke,
        v: s === null ? String(PAR) : String(s),
        shapeSt: shape(s, 112, 72),
        label: s === null ? 'TAP − / + · PAR' : (names[String(d)] || '+' + d),
        labelSt: 'font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: ' + (s === null ? 'var(--tx2)' : (d < 0 ? 'var(--meT)' : (d >= 2 ? 'var(--dbl)' : 'var(--tx2)'))),
        cardSt: 'margin-top: 10px; border-radius: 18px; background: var(--s2); padding: 12px' + (s === null ? '; outline: 2px dashed var(--ln); outline-offset: -2px' : ''),
        minus: set(-1), plus: set(1), minusLbl: name + ' minus one', plusLbl: name + ' plus one'
      };
    }
    var players = [mk('andrew', 'Andrew B.', false), mk('sean', 'Sean', true)];
    var a = this.state.andrew, s = this.state.sean;
    var lb = s === null ? a : Math.min(a, s - 1);
    var segs = [];
    for (var i = 1; i <= 18; i++) {
      var bg = i < 11 ? 'var(--tx2)' : (i === 11 ? 'var(--me)' : 'var(--ln)');
      segs.push((i === 7 || i === 13 ? 'margin-left: 6px; ' : '') + 'flex: 1; height: ' + (i === 11 ? 8 : 6) + 'px; border-radius: 4px; background: ' + bg + '; opacity: ' + (i < 11 ? 0.6 : 1));
    }
    var left = s === null;
    return {
      mode: this.props.mode ?? 'dark',
      players: players, segs: segs,
      teamLine: 'LB ' + lb + ' · LT ' + (s === null ? '–' : (a + s - 1)) + ' net',
      nextLabel: left ? 'Next hole · Sean left' : 'Next hole →',
      nextSt: 'margin: 12px 16px 0; height: 58px; border-radius: 16px; border: 0; font-size: 17px; font-weight: 700; ' + (left ? 'background: var(--s2); color: var(--tx2)' : 'background: var(--btn); color: var(--btnT)')
    };
  }
}
var mode=new URLSearchParams(location.search).get('mode')||'dark';
var C=new Component({mode:mode}),fns={},fi=0;
function get(ctx,path){return path.split('.').reduce((o,k)=>o==null?o:o[k],ctx)}
function fill(el,ctx){
 [...el.childNodes].forEach(n=>{
  if(n.nodeType===3){n.textContent=n.textContent.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{var v=get(ctx,p);return v==null?'':v});return}
  if(n.nodeType!==1)return;
  var tag=n.tagName.toLowerCase();
  if(tag==='sc-for'){var list=get(ctx,n.getAttribute('list').replace(/[{}\s]/g,''))||[],as=n.getAttribute('as'),frag=document.createDocumentFragment();
   list.forEach(it=>{var c=document.createElement('div');c.innerHTML=n.innerHTML;var x=Object.assign({},ctx);x[as]=it;fill(c,x);while(c.firstChild)frag.appendChild(c.firstChild)});n.replaceWith(frag);return}
  if(tag==='sc-if'){var v=get(ctx,n.getAttribute('value').replace(/[{}\s]/g,''));if(!v){n.remove();return}var c=document.createElement('div');c.innerHTML=n.innerHTML;fill(c,ctx);n.replaceWith(...c.childNodes);return}
  [...n.attributes].forEach(a=>{var m=a.value.match(/^\{\{\s*([\w.]+)\s*\}\}$/);
   if(a.name==='onclick'&&m){var f=get(ctx,m[1]);n.removeAttribute('onclick');n.addEventListener('click',e=>{e.preventDefault();f()});return}
   n.setAttribute(a.name,a.value.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(q,p)=>{var v=get(ctx,p);return v==null?'':v}))});
  fill(n,ctx)})}
function draw(){var r=document.getElementById('root');r.innerHTML=document.getElementById('tpl').innerHTML;fill(r,C.renderVals())}
draw();
</script></body></html>
