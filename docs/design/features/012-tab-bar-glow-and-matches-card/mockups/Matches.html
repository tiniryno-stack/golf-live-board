<script>
class DCLogic{constructor(p){this.props=p;this.state={}}setState(s){Object.assign(this.state,s);draw()}}
class Component extends DCLogic{
  constructor(props) {
    super(props);
    this.state = { open: null };
  }
  renderVals() {
    var self = this;
    var open = this.state.open || (this.props.startView ?? 'mine');
    var other = open === 'other';
    function dot(c, outline) { return 'width: 10px; height: 10px; border-radius: 5px; flex: none; box-sizing: border-box; ' + (outline ? 'border: 2px solid ' + c : 'background: ' + c); }
    function rows(A, B, data, h, compact) {
      return data.map(function (d, i) {
        function cell(k) {
          if (k === 'a') return [dot(A.c), 'color: ' + A.t, A.n];
          if (k === 'b') return [dot(B.c), 'color: ' + B.t, B.n];
          if (k === 'push') return [dot('var(--tx2)', true), 'color: var(--tx2)', 'Push'];
          if (k === 'live') return [dot('var(--ln)', true), 'color: var(--tx2)', 'Live'];
          return [dot('var(--ln)', true), 'color: var(--tx2)', '–'];
        }
        var lb = cell(d.lb), lt = cell(d.lt);
        return { h: d.h, par: d.par, pts: d.pts, lbDot: lb[0], lbTx: lb[1], lb: lb[2], ltDot: lt[0], ltTx: lt[1], lt: lt[2],
          rowSt: 'display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 64px; gap: 8px; align-items: center; height: ' + h + 'px; border-top: 1px solid var(--ln)' };
      });
    }
    function cells(a, b, ca, cb, h) {
      var out = [];
      for (var i = 0; i < 12; i++) out.push('flex: 1; height: ' + h + 'px; border-radius: 4px; background: ' + (i < a ? ca : (i >= 12 - b ? cb : 'var(--s2)')));
      return out;
    }
    function gdot(k) {
      var s = 'width: 20px; height: 20px; border-radius: 10px; box-sizing: border-box; ';
      if (k === 'a') return s + 'background: var(--blue)';
      if (k === 'b') return s + 'background: var(--vio)';
      if (k === 'push') return s + 'background: linear-gradient(90deg, var(--blue) 50%, var(--vio) 50%)';
      if (k === 'live') return s + 'border: 2px dashed var(--tx2)';
      return s + 'border: 2px solid var(--ln)';
    }
    var HH = { c: 'var(--me)', t: 'var(--meT)', n: 'Hogan’s' }, FP = { c: 'var(--pink)', t: 'var(--pink)', n: 'Fore Play' };
    var SR = { c: 'var(--blue)', t: 'var(--blue)', n: 'Shank' }, BB = { c: 'var(--vio)', t: 'var(--vio)', n: 'Bogey' };
    return {
      mode: this.props.mode ?? 'dark', glow: this.props.glow ?? 'soft',
      openMine: function () { self.setState({ open: 'mine' }); },
      toggleOther: function () { self.setState({ open: other ? 'mine' : 'other' }); },
      otherLbl: other ? 'WATCHING' : 'ALSO',
      chevSt: 'color: var(--tx2); transform: rotate(' + (other ? '180deg' : '0deg') + ')',
      mineBarSt: 'max-height: ' + (other ? '80px' : '0px') + '; opacity: ' + (other ? 1 : 0),
      mineFullSt: 'max-height: ' + (other ? '0px' : '700px') + '; opacity: ' + (other ? 0 : 1),
      otherFullSt: 'max-height: ' + (other ? '640px' : '0px') + '; opacity: ' + (other ? 1 : 0),
      mineCells: cells(5, 3, 'var(--me)', 'var(--pink)', 18),
      otherCells: cells(5, 0, 'var(--blue)', 'var(--vio)', 12),
      mineRows: rows(HH, FP, [
        { h: 7, par: 3, lb: 'b', lt: 'b', pts: '0–2' }, { h: 8, par: 4, lb: 'a', lt: 'a', pts: '2–0' },
        { h: 9, par: 4, lb: 'push', lt: 'a', pts: '1½–½' }, { h: 10, par: 4, lb: 'a', lt: 'push', pts: '1½–½' },
        { h: 11, par: 3, lb: 'live', lt: 'live', pts: 'now' }, { h: 12, par: 4, lb: 'none', lt: 'none', pts: '–' }], 44),
      oHoles: [7, 8, 9, 10, 11, 12].map(function (h, i) { return { h: h, par: [3, 4, 4, 4, 3, 4][i], st: 'text-align: center' + (h === 10 ? '; color: var(--blue)' : (h > 10 ? '; opacity: 0.55' : '')) }; }),
      oLb: ['a', 'a', 'push', 'live', 'none', 'none'].map(gdot),
      oLt: ['a', 'a', 'a', 'live', 'none', 'none'].map(gdot),
      otherRows: rows(SR, BB, [
        { h: 7, par: 3, lb: 'a', lt: 'a', pts: '2–0' }, { h: 8, par: 4, lb: 'a', lt: 'a', pts: '2–0' },
        { h: 9, par: 4, lb: 'push', lt: 'a', pts: '1½–½' }, { h: 10, par: 4, lb: 'live', lt: 'live', pts: 'now' },
        { h: 11, par: 3, lb: 'none', lt: 'none', pts: '–' }, { h: 12, par: 4, lb: 'none', lt: 'none', pts: '–' }], 44)
    };
  }
}
var mode=new URLSearchParams(location.search).get('mode')||'dark';
var C=new Component({mode:mode,startView:new URLSearchParams(location.search).get('view')||'mine'}),fns={},fi=0;
function get(ctx,path){return path.split('.').reduce((o,k)=>o==null?o:o[k],ctx)}
function fill(el,ctx){
 [...el.childNodes].forEach(n=>{
  if(n.nodeType===3){n.textContent=n.textContent.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{var v=get(ctx,p);return v==null?'':v});return}
  if(n.nodeType!==1)return;
  var tag=n.tagName.toLowerCase();
