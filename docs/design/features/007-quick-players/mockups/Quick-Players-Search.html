<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393"><title>Quick-Players-Search</title>

<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--org:#FF9A4A;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--err:#FF5A5A;--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10);--scrim:rgba(0,0,0,0.6);--shC:none;--shS:0 -8px 32px rgba(0,0,0,0.5)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#DDE0E5;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--org:#B85A00;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--err:#C8282D;--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10);--scrim:rgba(11,13,16,0.35);--shC:0 1px 2px rgba(11,13,16,0.06),0 4px 12px rgba(11,13,16,0.05);--shS:0 -8px 32px rgba(11,13,16,0.16)}

.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}

<style>body{margin:0}</style></head><body>

<div style="padding: 2px 20px 0"><div class="lbl">STEP 2 · PLAYERS</div><div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">Who’s playing?</div></div><label style="margin: 12px 16px 0; height: 52px; border-radius: 14px; border: 2px solid var(--tx); background: var(--s1); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--tx2); flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input aria-label="Search the crew" placeholder="Search Saturday Crew" value="chr" style="flex: 1; border: 0; background: transparent; color: var(--tx); font-size: 16px; outline: none; height: 48px"></label><div style="display: flex; margin: 16px 20px 8px"><span class="lbl" style="flex: 1">IN SATURDAY CREW · 3</span></div>

: center; font-size: 12px; font-weight: 700; flex: none">CK</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Chris K.</span><span style="display: block; font-size: 12px; color: var(--tx2); margin-top: 2px">Played once · Aug</span></span><span class="mono" style="font-size: 14px; color: var(--tx2); width: 36px; text-align: right">22.0</span><span style="width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--ln); box-sizing: border-box; flex: none"></span></button></div>

<div style="margin: 8px 20px 0; font-size: 13px; color: var(--tx2)">4 picked · Andrew D., Sean M., Mike T., Tyler</div><button style="margin: auto 16px 16px; height: 60px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 18px; font-weight: 700; flex: none">Next: pick a game · 4</button>
</div>
<script>if(location.search.includes("light"))document.querySelector(".t").classList.replace("dark","light")</script></body></html>
