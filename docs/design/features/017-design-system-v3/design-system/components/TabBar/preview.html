<!-- @dsCard group="Navigation" height=130 subtitle="Icons only; a soft highlight slides to the active tab" -->
<div class="root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
.root{font-family:var(--font-sans);color:var(--text);background:var(--bg);padding:24px 16px;max-width:393px;box-sizing:border-box;}
.bar{position:relative;display:flex;padding:6px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:var(--shadow-dock)}
.hl{position:absolute;top:6px;left:6px;width:calc((100% - 12px) / 4);height:56px;border-radius:28px;background:var(--surface-3);transform:translateX(200%)}
[data-theme="light"] .hl{background:var(--surface-2)}
.tb{position:relative;z-index:1;flex:1;height:56px;border:0;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center}
.tb.on{color:var(--text)}
.dot{position:absolute;top:15px;left:calc(50% + 6px);width:8px;height:8px;border-radius:4px;background:var(--text);box-shadow:0 0 0 2px var(--surface-1)}
</style>
<nav class="bar" aria-label="Round"><div class="hl"></div>
<button class="tb" aria-label="Enter"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg><i class="dot"></i></button>
<button class="tb" aria-label="Matches"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg></button>
<button class="tb on" aria-label="Board" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg></button>
<button class="tb" aria-label="Card"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg></button>
</nav>
</div>
