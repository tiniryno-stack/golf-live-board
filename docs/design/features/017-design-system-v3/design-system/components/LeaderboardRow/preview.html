<!-- @dsCard group="Board" height=200 subtitle="Official vs provisional points" -->
<div class="root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
.root{font-family:var(--font-sans);color:var(--text);background:var(--bg);padding:16px;max-width:393px;box-sizing:border-box}
.r{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.r.you{background:var(--tint-you);border-radius:14px;padding:14px 10px;margin:0 -6px}
.pos{font-family:var(--font-mono);width:14px;font-size:14px;color:var(--text-muted)}
.m{flex:1;min-width:0}.m b{font-size:18px;font-weight:700}.m i{display:block;font-style:normal;font-size:13px;color:var(--text-muted);margin-top:2px}
.you-tag{font-size:11px;font-weight:700;color:var(--cart-you-text);letter-spacing:.6px;margin-left:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:9px;display:flex;overflow:hidden}
.hatch{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px)}
.pts{width:72px;text-align:right}.pts b{font-family:var(--font-mono);font-size:34px;font-weight:700;line-height:1;display:block}
.prov{font-family:var(--font-mono);display:inline-block;margin-top:4px;font-size:11px;padding:2px 6px;border-radius:6px;border:1px dashed var(--text-muted);color:var(--text-muted)}
</style>
<div class="r"><span class="pos">1</span><div class="m"><b>Shank Redemption</b><i>Mike + Tyler · 1-0-0 · thru 9</i><div class="bar"><div style="width:87%;background:var(--cart-b)"></div></div></div><div class="pts"><b style="color:var(--cart-b)">14</b></div></div>
<div class="r you"><span class="pos">2</span><div class="m"><b>Hogan’s Heroes</b><span class="you-tag">YOU</span><i>Andrew B. + Sean · 0-1-0 · thru 10</i><div class="bar"><div style="width:50%;background:var(--cart-you)"></div><div class="hatch" style="--c:var(--cart-you);width:9.5%"></div></div></div><div class="pts"><b style="color:var(--cart-you-text)">9½</b><span class="prov">+1½ prov</span></div></div>
</div>
