<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Partner Rider Cup · Matches</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--tintMe:rgba(61,220,132,.10);--a:#FF9F43;--b:#5B9BFF;--c:#FF6FB5;--d:#B18CFF;--dbl:#FF6B6B;--dblBg:rgba(255,107,107,.16);--glass:rgba(21,23,27,.92);--gl:rgba(255,255,255,.09);--dock:inset 0 1px 0 rgba(255,255,255,.10),0 0 28px rgba(255,255,255,.06);--card:none;--hl:#2A2E35}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#FFFFFF;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--tintMe:rgba(18,163,92,.09);--a:#B35C00;--b:#1A5FD0;--c:#C02A70;--d:#6E3FD0;--dbl:#B42318;--dblBg:rgba(180,35,24,.10);--glass:rgba(255,255,255,.94);--gl:rgba(11,13,16,.08);--dock:0 8px 24px rgba(11,13,16,.12);--card:0 1px 2px rgba(11,13,16,.06),0 4px 12px rgba(11,13,16,.05);--hl:#E8EAEE}
.mono,.lbl,.mk{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--tx2)}
.mk{font-weight:700;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:17px;box-sizing:border-box}
.c{border-radius:50%;border:1.5px solid currentColor}.sq{border-radius:5px;border:1.5px solid var(--tx2)}
.seg{flex:1;height:54px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:600;color:var(--tx2)}.seg.on{background:var(--s3);color:var(--tx);box-shadow:var(--card)}.seg small{font-size:12px;font-weight:500}
.tile{height:60px;border-radius:16px;background:var(--s1);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:'Geist Mono',monospace;font-size:15px;font-weight:700;color:var(--tx)}.tile.on{outline:2px solid var(--tx);outline-offset:-2px}
.ds{display:flex;flex-direction:column;gap:3px}.d{width:11px;height:11px;display:block}
.tab{flex:1;height:56px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--tx2);position:relative;z-index:1}.tab.on{color:var(--tx)}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div class="t {{mode}}" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: Geist, system-ui, sans-serif; position: relative; overflow: hidden">
<div style="height: 59px"></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 56px">
<span style="width: 36px; height: 36px; border-radius: 18px; background: var(--s2); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">A</span>
<b style="font-size: 17px; font-weight: 600">Andrew</b>
<span style="flex: 1; text-align: right; font-size: 15px; color: var(--tx2)">Twin Creeks · Fri</span>
<button aria-label="Round menu" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--s2); font-size: 18px; letter-spacing: 1px">···</button>
</div>
<div style="padding: 4px 16px 0">
<div class="lbl">Holes 7–12 · <span style="color: var(--meT)">Live</span></div>
<div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 36px; margin-top: 2px">vs <span style="color: var(--c)">Fore Play</span></div>
<div style="font-size: 15px; color: var(--tx2); margin-top: 2px">8:50 tee time · they’re on 9</div>
<div style="display: flex; gap: 4px; padding: 4px; margin-top: 12px; border-radius: 16px; background: var(--s1)">
<button class="seg"><span>1–6</span><small>won 7–5</small></button>
<button class="seg on" aria-pressed="true"><span>7–12</span><small style="color: var(--meT)">live</small></button>
<button class="seg"><span>13–18</span><small>up next</small></button>
</div>
<div style="margin-top: 12px; padding: 16px; border-radius: 24px; background: var(--s1); box-shadow: var(--card)">
<div class="lbl" style="color: var(--meT)">Thru 2 · All square</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: end; margin-top: 4px">
<div><div style="font-size: 15px; font-weight: 700; color: var(--meT)">Hogan’s Heroes</div><div class="mono" style="font-size: 32px; font-weight: 700; line-height: 1.15; color: var(--meT)">2</div></div>
<div style="text-align: right"><div style="font-size: 15px; font-weight: 700; color: var(--c)">Fore Play</div><div class="mono" style="font-size: 32px; font-weight: 700; line-height: 1.15">2</div></div>
</div>
<div style="position: relative; height: 12px; border-radius: 6px; background: var(--s2); overflow: hidden; margin-top: 12px"><b style="position: absolute; top: 0; bottom: 0; left: 0; width: 16.6%; background: var(--me)"></b><b style="position: absolute; top: 0; bottom: 0; right: 0; width: 16.6%; background: var(--c)"></b><i style="position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--tx)"></i></div>
<div style="display: flex; justify-content: space-between; margin-top: 8px"><span style="font-size: 13px; color: var(--tx2)">8 pts left</span><span class="lbl">6½ clinches</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 12px">
<button class="tile"><span>7</span><span class="ds"><svg class="d" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="5.5" fill="var(--me)"></circle></svg><svg class="d" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="5.5" fill="var(--me)"></circle></svg></span></button>
<button class="tile on" aria-pressed="true"><span>8</span><span class="ds"><svg class="d" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="5.5" fill="var(--c)"></circle></svg><svg class="d" viewBox="0 0 11 11"><path d="M5.5 0A5.5 5.5 0 0 0 5.5 11Z" fill="var(--me)"></path><path d="M5.5 0A5.5 5.5 0 0 1 5.5 11Z" fill="var(--c)"></path></svg></span></button>
<button class="tile"><span>9</span><span class="ds"><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--tx2)" stroke-width="1.5"><circle cx="5.5" cy="5.5" r="4.75"></circle><line x1="1.83" y1="6.97" x2="4.03" y2="9.17"></line><line x1="2.67" y1="2.67" x2="8.33" y2="8.33"></line><line x1="6.97" y1="1.83" x2="9.17" y2="4.03"></line></svg><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--tx2)" stroke-width="1.5"><circle cx="5.5" cy="5.5" r="4.75"></circle><line x1="1.83" y1="6.97" x2="4.03" y2="9.17"></line><line x1="2.67" y1="2.67" x2="8.33" y2="8.33"></line><line x1="6.97" y1="1.83" x2="9.17" y2="4.03"></line></svg></span></button>
<button class="tile"><span>10</span><span class="ds"><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--ln)" stroke-width="1.5" stroke-dasharray="2 1.7"><circle cx="5.5" cy="5.5" r="4.75"></circle></svg><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--ln)" stroke-width="1.5" stroke-dasharray="2 1.7"><circle cx="5.5" cy="5.5" r="4.75"></circle></svg></span></button>
<button class="tile"><span>11</span><span class="ds"><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--ln)" stroke-width="1.5" stroke-dasharray="2 1.7"><circle cx="5.5" cy="5.5" r="4.75"></circle></svg><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--ln)" stroke-width="1.5" stroke-dasharray="2 1.7"><circle cx="5.5" cy="5.5" r="4.75"></circle></svg></span></button>
<button class="tile"><span>12</span><span class="ds"><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--ln)" stroke-width="1.5" stroke-dasharray="2 1.7"><circle cx="5.5" cy="5.5" r="4.75"></circle></svg><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--ln)" stroke-width="1.5" stroke-dasharray="2 1.7"><circle cx="5.5" cy="5.5" r="4.75"></circle></svg></span></button>
</div>
<div style="display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--tx2)"><svg class="d" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="5.5" fill="var(--me)"></circle></svg><span style="margin-right: 8px">counted</span><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--tx2)" stroke-width="1.5"><circle cx="5.5" cy="5.5" r="4.75"></circle><line x1="2.67" y1="2.67" x2="8.33" y2="8.33"></line></svg><span style="margin-right: 8px">one cart in</span><svg class="d" viewBox="0 0 11 11" fill="none" stroke="var(--ln)" stroke-width="1.5" stroke-dasharray="2 1.7"><circle cx="5.5" cy="5.5" r="4.75"></circle></svg><span>nobody yet</span></div>
<div style="margin-top: 12px">
<div style="display: flex; align-items: baseline; gap: 4px; font-size: 17px"><b>Hole 8</b><span style="color: var(--tx2)">· par 4</span><span class="mono" style="margin-left: auto; font-size: 15px; font-weight: 700">1–1</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: var(--meT)">Andrew</span><span class="mk c">3</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: var(--meT)">Sean</span><span class="mk sq">5</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: var(--c)">Sam</span><span class="mk">4</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: var(--c)">Jake</span><span class="mk">4</span></div>
</div>
<div style="display: flex; gap: 16px; margin-top: 8px; font-size: 15px"><span style="display: inline-flex; align-items: center; gap: 6px"><svg class="d" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="5.5" fill="var(--me)"></circle></svg>Low ball · you</span><span style="display: inline-flex; align-items: center; gap: 6px"><svg class="d" viewBox="0 0 11 11"><path d="M5.5 0A5.5 5.5 0 0 0 5.5 11Z" fill="var(--me)"></path><path d="M5.5 0A5.5 5.5 0 0 1 5.5 11Z" fill="var(--c)"></path></svg>Low total · halved</span></div>
</div>
</div>
<nav aria-label="Round" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; padding: 6px; border-radius: 34px; background: var(--glass); border: 1px solid var(--gl); box-shadow: var(--dock)">
<div style="position: absolute; top: 6px; left: 6px; width: calc((100% - 12px) / 4); height: 56px; border-radius: 28px; background: var(--hl); transform: translateX(100%)"></div>
<button class="tab" aria-label="Enter"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></button>
<button class="tab on" aria-label="Matches" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="12" r="5"></circle><circle cx="15.5" cy="12" r="5"></circle></svg></button>
<button class="tab" aria-label="Board"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"></path></svg></button>
<button class="tab" aria-label="Card"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16M15 4v16"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() { return { mode: this.props.mode ?? 'dark' }; }
}
</script>
</body>
</html>
