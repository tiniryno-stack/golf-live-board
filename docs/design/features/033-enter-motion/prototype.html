<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=Geist+Mono:wght@600;700&display=swap">
<link rel="stylesheet" href="motion.css">
<style>
/* 033 prototype. Tokens = docs/design/design-system/tokens.css (copied so this page stands alone). Layout = the app's
   calm Enter (css/styles.css .ce-*, 021–031). Motion = motion.css, loaded as it is. Reference only: rebuild in the app. */
:root {
  --font-sans: Geist, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 18px; --radius-2xl: 24px; --radius-sheet: 28px;
  --button-primary: 60px;
  --bg: #0a0b0d; --surface-1: #15171b; --surface-2: #1f2227; --surface-3: #2a2e35;
  --text: #f4f5f7; --text-muted: #a7acb4; --line: #2b2f36;
  --cart-you: #3ddc84; --cart-you-text: #3ddc84; --tint-you: rgba(61,220,132,0.10);
  --double: #ff6b6b; --double-bg: rgba(255,107,107,0.16); --warn: #f5c64a;
  --button: #f4f5f7; --on-button: #0a0b0d; --scrim: rgba(0,0,0,0.6);
  --shadow-card: none; --shadow-dock: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 28px rgba(255,255,255,0.06);
  --shadow-sheet: 0 -8px 32px rgba(0,0,0,0.5);
  --motion-grow: 300ms; --ease-grow: cubic-bezier(0.2, 0.8, 0.2, 1); --blur-swap: 8px; --peek: 0.6;
  --glass: rgba(21,23,27,0.92); --glass-line: rgba(255,255,255,0.09);
  --page: #050607; --frame: #23262c;
  color-scheme: dark;
}
html.light {
  --bg: #f2f3f5; --surface-1: #ffffff; --surface-2: #e8eaee; --surface-3: #ffffff;
  --text: #0b0d10; --text-muted: #4f555e; --line: #d5d9df;
  --cart-you: #12a35c; --cart-you-text: #0a7a43; --tint-you: rgba(18,163,92,0.09);
  --double: #b42318; --double-bg: rgba(180,35,24,0.10); --warn: #8a6000;
  --button: #0b0d10; --on-button: #ffffff; --scrim: rgba(11,13,16,0.35);
  --shadow-card: 0 1px 2px rgba(11,13,16,0.06), 0 4px 12px rgba(11,13,16,0.05);
  --shadow-dock: 0 8px 24px rgba(11,13,16,0.12); --shadow-sheet: 0 -8px 32px rgba(11,13,16,0.16);
  --glass: rgba(255,255,255,0.94); --glass-line: rgba(11,13,16,0.08);
  --page: #dfe2e6; --frame: #c4c8ce;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--page); color: var(--text); font: 500 15px/20px var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mono { font-family: var(--font-mono); }

/* page: phone-size = the screen itself; wider = a phone frame + the prototype controls beside it */
.page { height: 100%; display: flex; align-items: center; justify-content: center; gap: 32px; }
.phone { position: relative; width: 100vw; height: 100vh; height: 100dvh; background: var(--bg); overflow: hidden; }
.ctl { display: none; }
@media (min-width: 760px) {
  .phone { width: 393px; height: 659px; border-radius: 36px; box-shadow: 0 0 0 10px var(--frame), 0 30px 80px rgba(0,0,0,.35); flex: none; }
  .ctl { display: block; width: 300px; max-height: 659px; overflow: auto; }
}

/* the Enter screen (live sizes from css/styles.css) */
.ce { position: absolute; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 16px calc(92px + env(safe-area-inset-bottom, 0px)); overflow: hidden; background: var(--bg); }
.ce-head { display: flex; align-items: center; gap: var(--space-2); min-height: 54px; padding-top: 6px; flex: none; position: relative; z-index: 3; }
.ce-hole { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.ce-hn { font-size: 32px; font-weight: 700; letter-spacing: -.5px; line-height: 32px; --t-h: 32px; white-space: nowrap; }
.ce-hp { font-size: 17px; font-weight: 500; color: var(--text-muted); line-height: 22px; --t-h: 22px; white-space: nowrap; }
.ce-nav { flex: none; display: flex; align-items: center; margin-right: -8px; }
.ce-ib { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text-muted); }
.ce-ib:disabled { opacity: .35; cursor: default; }
.green-card { height: 92px; margin-top: 6px; flex: none; border-radius: var(--radius-2xl); background: var(--surface-1); box-shadow: var(--shadow-card);
  display: grid; grid-template-columns: 62px 1fr 1.35fr 1fr; align-items: center; padding: 0 14px; gap: 10px; position: relative; z-index: 1; }
.green-card.compact { height: 68px; grid-template-columns: 44px 1fr 1.35fr 1fr; }
.green-pic { position: relative; display: grid; place-items: center; color: var(--text); }
.green-pic > * { grid-area: 1 / 1; }
.green-pic .t-swap-out { position: absolute; inset: 0; display: grid; place-items: center; }
.gn { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.gn b { font: 600 17px/17px var(--font-mono); --t-h: 17px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gn .label { font: 600 12px/16px var(--font-mono); letter-spacing: 1px; color: var(--text-muted); }
.gn.mid b { font-size: 32px; line-height: 32px; --t-h: 32px; font-weight: 700; letter-spacing: -1.5px; color: var(--text); }
.gn.mid .label { color: var(--text); }
.green-card.compact .gn b { font-size: 15px; line-height: 15px; --t-h: 15px; }
.green-card.compact .gn.mid b { font-size: 32px; line-height: 32px; --t-h: 32px; }
.green-card.compact .gn .label { font-size: 12px; line-height: 14px; }

.ce-body { display: flex; flex-direction: column; flex: none; }
.ce-match { height: 36px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); font-size: 15px; font-weight: 500; color: var(--text-muted); min-width: 0; white-space: nowrap; }
.ce-us { color: var(--text); font-weight: 600; min-width: 0; flex: 0 1 auto; }
.ce-end { display: flex; align-items: center; gap: 12px; flex: none; min-width: 0; }
.ce-up { display: inline-flex; overflow: hidden; height: 20px; font-family: var(--font-mono); font-weight: 700; color: var(--cart-you-text); }
.ce-up.muted { color: var(--text-muted); }
.ce-roll { display: flex; flex-direction: column; line-height: 20px; }
.ce-swap { display: grid; min-width: 0; }
.ce-swap > * { grid-area: 1 / 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ce-won { font-size: 15px; font-weight: 600; opacity: 0; color: var(--text); }
.ce-won.muted { color: var(--text-muted); }
.ce-edit, .ce-done { height: 48px; display: flex; align-items: center; padding-left: 12px; font-weight: 600; color: var(--text); flex: none; }
.ce-st { font-family: var(--font-mono); font-weight: 700; }
.ce-st.you { color: var(--cart-you-text); }

.ce-card { background: var(--surface-1); border-radius: var(--radius-xl); padding: 2px 16px 6px; margin-top: 2px; position: relative; box-shadow: var(--shadow-card); }
.ce-card.rail::before { content: ''; position: absolute; left: 6px; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--cart-you); }
.ce-row { padding: 8px 0 4px; border-top: 1px solid var(--ce-line); }
.ce-row:first-child { border-top: 0; }
.ce-nm { height: 24px; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; min-width: 0; white-space: nowrap; }
.ce-nm > b { font-size: 17px; font-weight: 600; min-width: 0; flex: 0 1 auto; }
.ce-stk { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.ce-pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) 56px; gap: 6px; }
.ce-pad { height: 64px; border-radius: var(--radius-lg); display: grid; place-items: center; position: relative; color: var(--text); }
.ce-pad.sel { background: var(--text); color: var(--bg); }
.ce-pad svg.ce-m { position: absolute; inset: 0; margin: auto; overflow: visible; }
.ce-n { font-family: var(--font-mono); font-weight: 700; font-size: 22px; position: relative; }
.ce-dots svg { width: 24px; height: 24px; }

.ce-line { height: 60px; flex: none; width: 100%; display: flex; align-items: center; gap: 14px; margin-top: 4px; color: var(--text); text-align: left; }
.ce-line + .ce-line { border-top: 1px solid var(--ce-line); margin-top: 0; }
.ce-who { flex: 1; min-width: 0; display: flex; gap: 18px; align-items: center; font-size: 17px; font-weight: 600; overflow: hidden; }
.ce-who-p { display: inline-flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.ce-grp { font-size: 13px; font-weight: 500; color: var(--text-muted); flex: none; margin-right: -6px; white-space: nowrap; }
.ce-go { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 2px; flex: none; }
.ce-go svg { width: 18px; height: 18px; }
.ce-dash { font-family: var(--font-mono); color: var(--text-muted); font-weight: 600; width: 26px; text-align: center; flex: none; }
.ce-sm { --sm: 30px; position: relative; width: var(--sm); height: var(--sm); flex: none; display: inline-grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 15px; color: var(--text); }
.ce-sm svg { position: absolute; inset: 0; }
.ce-sm .ce-ln { fill: none; stroke: var(--text); stroke-width: 1.5; }
.ce-sm .ce-ln.draw { display: none; }
.ce-sm.s .ce-ln { stroke: var(--text-muted); }
.ce-sm.d { color: var(--double); } .ce-sm.d .ce-ln { stroke: var(--double); }
.ce-ro { height: 64px; border-top: 1px solid var(--ce-line); display: flex; align-items: center; gap: var(--space-3); }
.ce-ro:first-child { border-top: 0; }
.ce-ro-n { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ce-ro-n b { font-size: 17px; font-weight: 600; }
.ce-ro.them .ce-ro-n b { color: var(--text-muted); }
.ce-ro .ce-sm { --sm: 40px; font-size: 22px; }
.ce-ro .ce-dash { width: 40px; }
.ce-list { margin-top: 2px; }

.ce-flex { flex: 1; min-height: 8px; }
.ce-foot { flex: none; margin-bottom: var(--space-4); position: relative; z-index: 3; }
.ce-status { font-size: 13px; line-height: 18px; margin-bottom: var(--space-3); color: var(--text-muted); }
.ce-next { height: var(--button-primary); border-radius: var(--radius-lg); width: 100%; display: grid; place-items: center; font-size: 17px; font-weight: 600; background: var(--surface-1); color: var(--text-muted); }
.ce-next.go { background: var(--button); color: var(--on-button); }

.tabbar { position: absolute; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); height: 68px; border-radius: 34px; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow-dock); backdrop-filter: blur(22px) saturate(1.8); -webkit-backdrop-filter: blur(22px) saturate(1.8); z-index: 4; }
.tabbar span { display: grid; place-items: center; border-radius: 28px; color: var(--text-muted); }
.tabbar span.on { background: var(--surface-3); color: var(--text); }
html.light .tabbar span.on { background: var(--surface-2); }
.tabbar svg.i { width: 22px; height: 22px; }

/* overlays: sheets, Switch it up, Board */
.ov { position: absolute; inset: 0; z-index: 10; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: ce-fade-in .2s both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow: auto; background: var(--surface-1); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-sheet);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); animation: sheet-up .3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes sheet-up { from { transform: translateY(100%) } to { transform: none } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.sh-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin-bottom: 8px; }
.sh-head h2 { font-size: 17px; line-height: 22px; font-weight: 600; }
.grid18 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
.grid18 button { height: 52px; border-radius: var(--radius-md); background: var(--surface-2); display: grid; place-items: center; font: 700 15px var(--font-mono); }
.grid18 button.fut { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--text-muted); }
.grid18 button.cur { box-shadow: inset 0 0 0 2px var(--text); }
.grid18 button.view { background: var(--text); color: var(--bg); }
.more { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
.more .ce-pad { background: var(--surface-2); }
.more .ce-pad.sel { background: var(--text); }
.sh-row { width: 100%; height: 56px; display: flex; align-items: center; border-top: 1px solid var(--line); font-size: 17px; font-weight: 600; }
.full { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 72px) 24px calc(24px + env(safe-area-inset-bottom, 0px)); animation: ce-fade-in .2s both; }
.full .label { font: 600 12px/16px var(--font-mono); letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.full h1 { font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin: 12px 0 8px; }
.full p { color: var(--text-muted); font-size: 15px; line-height: 20px; margin-bottom: 6px; }
.btn { height: var(--button-primary); border-radius: var(--radius-xl); display: grid; place-items: center; font: 600 17px var(--font-sans); width: 100%; background: var(--button); color: var(--on-button); margin-top: auto; }
.btn.s { background: var(--surface-2); color: var(--text); margin-top: 10px; }

/* prototype controls (beside the phone on a laptop; ⋯ on a phone) */
.opt h3 { font: 600 12px/16px var(--font-mono); letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 6px; }
.opt h3:first-child { margin-top: 0; }
.opt .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-1); border-radius: var(--radius-md); padding: 4px; }
html.light .opt .seg { background: var(--surface-2); }
.ov .opt .seg { background: var(--surface-2); }
.opt .seg button { min-height: 40px; border-radius: 9px; color: var(--text-muted); font-weight: 600; font-size: 13px; line-height: 16px; text-align: center; padding: 2px 4px; }
.opt .seg button.on { background: var(--surface-3); color: var(--text); }
html.light .opt .seg button.on { background: var(--surface-1); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.opt .wrap { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
.opt p { font-size: 13px; line-height: 18px; color: var(--text-muted); margin-top: 6px; }
.ctl .opt > h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.ctl .opt > p:first-of-type { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="page">
  <div class="phone"><div class="ce" id="scr"></div><div id="ovl"></div></div>
  <aside class="ctl" id="ctl"></aside>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ICON = {
  left: '<path d="M15 18l-6-6 6-6"/>', right: '<path d="M9 18l6-6-6-6"/>',
  dots: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
  flag: '<path d="M6 21V4"/><path d="M6 4h11l-3 4 3 4H6"/>', rings: '<circle cx="8.5" cy="12" r="4.5"/><circle cx="15.5" cy="12" r="4.5"/>',
  bars: '<path d="M5 7h14M5 12h10M5 17h7"/>', grid: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

// ── the course ──────────────────────────────────────────────────────────────────────────────
const PARS = [4, 5, 3, 4, 4, 3, 4, 5, 4, 4, 4, 3, 5, 4, 4, 3, 4, 5];
const rnd = (n) => { const x = Math.sin(n * 9301.17 + 49.297) * 233280; return x - Math.floor(x); };
const YD = PARS.map((par, i) => {
  const h = i + 1, r = rnd(h * 7 + 1);
  const mid = par === 3 ? 141 + Math.round(r * 46) : par === 4 ? 128 + Math.round(r * 44) : 96 + Math.round(r * 30);
  return { front: mid - 6 - Math.round(rnd(h * 3) * 7), middle: mid, back: mid + 7 + Math.round(rnd(h * 5) * 6) };
});
YD[8] = { front: 94, middle: 103, back: 112 }; // hole 9 → 10 changes digit counts (98 → 142 style)
const STROKE = { S: new Set([2, 5, 8, 12, 15, 17]) }; // Sean gets a stroke on these holes

// ── score rules (reward.js + 033) ──────────────────────────────────────────────────────────
function reward(strokes, par, here = 0) {
  const net = strokes - here, d = net - par;
  const w = d <= -3 ? (strokes === 1 ? 'Ace' : 'Albatross') : d === -2 ? (strokes === 1 ? 'Ace' : 'Eagle') : d === -1 ? 'Birdie'
    : d === 0 ? 'Par' : d === 1 ? 'Bogey' : d === 2 ? 'Double' : d === 3 ? 'Triple' : d === 4 ? 'Quad' : `+${d}`;
  const kind = d <= -2 ? 'eagle' : d === -1 ? 'birdie' : d === 0 ? 'par' : d === 1 ? 'bogey' : 'double';
  return {
    word: here > 0 && net !== strokes ? `Net ${w.toLowerCase()}` : w, kind,
    tone: { eagle: 'big', birdie: 'lift', par: 'par', bogey: 'quiet', double: 'dbl' }[kind],
    stamp: d >= 2, ripples: d <= -2 ? 2 : d === -1 ? 1 : 0, burst: d <= -2, pulse: d === 0,
    holdMs: d <= -2 ? 3000 : d === -1 ? 2200 : 1600,
  };
}
const markKind = (s, par) => { const d = s - par; return d <= -2 ? 'cc' : d === -1 ? 'c' : d === 0 ? '' : d === 1 ? 's' : 'd'; };
function markPaths(s, par, size = 40) {
  const k = markKind(s, par), h = size / 2;
  const circ = (r) => ({ d: `M ${h} ${h - r} a ${r} ${r} 0 1 1 0 ${2 * r} a ${r} ${r} 0 1 1 0 ${-2 * r}`, len: 2 * Math.PI * r });
  const sq = (i) => { const a = i, b = size - i; return { d: `M ${a + 4} ${a} H ${b - 4} Q ${b} ${a} ${b} ${a + 4} V ${b - 4} Q ${b} ${b} ${b - 4} ${b} H ${a + 4} Q ${a} ${b} ${a} ${b - 4} V ${a + 4} Q ${a} ${a} ${a + 4} ${a}`, len: 4 * (b - a) }; };
  return k === 'c' ? [circ(h - 1)] : k === 'cc' ? [circ(h - 1), circ(h - 5.5)] : k === 's' ? [sq(1)] : k === 'd' ? [sq(1), sq(5.5)] : [];
}
const markSvg = (s, par, size, cls = 'ce-m') => {
  const ps = markPaths(s, par, size);
  if (!ps.length) return '';
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${ps.map((p, i) =>
    `<path class="ce-ln base" d="${p.d}"/><path class="ce-ln draw" d="${p.d}" style="--len:${p.len.toFixed(1)}${i ? ';animation-delay:.18s' : ''}"/>`).join('')}</svg>`;
};
const smallMark = (s, par, size = 30) => s == null ? '<span class="ce-dash">–</span>'
  : `<span class="ce-sm ${markKind(s, par)}" style="--sm:${size}px">${markSvg(s, par, size, '')}${s}</span>`;
const fmt = (x) => { const w = Math.floor(x + 1e-9), h = x - w > 1e-9; return (w ? String(w) : '') + (h ? '½' : '') || '0'; };
const standingText = (d) => d > 1e-9 ? `${fmt(d)} UP` : d < -1e-9 ? `${fmt(-d)} DN` : 'AS';
const pointsLine = (p) => p === 0 ? { text: 'No points', tone: 'muted' } : { text: `+${fmt(p)} ${p <= 1 ? 'point' : 'points'}`, tone: p >= 1.5 ? 'text' : 'muted' };

// ── games ──────────────────────────────────────────────────────────────────────────────────
const P = { A: 'Andrew', S: 'Sean', M: 'Sam', J: 'Jake', K: 'Mike', U: 'Justin', C: 'Chris', T: 'Tom' };
const setOf = (h) => (h <= 6 ? 0 : h <= 12 ? 1 : 2);
const names = (ids) => ids.map((id) => P[id]).join(' + ');
const GAMES = {
  carts: {
    label: 'Team cart', tee: ['A', 'S', 'M', 'J'], mine: () => ['A', 'S'], quiet: () => [['M', 'J']],
    match: (h) => { const s = setOf(h); return { us: ['A', 'S'], them: [['M', 'J'], ['K', 'U'], ['C', 'T']][s], from: s * 6 + 1, to: s * 6 + 6 }; },
  },
  '2v2': {
    label: '2v2', tee: ['A', 'S', 'M', 'J'], pairs: true,
    mine: (h) => ['A', ['S', 'M', 'J'][setOf(h)]], quiet: (h) => [['S', 'M', 'J'].filter((x) => x !== ['S', 'M', 'J'][setOf(h)])],
    match: (h) => { const s = setOf(h), p = ['S', 'M', 'J'][s]; return { us: ['A', p], them: ['S', 'M', 'J'].filter((x) => x !== p), from: s * 6 + 1, to: s * 6 + 6 }; },
  },
  six: {
    label: '6 players', tee: ['A', 'S'], mine: () => ['A', 'S'], quiet: () => [],
    match: (h) => { const s = setOf(h); return s === 0 ? null : { us: ['A', 'S'], them: [null, ['K', 'U'], ['M', 'J']][s], from: s * 6 + 1, to: s * 6 + 6 }; },
    sitOut: (h) => (setOf(h) === 0 ? 'Sitting out · back on 7 vs Mike + Justin' : null),
  },
  solo: { label: 'Scorecard', tee: ['A', 'S', 'M', 'J'], solo: true, mine: () => ['A'], quiet: () => [['S', 'M', 'J']], match: () => null },
};

// ── state ──────────────────────────────────────────────────────────────────────────────────
const S = {
  game: 'carts', gps: 'regular', turn: 'flip', motion: 'normal', theme: 'dark', final: false,
  cur: 4, view: 4, scores: {}, unlocked: {}, seenSwitch: {},
  reward: null, pts: null, nudge: null, sheet: null, full: null,

const G = () => GAMES[S.game];
const key = (h, id) => `${h}:${id}`;
function sim(id, h) { const r = rnd(h * 31 + id.charCodeAt(0) * 7); return PARS[h - 1] + (r < .12 ? -1 : r < .58 ? 0 : r < .88 ? 1 : 2); }
function score(id, h) {
  const v = S.scores[key(h, id)];

}
function seed() {
  S.scores = {}; S.unlocked = {}; S.seenSwitch = {}; S.final = false;
  for (let h = 1; h < S.cur; h++) for (const id of G().tee) S.scores[key(h, id)] = sim(id, h);
}
const strokesOn = (id, h) => (STROKE[id]?.has(h) ? 1 : 0);
function holePts(m, h) {
  if ([...m.us, ...m.them].some((id) => score(id, h) == null)) return null;
  const a = m.us.map((id) => score(id, h) - strokesOn(id, h)), b = m.them.map((id) => score(id, h) - strokesOn(id, h));

}
function standing(m, upto) {

}
const toPar = (id) => { let t = 0; for (let h = 1; h <= 18; h++) { const s = score(id, h); if (s != null) t += s - PARS[h - 1]; } return t; };
const fmtPar = (t) => (t === 0 ? 'E' : t > 0 ? `+${t}` : `−${-t}`);
const live = () => !S.final && S.view >= S.cur - 1 && S.view <= S.cur || (S.unlocked[S.view] && S.view < S.cur);
const ahead = () => S.view > S.cur;
const blanksOn = (h) => G().tee.filter((id) => score(id, h) == null);

// ── render ─────────────────────────────────────────────────────────────────────────────────
function greenSvg(h, size) {
  const [w, ht] = size === 'compact' ? [44, 46] : [62, 64];
  const cx = w / 2, cy = ht / 2, rx = w / 2 - 6 - rnd(h) * 4, ry = ht / 2 - 3 - rnd(h + 2) * 3, tilt = (rnd(h + 5) - .5) * .7;
  const pts = Array.from({ length: 8 }, (_, k) => {
    const a = (k / 8) * Math.PI * 2, j = 1 + (rnd(h * 13 + k) - .5) * .22;
    const x = Math.cos(a) * rx * j, y = Math.sin(a) * ry * j;
    return [cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt)];
  });
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let k = 0; k < 8; k++) {
    const p0 = pts[(k + 7) % 8], p1 = pts[k], p2 = pts[(k + 1) % 8], p3 = pts[(k + 2) % 8];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const ys = pts.map((p) => p[1]), top = Math.min(...ys) - 2, bot = Math.max(...ys) + 2, third = (bot - top) / 3, id = `gc${h}${size[0]}`;
  const band = (y0, a) => `<rect x="0" y="${y0.toFixed(1)}" width="${w}" height="${third.toFixed(1)}" fill="currentColor" fill-opacity="${a}" clip-path="url(#${id})"/>`;
  const gap = (y) => `<line x1="0" x2="${w}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--surface-1)" stroke-width="2"/>`;
  const dot = [cx + (rnd(h + 9) - .5) * rx * .8, cy + (rnd(h + 11) - .5) * ry * .8];
  return `<svg class="green-svg" viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}" aria-hidden="true"><defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs>
    ${band(top, .30)}${band(top + third, .19)}${band(top + 2 * third, .10)}${gap(top + third)}${gap(top + 2 * third)}
    <path d="${d}" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/><circle cx="${dot[0].toFixed(1)}" cy="${dot[1].toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}
const greenOn = () => S.gps !== 'off' && !S.final && live() && !ahead();
function greenCard(h) {
  if (!greenOn()) return '';

    <div class="green-pic">${greenSvg(h, S.gps)}</div>

}
function padRow(id, h, editable) {

function quietRow(ids, h, m, i) {

  const who = ids.map((id) => `<span class="ce-who-p"><span>${P[id]}</span>${smallMark(score(id, h), par)}</span>`).join('');

// keep motion where it was across redraws (the app's data-t0 + ui.syncMotion pattern), and slow-motion
const RATE = () => (S.motion === 'slow' ? 0.25 : 1);
function sync() {
  const now = performance.now();
  $$('#scr [data-t0]').forEach((el) => {
    const t = now - Number(el.dataset.t0);
    el.getAnimations({ subtree: true }).forEach((a) => { if (t > 40) a.currentTime = t * RATE(); });
  });
  if (RATE() !== 1) document.getAnimations().forEach((a) => { a.playbackRate = RATE(); });

// ── Part 2: the turn ───────────────────────────────────────────────────────────────────────
let turning = null;
function rel(el) { const b = $('#scr').getBoundingClientRect(), r = el.getBoundingClientRect(); return { top: r.top - b.top, left: r.left - b.left, width: r.width, height: r.height }; }

  const clean = (el) => { const c = el.cloneNode(true); $$('.anim', c).forEach((x) => x.classList.remove('anim')); c.removeAttribute('data-act'); return c; };
  return {
    hole: S.view, par: PARS[S.view - 1], hp: rel($('#scr .ce-hp')).left,
    green: g ? { rect: rel(g), clone: clean(g), pic: $('.green-pic', g).innerHTML, nums: $$('.gn b', g).map((b) => b.textContent) } : null,

// a rolling number: forward = old above new, rolls up; back = new above old, rolls down

  el.innerHTML = `<span class="t-roll" style="--t-d:${delay}ms"><span class="t-sz">${to}</span><span class="t-col">${dir === 'fwd' ? o + n : n + o}</span></span>`;

  const len = Math.max(from.length, to.length), F = from.padStart(len, ' '), T = to.padStart(len, ' ');

  for (let i = 0; i < len; i++) {
    if (F[i] === T[i]) { html += T[i] === ' ' ? '' : T[i]; continue; }
    const o = `<span class="t-o">${F[i]}</span>`, n = `<span class="t-n">${T[i]}</span>`;
    html += `<span class="t-roll" style="--t-d:${delay + 30 * k++}ms"><span class="t-sz">${T[i]}</span><span class="t-col">${dir === 'fwd' ? o + n : n + o}</span></span>`;

}

  layer.className = 'ce-turn-layer';
  scr.dataset.turn = S.motion === 'reduced' ? 'fade' : S.turn;
  scr.dataset.dir = dir;
  scr.appendChild(layer);
  const place = (clone, r, ...cls) => { Object.assign(clone.style, { position: 'absolute', margin: '0', top: `${r.top}px`, left: `${r.left}px`, width: `${r.width}px`, height: `${r.height}px` }); clone.classList.add(...cls); layer.appendChild(clone); return clone; };
  // hole number + par roll; "Par" follows the number's width
  const h = S.view, par = PARS[h - 1];
  roll($('.ce-hn .t-v', scr), old.hole, h, dir, 0);
  if (old.par !== par) roll($('.ce-hp .t-v', scr), old.par, par, dir, 40);
  const hp = $('.ce-hp', scr), dx = old.hp - rel(hp).left;
  if (Math.abs(dx) > .5) { hp.style.setProperty('--t-dx', `${dx}px`); hp.classList.add('t-movex'); }
  // yardage card: the frame stays; picture swaps, digits roll. Comes or goes: blur swap + the body below moves.
  const g = $('.green-card', scr);
  if (g && old.green) {
    const pic = $('.green-pic', g), was = document.createElement('div');
    was.className = 't-swap-out'; was.innerHTML = old.green.pic;
    $('svg', pic).classList.add('t-swap-in'); pic.appendChild(was);
    $$('.gn b', g).forEach((b, i) => odometer(b, old.green.nums[i], b.textContent, dir, 60 + 20 * i));
  } else if (old.green) place(old.green.clone, old.green.rect, 't-swap-out');
  else if (g) g.classList.add('t-swap-in');
  const body = $('.ce-body', scr), dy = old.body - rel(body).top;
  if (Math.abs(dy) > .5) { body.style.setProperty('--t-dy', `${dy}px`); body.classList.add('t-move'); }
  // match line: blur swap only when it says something new
  const m = $('.ce-match', scr);
  if (m.textContent !== old.match.text) { place(old.match.clone, old.match.rect, 't-swap-out'); m.classList.add('t-swap-in'); }
  // the score card + quiet rows: out at their old place, in at the new one; then the pads land
  old.panels.forEach((p, i) => place(p.clone, p.rect, 't-out').style.setProperty('--t-lag', i));
  $$('.ce-body .t-panel', scr).forEach((el, i) => {
    el.classList.add('t-in'); el.style.setProperty('--t-lag', i);
    $$('.ce-row', el).forEach((row, r) => $$('.ce-pad', row).forEach((pad, k) => { pad.classList.add('t-land'); pad.style.setProperty('--t-r', r); pad.style.setProperty('--t-i', k); }));
  });
  const anims = scr.getAnimations({ subtree: true }).filter((a) => !a.effect?.target?.closest?.('[data-t0]'));
  if (RATE() !== 1) anims.forEach((a) => { a.playbackRate = RATE(); });
  const t = { anims };
  turning = t;
  Promise.all(anims.map((a) => a.finished)).then(() => { if (turning === t) endTurn(); }).catch(() => {});
}
function endTurn() { turning = null; render(); }
function finishMotion() { if (turning) { turning.anims.forEach((a) => { try { a.finish(); } catch {} }); endTurn(); } }

function go(to, { switchCard = null } = {}) {
  finishMotion();
  if (to < 1 || to > 18 || to === S.view) return;
  const dir = to > S.view ? 'fwd' : 'back';
  const old = S.final ? null : capture(); // a finalized round never turns
  S.view = to; S.reward = null; S.pts = null; S.nudge = null; S.sheet = null;
  if (switchCard) { S.full = switchCard; S.pending = old && { old, dir }; render(); return; }
  render();
  if (old) playTurn(old, dir);
}
function switchFor(h) {
  const g = G(); if (g.solo || (h !== 7 && h !== 13) || S.seenSwitch[`${S.game}${h}`]) return null;
  S.seenSwitch[`${S.game}${h}`] = true;
  const m = g.match(h), s = setOf(h);
  if (g.pairs) return { kind: 'switch', h, big: `With ${P[m.us[1]]}`, sub: `vs ${names(m.them)} · holes ${m.from}–${m.to}`, sub2: 'Same foursome, new partner. Each set is its own match.' };
  return { kind: 'switch', h, big: `vs ${names(m.them)}`, sub: `Holes ${m.from}–${m.to} · with Sean`, sub2: s && !m.them.every((id) => g.tee.includes(id)) ? 'Nobody moves. The app compares your scores with the other group.' : 'Your group plays this one together.' };
}

// ── Part 1: picks ──────────────────────────────────────────────────────────────────────────
function pick(id, v) {
  finishMotion();
  const h = S.view, par = PARS[h - 1], g = G(), m = g.match(h);
  const before = m ? standing(m, h) : null, wasComplete = blanksOn(h).length === 0;
  S.scores[key(h, id)] = v;
  S.reward = { id, h, t0: performance.now(), r: reward(v, par, strokesOn(id, h)) };
  S.pts = null; S.nudge = null;
  if (m && !wasComplete && blanksOn(h).length === 0 && m.them.every((x) => g.tee.includes(x))) {
    const after = standing(m, h), p = holePts(m, h);
    S.pts = { h, t0: S.reward.t0, from: standingText(before), to: standingText(after), dn: after < before, line: pointsLine(p) };
  }
  render();
}
function fill(i) {
  finishMotion();
  const h = S.view, ids = G().quiet(h)[i - 1] || [];
  const g = G(), m = g.match(h), before = m ? standing(m, h) : null, wasComplete = blanksOn(h).length === 0;
  ids.forEach((id) => { if (score(id, h) == null) S.scores[key(h, id)] = sim(id, h); });
  S.reward = null; S.nudge = null; S.pts = null;
  if (m && !wasComplete && blanksOn(h).length === 0 && m.them.every((x) => g.tee.includes(x))) {
    const after = standing(m, h);
    S.pts = { h, t0: performance.now(), from: standingText(before), to: standingText(after), dn: after < before, line: pointsLine(holePts(m, h)) };
  }
  render();
}
function demo(kind) {
  const h = S.view, par = PARS[h - 1];
  if (!live()) return;
  if (kind === 'netpar') { // Sean, on a hole where he gets a stroke: gross bogey (square) but a NET par (pop + pulse)
    const sh = [...STROKE.S].find((x) => x >= S.view) || 17;
    if (sh !== S.view) { S.cur = Math.max(S.cur, sh); S.view = sh; }
    if (!G().mine(S.view).includes('S')) S.game = 'carts';
    S.sheet = null; return pick('S', PARS[S.view - 1] + 1);
  }
  S.sheet = null;
  pick('A', par + { eagle: -2, birdie: -1, par: 0, bogey: 1, double: 2 }[kind]);
}

// ── taps ───────────────────────────────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const opt = e.target.closest('[data-opt]');
  if (opt) {
    const k = opt.dataset.opt; let v = opt.dataset.v;
    if (k === 'final') v = v === 'true';
    finishMotion(); S[k] = v;
    if (k === 'game') { S.cur = 4; S.view = 4; seed(); }
    if (k === 'theme') document.documentElement.classList.toggle('light', v === 'light');
    if (k === 'motion') document.documentElement.classList.toggle('rm', v === 'reduced');
    S.reward = null; S.pts = null;
    return render();
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, v = Number(el.dataset.v), id = el.dataset.id;
  if (a === 'pick') { if (turning) return finishMotion(); return pick(id, v); }
  if (a === 'more') { finishMotion(); S.sheet = { kind: 'more', id }; return renderOverlay(); }
  if (a === 'more-pick') { S.sheet = null; return pick(id, v); }
  if (a === 'clear') { delete S.scores[key(S.view, id)]; S.sheet = null; S.reward = null; return render(); }
  if (a === 'close') { if (S.full?.kind === 'board') S.full = null; S.sheet = null; return renderOverlay(); }
  if (a === 'menu') { finishMotion(); S.sheet = { kind: 'menu' }; return renderOverlay(); }
  if (a === 'grid') { finishMotion(); S.sheet = { kind: 'grid' }; return renderOverlay(); }
  if (a === 'jump') return go(v);
  if (a === 'prev') return go(S.view - 1);
  if (a === 'next1') return go(S.view + 1);
  if (a === 'back-cur') return go(S.cur);
  if (a === 'unlock') { S.unlocked[S.view] = true; return render(); }
  if (a === 'fill') { if (turning) return finishMotion(); return fill(Number(el.dataset.i)); }
  if (a === 'fillall') { G().tee.forEach((x) => { if (score(x, S.view) == null) S.scores[key(S.view, x)] = sim(x, S.view); }); S.sheet = null; S.reward = null; return render(); }
  if (a === 'demo') return demo(el.dataset.v);
  if (a === 'restart') { finishMotion(); S.cur = 4; S.view = 4; S.full = null; S.sheet = null; seed(); return render(); }
  if (a === 'board') { S.full = { kind: 'board' }; return renderOverlay(); }
  if (a === 'switch-go') { const p = S.pending; S.full = null; S.pending = null; renderOverlay(); if (p) playTurn(p.old, p.dir); return; }
  if (a === 'next') {
    if (turning) return finishMotion();
    const h = S.view, blanks = blanksOn(h);
    if (blanks.length) { S.nudge = { h, t0: performance.now() }; S.reward = null; S.pts = null; return render(); }
    if (h === 18) { S.full = { kind: 'board' }; return renderOverlay(); } // the last hole goes to the Board: no turn
    if (h === S.cur) S.cur = h + 1;
    return go(h + 1, { switchCard: switchFor(h + 1) });
  }
});

// test hooks for shoot.mjs: set a scene, then freeze every running animation at t ms
window.__033 = {
  S, render, go, pick, fill, demo, seed,
  set(o) {
    finishMotion();
    Object.assign(S, { reward: null, pts: null, nudge: null, sheet: null, full: null }, o);
    document.documentElement.classList.toggle('light', S.theme === 'light');
    document.documentElement.classList.toggle('rm', S.motion === 'reduced');
    if (o.seed !== false) seed();
    if (o.scores) Object.assign(S.scores, o.scores);
    if (o.seenSwitch) S.seenSwitch = { ...o.seenSwitch };
    render();
  },
  freeze(t) { document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t; }); },
  next() { $('#scr .ce-next').click(); },
};
seed();
render();
document.fonts?.ready?.then(() => { document.body.dataset.ready = '1'; });
</script>
