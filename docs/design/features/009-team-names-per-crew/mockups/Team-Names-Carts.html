<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393"><title>Team-Names-Carts</title>

<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--org:#FF9A4A;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--err:#FF5A5A;--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10);--scrim:rgba(0,0,0,0.6);--shC:none;--shS:0 -8px 32px rgba(0,0,0,0.5)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#DDE0E5;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--org:#B85A00;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--err:#C8282D;--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10);--scrim:rgba(11,13,16,0.35);--shC:0 1px 2px rgba(11,13,16,0.06),0 4px 12px rgba(11,13,16,0.05);--shS:0 -8px 32px rgba(11,13,16,0.16)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
</style>
<style>body{margin:0}</style></head><body>
<div class="t dark" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 0; height: 52px">
<button style="height: 48px; display: flex; align-items: center; gap: 2px; color: var(--tx2); border: 0; background: transparent; font-size: 16px; padding: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Game</button>

<div style="padding: 2px 20px 0"><div class="lbl">STEP 4 · CART GAME SETUP</div><div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-top: 2px">8 players, 4 carts</div></div><div style="margin: 16px 20px 8px; font-size: 13px; color: var(--tx2)">Pairs that have played together before get their usual name back. Tap a name to change it.</div>

ow: hidden; text-overflow: ellipsis">Shank Redemption</span><span class="mono" style="display: block; font-size: 11px; color: var(--tx2); margin-top: 1px">THEIR USUAL</span></span><span style="color: var(--tx2)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></button><div style="height: 40px; margin-top: 6px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 600">Mike T.</div><div style="height: 40px; margin-top: 6px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 600">Tyler</div></div><div style="border-radius: 18px; background: rgba(255,111,181,0.12); border: 1.5px solid var(--pink); padding: 12px 10px 10px"><div class="mono" style="font-size: 11px; letter-spacing: 1px; font-weight: 700; color: var(--pink)">CART C</div><button style="width: 100%; min-height: 48px; margin-top: 2px; border: 0; background: transparent; padding: 0; text-align: left; display: flex; align-items: center; gap: 4px"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; color: var(--tx2); font-weight: 600; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Pick a name</span><span class="mono" style="display: block; font-size: 11px; color: var(--tx2); margin-top: 1px">NEW PAIR</span></span><span style="color: var(--tx2)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></button><div style="height: 40px; margin-top: 6px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 600">Sam K.</div><div style="height: 40px; margin-top: 6px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 600">Jake</div></div><div style="border-radius: 18px; background: rgba(177,140,255,0.12); border: 1.5px solid var(--vio); padding: 12px 10px 10px"><div class="mono" style="font-size: 11px; letter-spacing: 1px; font-weight: 700; color: var(--vio)">CART D</div><button style="width: 100%; min-height: 48px; margin-top: 2px; border: 0; background: transparent; padding: 0; text-align: left; display: flex; align-items: center; gap: 4px"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Fore Play</span><span class="mono" style="display: block; font-size: 11px; color: var(--tx2); margin-top: 1px">THEIR USUAL</span></span><span style="color: var(--tx2)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></button><div style="height: 40px; margin-top: 6px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 600">Chris</div><div style="height: 40px; margin-top: 6px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 600">Christopher</div></div></div><button style="margin: auto 16px 16px; height: 60px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 18px; font-weight: 700; flex: none">Start round · 8 players</button>
</div>
