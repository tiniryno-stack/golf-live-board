<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Enter · reward prototype</title>
<link rel="stylesheet" href="../../../design-system/tokens.css">
<link rel="stylesheet" href="greencard.css">
<style>
@font-face{font-family:Geist;src:url(../../../../../node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url(../../../../../node_modules/geist/dist/fonts/geist-mono/GeistMono-Variable.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.mono{font-family:var(--font-mono)}
.phone{width:393px;height:659px;position:relative;overflow:hidden;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ib{width:48px;height:48px;display:grid;place-items:center}
.green-card{margin:6px 0 0!important}
.green-nums .label{font-family:var(--font-mono);font-size:12px;font-weight:600}
.hdr{padding:6px 4px 0 16px;display:flex;align-items:center;height:54px}
.hdr h1{margin:0;flex:1;font-size:24px;line-height:28px;font-weight:700;letter-spacing:-.5px}
.hdr h1 span{font-size:17px;font-weight:500;color:var(--text-muted);margin-left:8px}
.body{padding:0 16px}
.match{height:36px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:500;color:var(--text-muted);position:relative}
.match .up{color:var(--cart-you-text);font-weight:700;font-family:var(--font-mono);display:inline-flex;overflow:hidden;height:20px}
.match .up .roll{display:flex;flex-direction:column;line-height:20px}
.match .end{display:flex;align-items:center;gap:12px}
.match .won{color:var(--cart-you-text);font-size:15px;font-weight:600;opacity:0}
.row{padding:8px 0 4px;border-top:1px solid rgba(255,255,255,.05)}
.row .nm{height:24px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.row .nm b{font-size:17px;font-weight:600}
.stk{font-size:13px;font-weight:500;color:var(--text-muted)}
.word{font-size:15px;font-weight:700;opacity:0;color:var(--text)}
.word.dbl{color:var(--double)}
.word.quiet{color:var(--text-muted)}
.word.big{font-size:17px}
.word.big.anim{animation-duration:3s!important}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 56px;gap:6px}
.pad{height:64px;border-radius:var(--radius-lg);display:grid;place-items:center;position:relative;--pb:var(--bg);color:var(--text)}
.pad.sel{background:var(--text);color:var(--bg);--pb:var(--text)}
.pad svg.m{position:absolute;inset:0;margin:auto;overflow:visible}
.pad .n{font-family:var(--font-mono);font-weight:700;font-size:22px;position:relative}
.pad .ln{fill:none;stroke:var(--text-muted);stroke-width:1.5}
.pad.sel .ln{stroke:var(--bg);stroke-width:1.75}
.pad .ln.base{opacity:1}
.pad.sel.anim .ln.base{opacity:.3;animation:none!important;stroke-dasharray:none}
.pad.sel.dbl .ln{stroke:#b42318;stroke-width:2}
.pad.sel.dbl .n{color:#b42318}
.ripple{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2px var(--text);opacity:0;pointer-events:none}
/* collapsed summary (4B) */
.sum{height:64px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:16px;width:100%;text-align:left;overflow:hidden}
.sum .p{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:600}
.sum .ok{margin-left:auto;color:var(--text-muted);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.sm{position:relative;width:30px;height:30px;display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:15px}
.sm svg{position:absolute;inset:0}
.sm .ln{fill:none;stroke:var(--text);stroke-width:1.5}
.sm.s .ln{stroke:var(--text-muted)}
.sm.d{color:var(--double)} .sm.d .ln{stroke:var(--double)}
.line{height:60px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.line .who{flex:1;display:flex;gap:18px;align-items:center;font-size:17px;font-weight:600}
.line .who>span{display:inline-flex;align-items:center;gap:8px}
.line .go{font-size:15px;font-weight:600;display:flex;align-items:center;gap:2px}
.dash{font-family:var(--font-mono);color:var(--text-muted);font-weight:600;width:26px;text-align:center}
.dock{position:absolute;left:16px;right:16px;bottom:104px}
.next{height:var(--button-primary);border-radius:var(--radius-lg);width:100%;font-size:17px;font-weight:600;position:relative;overflow:hidden;background:var(--surface-1);color:var(--text-muted)}
.next .fill{position:absolute;inset:0;background:var(--button);transform-origin:left;transform:scaleX(0)}
.next .t{position:relative}
.next.go .fill{transform:scaleX(1)}
.next.go{color:var(--on-button)}
.tabs{position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:var(--radius-2xl);background:var(--glass);box-shadow:var(--shadow-dock),inset 0 0 0 1px var(--glass-line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tabs div{display:grid;place-items:center;border-radius:20px;color:var(--text-muted)}
.tabs div.cur{background:var(--surface-3);color:var(--text)}
svg{display:block}
.line .who .grp{font-size:13px;font-weight:500;color:var(--text-muted);margin-right:-6px}
html.light .row{border-top-color:rgba(11,13,16,.08)}
html.light .d1 .mine .row{border-top-color:rgba(11,13,16,.06)}
html.light .d1 .mine{box-shadow:var(--shadow-card)}
html.light .pad.sel.dbl .ln{stroke:#ff6b6b}
html.light .pad.sel.dbl .n{color:#ff6b6b}
/* depth variants */
.d1 .mine,.d3 .mine,.d4 .mine{background:var(--surface-1);border-radius:var(--radius-xl);padding:2px 16px 6px;margin:2px 0 0;--pb:var(--surface-1)}
.d1 .mine .pads{gap:6px}
.d1 .mine .row:first-child,.d3 .mine .row:first-child,.d4 .mine .row:first-child{border-top:0}
.d1 .mine .row,.d3 .mine .row,.d4 .mine .row{border-top-color:rgba(255,255,255,.06)}
.d1 .mine .pad,.d3 .mine .pad,.d4 .mine .pad{--pb:var(--surface-1)}
.d1 .mine .pad.sel,.d3 .mine .pad.sel,.d4 .mine .pad.sel{--pb:var(--text)}
.d3 .mine{background:var(--tint-you);box-shadow:inset 0 0 0 1px rgba(61,220,132,.18)}
.d1.rail .mine::before,.d3.rail .mine::before,.d4.rail .mine::before{display:none}
.d1 .mine+.line,.d3 .mine+.line,.d4 .mine+.line{border-top:0;margin-top:4px}
.d2 .pad:not(.sel),.d4 .mine .pad:not(.sel){background:var(--surface-1);--pb:var(--surface-1)}
.d4 .mine .pad:not(.sel){background:var(--surface-2);--pb:var(--surface-2)}

/* team signal variants */
.kick{height:22px;display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:1px}
.kick.you{color:var(--cart-you-text)}
.kick.you i{width:6px;height:6px;border-radius:3px;background:var(--cart-you)}
.vsbar{padding:8px 0 10px}
.vsbar .top{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text-muted);height:20px}
.vsbar .top .us{color:var(--cart-you-text)}
.vsbar .top .sc{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--cart-you-text);display:flex;gap:12px;align-items:center}
.vsbar .bar{margin-top:6px;height:4px;border-radius:2px;background:var(--surface-2);display:flex;gap:2px;overflow:hidden}
.vsbar .bar b{display:block;background:var(--cart-you);border-radius:2px}
.vsbar .bar s{display:block;background:var(--text-muted);opacity:.45;border-radius:2px;flex:1}
.mine{position:relative}
.rail .mine::before{content:'';position:absolute;left:-10px;top:12px;bottom:8px;width:3px;border-radius:2px;background:var(--cart-you)}
.match .us{color:var(--text);font-weight:600}
.match .vs{color:var(--text-muted)}
.match .swap{display:grid}
.match .swap>*{grid-area:1/1;text-align:left}
@keyframes vsout{0%{opacity:1}12%{opacity:0}85%{opacity:0}100%{opacity:1}}
.match .vs.anim{animation:vsout 2.6s .45s ease-out both}

/* ── motion (all 160–450ms, ease-out; off for reduced motion) ── */
@keyframes bump{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes word{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@keyframes ripple{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-20px)}}
@keyframes wonin{0%{opacity:0;transform:translateX(8px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@keyframes fold{from{max-height:var(--h0);opacity:1}to{max-height:0;opacity:0;padding:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{max-height:0}to{max-height:64px}}
@keyframes ink{from{color:var(--text-muted)}to{color:var(--on-button)}}
.pad.sel.anim{animation:bump .22s cubic-bezier(.2,.8,.2,1)}
.pad .ln.draw{opacity:0}
.pad.sel .ln.draw{opacity:1}
.pad.sel.anim .ln.draw{stroke-dasharray:var(--len);animation:draw .32s .06s cubic-bezier(.3,.7,.2,1) both}
@keyframes stamp{0%{transform:scale(1.45) rotate(-4deg);opacity:.35}60%{transform:scale(.95) rotate(1deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes thud{0%,100%{transform:none}40%{transform:translateY(2px) scale(.98)}}
.pad.sel.anim.dbl.stamp{animation:thud .22s .14s ease-out}
.pad.sel.anim.dbl:not(.stamp) .ln.draw{animation:draw .32s .06s cubic-bezier(.3,.7,.2,1) both;stroke-dasharray:var(--len)}
.pad.sel.anim.dbl.stamp svg.m{animation:stamp .16s cubic-bezier(.2,.8,.2,1) both}
.pad.sel.anim.dbl .ln.draw{animation:none;stroke-dasharray:none}
.word.dbl.anim{animation:word 1.6s ease-out both,tilt .3s .05s cubic-bezier(.2,.8,.2,1) both}
@keyframes tilt{0%{transform:rotate(-4deg) translateY(4px)}100%{transform:none}}
.word.anim{animation:word 1.6s ease-out both}
.ripple.anim{animation:ripple .45s .1s ease-out both}
.ripple.anim.r2{animation-delay:.25s}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
.next .sh{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.0) 10%,rgba(10,11,13,.10) 50%,transparent 90%);transform:translateX(-120%)}
.next.go.anim{animation:bump .22s .05s cubic-bezier(.2,.8,.2,1)}
.match .up.anim .roll{animation:roll .3s .2s cubic-bezier(.3,.7,.2,1) both}
.match .won.anim{animation:wonin 2.4s .5s ease-out both}
.rowwrap.folding{overflow:hidden;max-height:var(--h0);animation:fold .32s .5s cubic-bezier(.4,0,.2,1) both}
.sum.anim{animation:grow .32s .5s cubic-bezier(.4,0,.2,1) both,rise .28s .7s cubic-bezier(.2,.8,.2,1) both}
.sum.anim .sm .ln{stroke-dasharray:var(--len);animation:draw .3s .85s cubic-bezier(.3,.7,.2,1) both}
@keyframes fadeonly{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.word.anim{animation:fadeonly 1.6s linear both!important}}
</style></head>
