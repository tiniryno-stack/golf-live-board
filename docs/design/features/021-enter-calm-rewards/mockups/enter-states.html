<style>.green-card{margin:6px 0 0!important}.green-nums .label{font-family:var(--font-mono);font-size:12px;font-weight:600}</style>
<style>
@font-face{font-family:Geist;src:url(../../../../../node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url(../../../../../node_modules/geist/dist/fonts/geist-mono/GeistMono-Variable.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.phone{width:393px;height:659px;position:relative;overflow:hidden;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:var(--radius-md)}
.muted{color:var(--text-muted)}
.lbl{font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}
/* header */
.hdr{padding:6px 4px 0 16px;display:flex;align-items:center;height:54px}
.hdr h1{margin:0;flex:1;font-size:24px;line-height:28px;font-weight:700;letter-spacing:-.5px}
.hdr h1 span{font-size:17px;font-weight:500;letter-spacing:0;color:var(--text-muted);margin-left:8px}
.sub{padding:0 16px;height:28px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.sub .t{text-align:center;font-size:15px;color:var(--text-muted);font-weight:500}
.sub .ib{color:var(--text-muted)}
.body{padding:8px 16px 0}
/* yardage hero: the only surface */
.yard{height:88px;border-radius:var(--radius-xl);background:var(--surface-1);display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 16px}
.yard .mid{text-align:center}
.yard .mid b{display:block;font-family:var(--font-mono);font-size:64px;line-height:64px;font-weight:700;letter-spacing:-2px}
.yard .side{display:flex;flex-direction:column;gap:10px;text-align:right;font-family:var(--font-mono);font-size:17px;font-weight:600}
.yard .side span{display:flex;justify-content:flex-end;gap:6px;align-items:baseline}
.yard .side i{font-style:normal;font-size:12px;letter-spacing:1px;color:var(--text-muted);font-weight:600}
.yard{grid-template-columns:60px 1fr 92px!important;column-gap:8px}
.yard.off{grid-template-columns:1fr auto}
.yard.off .mid{text-align:left}
.yard.off .mid b{font-size:32px;line-height:36px;letter-spacing:-1px}
.pill{height:44px;padding:0 16px;border-radius:var(--radius-pill);background:var(--surface-2);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
/* match line */
.match{height:36px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:500;color:var(--text-muted)}
.match b{color:var(--cart-you-text);font-weight:700;font-family:var(--font-mono);font-size:15px}
/* player rows: flat, hairlines */
.row{padding:8px 0 4px;border-top:1px solid var(--line)}
.row .nm{height:24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.row .nm b{font-size:17px;font-weight:600}
.stk{font-style:normal;font-size:13px;font-weight:500;color:var(--text-muted);margin-left:8px}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 56px;gap:6px}
.pad{height:64px;border-radius:var(--radius-lg);background:none;display:grid;place-items:center;--pb:var(--bg)}
.pad.sel{background:var(--text);color:var(--bg);--pb:var(--text)}
.pad.more{color:var(--text-muted)}
.mk{flex-shrink:0;font-family:var(--font-mono);font-weight:700;font-size:22px;width:38px;height:38px;display:grid;place-items:center}
.mk.c{border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor}
.mk.cc{border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor,inset 0 0 0 4px var(--pb),inset 0 0 0 5.5px currentColor}
.mk.s{border-radius:4px;box-shadow:inset 0 0 0 1.5px currentColor}
.mk.d{border-radius:4px;box-shadow:inset 0 0 0 1.5px currentColor,inset 0 0 0 4px var(--pb),inset 0 0 0 5.5px currentColor}
.pad:not(.sel) .mk.s,.pad:not(.sel) .mk.d{color:var(--text)}
.pad:not(.sel) .mk.c{box-shadow:inset 0 0 0 1.5px var(--text-muted)}
.pad:not(.sel) .mk.cc{box-shadow:inset 0 0 0 1.5px var(--text-muted),inset 0 0 0 4px var(--pb),inset 0 0 0 5.5px var(--text-muted)}
.pad:not(.sel) .mk.s{box-shadow:inset 0 0 0 1.5px var(--text-muted)}
.pad:not(.sel) .mk.d{box-shadow:inset 0 0 0 1.5px var(--text-muted),inset 0 0 0 4px var(--pb),inset 0 0 0 5.5px var(--text-muted)}
.sel .mk.d,.mini .mk.d{color:var(--double)}
.pad.sel .mk.d,.cell.sel .mk.d{color:#b42318!important;box-shadow:inset 0 0 0 2px #b42318,inset 0 0 0 4.5px var(--pb),inset 0 0 0 6.5px #b42318!important}
.mk.sm{width:26px;height:26px;font-size:15px}
.mk.sm.cc,.mk.sm.d{box-shadow:inset 0 0 0 1.5px currentColor,inset 0 0 0 3px var(--pb),inset 0 0 0 4.5px currentColor}
/* compact rows */
.line{height:64px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;width:100%;text-align:left;--pb:var(--bg)}
.line .who{flex:1;display:flex;gap:18px;align-items:center;font-size:17px;font-weight:600}
.line.ro .who{gap:0}
.line .who>span{display:inline-flex;align-items:center;gap:8px}
.line.them .who{color:var(--text)}
.line.them .dash{color:var(--text)}
.line.them .go{color:var(--text);font-weight:600}
.line .go{color:var(--text-muted);font-size:15px;font-weight:500;display:flex;align-items:center;gap:2px}
.dash{font-family:var(--font-mono);color:var(--text-muted);font-weight:600;width:26px;text-align:center}
.mini .mk{color:var(--text)}
/* bottom */
.dockgrp{position:absolute;left:16px;right:16px;bottom:104px;display:flex;flex-direction:column;gap:8px}
.warn{height:36px;color:var(--warn);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.next{height:var(--button-primary);border-radius:var(--radius-lg);width:100%;font-size:17px;font-weight:600}
.next.off{background:var(--surface-1);color:var(--text-muted)}
.next.on{background:var(--button);color:var(--on-button)}
.tabs{position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:var(--radius-2xl);background:var(--glass);box-shadow:var(--shadow-dock),inset 0 0 0 1px var(--glass-line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tabs div{display:grid;place-items:center;border-radius:20px;color:var(--text-muted)}
.tabs div.on{background:var(--surface-3);color:var(--text)}
/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet .pad{--pb:var(--surface-1)}
.sheet .row{border-color:var(--surface-3)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-1);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:10px 16px 20px;--pb:var(--surface-2)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:24px;line-height:28px;font-weight:700;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 56px;gap:6px}
.cell.sel{background:var(--text);--pb:var(--text);color:var(--bg)}
.cell.sel .mk.s{box-shadow:inset 0 0 0 1.5px var(--bg)}
.cell.sel .mk{color:var(--bg)!important}
.cell{height:64px;border-radius:var(--radius-lg);background:none;display:grid;place-items:center;--pb:var(--surface-1)}
.cell .mk.c{box-shadow:inset 0 0 0 1.5px var(--text-muted)}
.cell .mk.cc{box-shadow:inset 0 0 0 1.5px var(--text-muted),inset 0 0 0 4px var(--pb),inset 0 0 0 5.5px var(--text-muted)}
.cell .mk.s,.cell .mk.d{color:var(--text)}
.cell .mk.s{box-shadow:inset 0 0 0 1.5px var(--text-muted)}
.cell .mk.d{box-shadow:inset 0 0 0 1.5px var(--text-muted),inset 0 0 0 4px var(--pb),inset 0 0 0 5.5px var(--text-muted)}
.sheet .txt{display:inline;margin:0;height:auto}
.sec{margin-top:8px;width:100%;height:56px;border-top:1px solid var(--surface-3);font-size:17px;font-weight:600;text-align:left}
.txt{display:block;margin:6px auto 0;height:44px;font-size:15px;font-weight:600;color:var(--text-muted)}
svg{display:block}
.cell.sel .mk{color:var(--bg)!important}
.cell.sel .mk.s{box-shadow:inset 0 0 0 1.5px var(--bg)!important}
</style></head>
<style>
/* divider variants */
.dv-faint .row,.dv-faint .line{border-top-color:rgba(255,255,255,.05)!important}
.dv-none .row,.dv-none .line{border-top-color:transparent!important}
.dv-none .row{padding-top:14px}
.dv-inset .row,.dv-inset .line{border-top:0!important;position:relative}
.dv-inset .row+.row::before,.dv-inset .line::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--line);margin:0 25%;opacity:.8}
.dv-one .row,.dv-one .line{border-top-color:transparent!important}
.dv-one .line{border-top:1px solid var(--line)!important}
.dv-one .row+.row{padding-top:12px}
/* inline layout: name column left of pads */
.ly-inline .row{display:grid;grid-template-columns:92px 1fr;align-items:center;padding:6px 0}
.ly-inline .row .nm{flex-direction:column;align-items:flex-start;justify-content:center;height:auto;margin:0}
.ly-inline .row .nm b{display:flex;flex-direction:column;font-size:15px;white-space:nowrap}
.ly-inline .row .nm b i{margin:2px 0 0;font-size:12px}
.ly-inline .pads{grid-template-columns:repeat(4,minmax(0,1fr)) 44px;gap:2px}
.ly-inline .pad{height:60px}
.ly-inline .mk{width:34px;height:34px;font-size:20px}
