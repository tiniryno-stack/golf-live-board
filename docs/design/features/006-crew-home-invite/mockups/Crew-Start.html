<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393"><title>Crew-Start</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--org:#FF9A4A;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--err:#FF5A5A;--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10);--scrim:rgba(0,0,0,0.6);--shC:none;--shS:0 -8px 32px rgba(0,0,0,0.5)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#DDE0E5;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--org:#B85A00;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--err:#C8282D;--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10);--scrim:rgba(11,13,16,0.35);--shC:0 1px 2px rgba(11,13,16,0.06),0 4px 12px rgba(11,13,16,0.05);--shS:0 -8px 32px rgba(11,13,16,0.16)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
</style>
<style>body{margin:0}</style></head><body>
<div class="t dark" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; padding: 14px 8px 0; height: 48px"><button aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button></div>
<div style="padding: 10px 20px 0"><div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Name your crew</div><div style="font-size: 15px; color: var(--tx2); margin-top: 8px; line-height: 1.4">This is what friends see when you invite them. You can change it later.</div></div>
<div style="margin: 24px 16px 0"><label for="crewname" class="lbl" style="display: block; margin: 0 4px 8px">CREW NAME</label>
<input id="crewname" value="Saturday Crew" maxlength="24" style="width: 100%; box-sizing: border-box; height: 60px; border-radius: 16px; border: 2px solid var(--tx); background: var(--s1); color: var(--tx); padding: 0 16px; font-size: 20px; font-weight: 600; outline: none">
<div class="mono" style="font-size: 12px; color: var(--tx2); margin: 8px 4px 0; text-align: right">13 / 24</div></div>
<div style="margin: 8px 16px 0; display: flex; gap: 8px; flex-wrap: wrap"><button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--ln); background: transparent; font-size: 14px; color: var(--tx2)">Sunday Skins</button><button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--ln); background: transparent; font-size: 14px; color: var(--tx2)">The Regulars</button><button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--ln); background: transparent; font-size: 14px; color: var(--tx2)">Twin Creeks Crew</button></div>
<div style="margin: auto 16px 16px">
<button style="width: 100%; height: 58px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>Create and invite</button>
<div style="font-size: 13px; color: var(--tx2); text-align: center; margin-top: 10px">Opens your share sheet with the invite link.</div></div>
</div>
<script>if(location.search.includes("light"))document.querySelector(".t").classList.replace("dark","light")</script></body></html>
