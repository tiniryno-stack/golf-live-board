<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=393"><title>Crew-Join-Dead</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#0A0B0D;--s1:#15171B;--s2:#1F2227;--s3:#2A2E35;--tx:#F4F5F7;--tx2:#A7ACB4;--ln:#2B2F36;--me:#3DDC84;--meT:#3DDC84;--org:#FF9A4A;--blue:#5B9BFF;--pink:#FF6FB5;--vio:#B18CFF;--warn:#F5C64A;--warnBg:rgba(245,198,74,0.08);--err:#FF5A5A;--btn:#F4F5F7;--btnT:#0A0B0D;--tint:rgba(61,220,132,0.10);--scrim:rgba(0,0,0,0.6);--shC:none;--shS:0 -8px 32px rgba(0,0,0,0.5)}
.t.light{--bg:#F2F3F5;--s1:#FFFFFF;--s2:#E8EAEE;--s3:#DDE0E5;--tx:#0B0D10;--tx2:#4F555E;--ln:#D5D9DF;--me:#12A35C;--meT:#0A7A43;--org:#B85A00;--blue:#1A5FD0;--pink:#C02A70;--vio:#6E3FD0;--warn:#8A6000;--warnBg:rgba(138,96,0,0.07);--err:#C8282D;--btn:#0B0D10;--btnT:#FFFFFF;--tint:rgba(18,163,92,0.10);--scrim:rgba(11,13,16,0.35);--shC:0 1px 2px rgba(11,13,16,0.06),0 4px 12px rgba(11,13,16,0.05);--shS:0 -8px 32px rgba(11,13,16,0.16)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;color:var(--tx2);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
</style>
<style>body{margin:0}</style></head><body>
<div class="t dark" style="width: 393px; height: 852px; box-sizing: border-box; background: var(--bg); color: var(--tx); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 28px 40px">
<div style="width: 64px; height: 64px; border-radius: 32px; background: var(--s1); border: 1.5px solid var(--err); color: var(--err); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6M10 6l1-1a4 4 0 0 1 6 6l-1 1M14 18l-1 1a4 4 0 0 1-6-6l1-1M4 4l16 16"></path></svg></div>
<div style="font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15; margin-top: 20px">This invite link doesn’t work anymore</div>
<div style="font-size: 16px; color: var(--tx2); margin-top: 10px; line-height: 1.45">Whoever runs the crew may have reset it. Ask them to send you a new link.</div></div>
<div style="margin: 0 16px 16px">
<button style="width: 100%; height: 58px; border-radius: 18px; border: 0; background: var(--btn); color: var(--btnT); font-size: 17px; font-weight: 700">Go to Home</button>
<button style="width: 100%; height: 52px; margin-top: 6px; border-radius: 14px; border: 0; background: transparent; font-size: 15px; font-weight: 600">Join a round with a code</button></div>
</div>
<script>if(location.search.includes("light"))document.querySelector(".t").classList.replace("dark","light")</script></body></html>
