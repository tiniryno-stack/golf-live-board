<title>Today's Game in Motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;800&family=Geist+Mono:wght@600;700&display=swap">
<style>
/* Layout: a control strip (game × direction) over one phone at 393 × 659, notes under it.
   Inside the phone: only Golf Live Board design-system tokens, the six type styles, 027 motion values. */
:root {
  --font-sans: Geist, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --radius-lg: 16px; --radius-xl: 18px;
  /* dark (the app's default) */
  --bg: #0a0b0d; --surface-1: #15171b; --surface-2: #1f2227; --surface-3: #2a2e35;
  --text: #f4f5f7; --text-muted: #a7acb4; --line: #2b2f36;
  --cart-you: #3ddc84; --cart-you-text: #3ddc84; --tint-you: rgba(61,220,132,0.10);
  --cart-a: #ff9f43; --cart-b: #5b9bff; --cart-c: #ff6fb5; --tint-a: rgba(255,159,67,0.12); --tint-b: rgba(91,155,255,0.12); --tint-c: rgba(255,111,181,0.12);
  --bad: #ff5a5f;
  --shadow-dock: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 28px rgba(255,255,255,0.06);
  /* 027 */
  --motion-grow: 300ms; --ease-grow: cubic-bezier(.2,.8,.2,1); --blur-swap: 8px;
  --glow-you: 0 0 20px rgba(61,220,132,.35); --peek: .6;
  /* page chrome only (outside the phone) */
  --page: #050607; --frame: #23262c;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f3f5; --surface-1: #ffffff; --surface-2: #e8eaee; --surface-3: #ffffff;
  --text: #0b0d10; --text-muted: #4f555e; --line: #d5d9df;
  --cart-you: #12a35c; --cart-you-text: #0a7a43; --tint-you: rgba(18,163,92,0.09);
  --cart-a: #b35c00; --cart-b: #1a5fd0; --cart-c: #c02a70; --tint-a: rgba(179,92,0,0.08); --tint-b: rgba(26,95,208,0.08); --tint-c: rgba(192,42,112,0.08);
  --bad: #c62828; --shadow-dock: 0 8px 24px rgba(11,13,16,0.12); --glow-you: none;
  --page: #e4e6ea; --frame: #c9cdd3; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f3f5; --surface-1: #ffffff; --surface-2: #e8eaee; --surface-3: #ffffff;
  --text: #0b0d10; --text-muted: #4f555e; --line: #d5d9df;
  --cart-you: #12a35c; --cart-you-text: #0a7a43; --tint-you: rgba(18,163,92,0.09);
  --cart-a: #b35c00; --cart-b: #1a5fd0; --cart-c: #c02a70; --tint-a: rgba(179,92,0,0.08); --tint-b: rgba(26,95,208,0.08); --tint-c: rgba(192,42,112,0.08);
  --bad: #c62828; --shadow-dock: 0 8px 24px rgba(11,13,16,0.12); --glow-you: none;
  --page: #e4e6ea; --frame: #c9cdd3; color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 18px; }
.lbl, .label { font-family: var(--font-mono); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.muted { color: var(--text-muted); }

/* ── controls (page chrome) ── */
header h1 { font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 6px; text-wrap: balance; }
header p { margin: 0; font-size: 15px; line-height: 20px; color: var(--text-muted); max-width: 60ch; }
.ctl { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px/18px var(--font-sans); color: var(--text); background: var(--surface-1); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chip small { font: 500 13px/18px var(--font-sans); color: var(--text-muted); }
.chip[aria-pressed="true"] { background: var(--tint-you); border-color: var(--cart-you); box-shadow: var(--glow-you); }
.chip:focus-visible, button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.stagewrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .stagewrap { grid-template-columns: minmax(0,1fr); } }
.notes { display: grid; gap: 14px; font-size: 15px; line-height: 20px; min-width: 0; }
.notes h2 { font-size: 17px; line-height: 22px; font-weight: 600; margin: 0; }
.notes p { margin: 0; color: var(--text-muted); max-width: 62ch; }
.notes ul { margin: 0; padding-left: 18px; color: var(--text-muted); display: grid; gap: 4px; }
.flag { border: 1px dashed var(--line); border-radius: var(--radius-lg); padding: 12px 14px; display: grid; gap: 6px; }
.flag b { color: var(--text); font-weight: 600; }

/* ── the phone ── */
.fit { width: 393px; height: 659px; transform-origin: top left; }
.fitbox { position: relative; }
.phone { width: 393px; height: 659px; border-radius: 44px; background: var(--bg); position: relative; overflow: hidden;
  box-shadow: 0 0 0 8px var(--frame), 0 30px 60px rgba(0,0,0,.35); display: grid; grid-template-rows: auto 300px 1fr auto; isolation: isolate; }
.top { padding: 22px 20px 0; display: grid; gap: 10px; }
.toprow { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); }
.toprow button { background: none; border: 0; color: var(--text-muted); font: 500 13px/18px var(--font-sans); padding: 6px 0 6px 12px; cursor: pointer; }
.segs { display: flex; gap: 4px; height: 3px; }
.segs i { flex: 1; border-radius: 2px; background: var(--surface-3); overflow: hidden; position: relative; }
.segs i b { position: absolute; inset: 0; background: var(--text); transform-origin: left; transform: scaleX(0); }
.segs i.done b { transform: scaleX(1); }
.segs.hide { visibility: hidden; }

.stage { position: relative; padding: 18px 20px 0; perspective: 900px; }
.copy { padding: 12px 20px 0; display: grid; gap: 8px; align-content: start; }
.h { font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin: 0; text-wrap: balance; }
.s { font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text-muted); margin: 0; text-wrap: pretty; }
.foot { padding: 0 20px 26px; display: grid; gap: 10px; }
.btn { height: 56px; border-radius: var(--radius-lg); border: 0; background: var(--text); color: var(--bg); font: 600 17px/22px var(--font-sans); cursor: pointer; width: 100%; }
.btn.bump { animation: bump .22s cubic-bezier(.2,.8,.2,1); }
.hint { text-align: center; font-size: 13px; line-height: 18px; color: var(--text-muted); min-height: 18px; }

/* 027 blur swap */
@keyframes swap-out { from { opacity: 1; filter: blur(0) } to { opacity: 0; filter: blur(var(--blur-swap)) } }
@keyframes swap-in  { from { opacity: 0; filter: blur(var(--blur-swap)) } to { opacity: 1; filter: blur(0) } }
.out { animation: swap-out calc(var(--motion-grow) * .4) cubic-bezier(.4,0,1,1) both; }
.in  { animation: swap-in calc(var(--motion-grow) * .8) calc(var(--motion-grow) * .2) var(--ease-grow) both; }
/* 022 reward keyframes */
@keyframes bump { 0% { transform: scale(.92) } 55% { transform: scale(1.06) } 100% { transform: scale(1) } }
@keyframes draw { from { stroke-dashoffset: var(--len) } to { stroke-dashoffset: 0 } }

/* ── scene parts ── */
.sc { position: relative; height: 282px; display: grid; align-content: center; gap: 12px; }
.e { opacity: 0; filter: blur(var(--blur-swap)); transform: translateY(10px);
  transition: opacity 240ms var(--ease-grow), filter 240ms var(--ease-grow), transform 300ms var(--ease-grow); transition-delay: var(--d, 0ms); }
.go .e { opacity: 1; filter: blur(0); transform: none; }
.tile { background: var(--surface-1); border-radius: var(--radius-xl); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.tile.you { background: var(--tint-you); box-shadow: inset 0 0 0 1.5px var(--cart-you), var(--glow-you); }
.tile.a { background: var(--tint-a); box-shadow: inset 0 0 0 1.5px var(--cart-a); }
.tile.b { background: var(--tint-b); box-shadow: inset 0 0 0 1.5px var(--cart-b); }
.tile.c { background: var(--tint-c); box-shadow: inset 0 0 0 1.5px var(--cart-c); }
.tile.dim { opacity: var(--peek); }
.row { font-size: 17px; line-height: 22px; font-weight: 600; }
.body { font-size: 15px; line-height: 20px; font-weight: 500; }
.small { font-size: 13px; line-height: 18px; font-weight: 500; }
.num { font-family: var(--font-mono); }
.nxl { font-family: var(--font-mono); font-size: 64px; line-height: 64px; font-weight: 700; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.ttl-mono { font-family: var(--font-mono); font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.youtxt { color: var(--cart-you-text); }
.vs { text-align: center; color: var(--text-muted); }

/* score cell with mark */
.sco { position: relative; width: 40px; height: 40px; display: grid; place-items: center; font: 700 17px/22px var(--font-mono); flex: none; }
.sco svg { position: absolute; inset: 0; overflow: visible; }
.sco svg path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
.sco.pop { opacity: 0; }
.go .sco.pop { animation: bump .22s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d); opacity: 1; transition: opacity 1ms var(--d), background 300ms var(--ease-grow) var(--d2, 1050ms), color 300ms var(--ease-grow) var(--d2, 1050ms), box-shadow 300ms var(--ease-grow) var(--d2, 1050ms); }
.go .sco svg path { animation: draw .32s cubic-bezier(.3,.7,.2,1) both; animation-delay: calc(var(--d) + 60ms); }
.sco.dbl { color: var(--bad); }

/* hole scene */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.col { background: var(--surface-1); border-radius: var(--radius-xl); padding: 10px; display: grid; gap: 6px; }
.pr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 2px 10px; border-radius: 12px;
  transition: opacity 300ms var(--ease-grow); transition-delay: var(--d2, 0ms); }
.pr .nm { font-size: 15px; line-height: 20px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sco { border-radius: 10px; }
.go .pr.best.y .sco { background: var(--cart-you); color: var(--bg); box-shadow: var(--glow-you); }
.go .pr.best.t .sco { background: var(--surface-3); }
.go .pr:not(.best) { opacity: var(--peek); }
.ptline { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; height: 36px; align-items: center; }
.pt { justify-self: center; font: 700 17px/22px var(--font-mono); padding: 6px 12px; border-radius: 999px; opacity: 0; transform: translateY(14px) scale(.9); }
.pt.y { background: var(--cart-you); color: var(--bg); box-shadow: var(--glow-you); }
.pt.t { background: var(--surface-3); color: var(--text); }
.go .pt { animation: ptin 420ms var(--ease-grow) both; animation-delay: var(--d); }
@keyframes ptin { 0% { opacity: 0; transform: translateY(14px) scale(.9); filter: blur(4px) } 60% { opacity: 1; transform: translateY(-3px) scale(1.06); filter: blur(0) } 100% { opacity: 1; transform: none } }

/* strip of 18 holes */
.strip { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; }
.strip i { height: 28px; border-radius: 6px; background: var(--surface-2); transition: background 300ms var(--ease-grow), box-shadow 300ms var(--ease-grow); }
.strip i.on { background: var(--cart-you); box-shadow: var(--glow-you); }
.strip i.past { background: var(--surface-3); }
.stretch-lbls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.stretch-lbls span { text-align: center; color: var(--text-muted); transition: color 300ms var(--ease-grow); }
.stretch-lbls span.on { color: var(--text); }
.swapbox { display: grid; }
.swapbox > * { grid-area: 1/1; }

/* bars */
.tug { position: relative; height: 18px; border-radius: 9px; background: var(--surface-2); overflow: visible; }
.tug .y, .tug .t { position: absolute; top: 0; bottom: 0; border-radius: 9px; width: 0; transition: width 1400ms cubic-bezier(.3,.7,.2,1); transition-delay: var(--d, 0ms); }
.tug .y { left: 0; background: var(--cart-you); box-shadow: var(--glow-you); }
.tug .t { right: 0; background: var(--surface-3); }
.tug .tick { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--text); border-radius: 1px; }
.tickl { position: relative; height: 16px; }
.tickl span { position: absolute; transform: translateX(-50%); white-space: nowrap; transition: color 300ms var(--ease-grow); }
.tickl span.lit { color: var(--cart-you-text); }
.hbars { display: grid; gap: 10px; }
.hb { display: grid; grid-template-columns: 74px minmax(0,1fr) 36px; align-items: center; gap: 10px; }
.hb .nm { font-size: 15px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .trk { height: 14px; border-radius: 7px; background: var(--surface-2); position: relative; }
.hb .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 7px; background: var(--surface-3); transition: width 1200ms cubic-bezier(.3,.7,.2,1); transition-delay: var(--d, 0ms); }
.hb.you .fill { background: var(--cart-you); box-shadow: var(--glow-you); }
.hb.you .nm { color: var(--cart-you-text); font-weight: 600; }
.hb .v { font: 700 15px/20px var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.lockline { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--text); left: var(--x, 0%); transition: left 900ms var(--ease-grow); opacity: 0; }
.go .lockline { opacity: 1; }
.chipline { display: flex; justify-content: center; }
.flagchip { font: 600 12px/16px var(--font-mono); letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); color: var(--text-muted); transition: all 300ms var(--ease-grow); }
.flagchip.lit { background: var(--tint-you); color: var(--cart-you-text); box-shadow: inset 0 0 0 1.5px var(--cart-you), var(--glow-you); }

/* carts grid */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cart { transition: background 300ms var(--ease-grow), box-shadow 300ms var(--ease-grow), opacity 300ms var(--ease-grow); }
.dots { display: grid; grid-template-columns: repeat(6, 34px); justify-content: center; gap: 10px; }
.dots i { aspect-ratio: 1; border-radius: 50%; background: var(--surface-2); transition: background 240ms var(--ease-grow), box-shadow 240ms var(--ease-grow), transform 240ms var(--ease-grow); }
.dots i.w { background: var(--cart-you); box-shadow: var(--glow-you); transform: scale(1.04); }
.dots i.l { background: var(--surface-3); }
.dots i.h { background: linear-gradient(90deg, var(--cart-you) 50%, var(--surface-3) 50%); }
.lb { position: relative; }
.ptile { background: var(--surface-1); border-radius: var(--radius-xl); padding: 10px 8px 10px 14px; }
.flipcard .ptile, .dk .ptile { background: var(--surface-2); }
.dkn { position: absolute; top: 14px; right: 16px; }
.dstage { height: 100%; }
.lbr { position: absolute; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 14px; background: var(--surface-1);
  transition: transform 500ms var(--ease-grow), background 300ms, box-shadow 300ms; }
.lbr.you { background: var(--tint-you); box-shadow: inset 0 0 0 1.5px var(--cart-you); }
.lbr .pos { font: 700 15px/20px var(--font-mono); width: 22px; color: var(--text-muted); }
.lbr .nm { flex: 1; font-size: 17px; line-height: 22px; font-weight: 600; }
.lbr .v { font: 700 17px/22px var(--font-mono); font-variant-numeric: tabular-nums; }
.card9 { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: var(--surface-1); border-radius: var(--radius-xl); padding: 10px 6px; }
.card9 .hc { display: grid; justify-items: center; gap: 4px; }
.card9 .hn { font: 600 12px/16px var(--font-mono); color: var(--text-muted); }
.card9 .sco { width: 32px; height: 32px; font-size: 15px; }

/* ── direction B: one card that flips ── */
.flipcard { height: 282px; border-radius: var(--radius-xl); background: var(--surface-1); padding: 0 16px; transform-style: preserve-3d; backface-visibility: hidden; }
.flipcard .sc .col, .flipcard .sc .tile:not(.you):not(.a):not(.b):not(.c), .flipcard .card9, .flipcard .lbr:not(.you) { background: var(--surface-2); }
.flipcard .strip i { background: var(--surface-3); }
@keyframes flipout { from { transform: rotateY(0) } to { transform: rotateY(90deg); filter: blur(2px) } }
@keyframes flipin  { from { transform: rotateY(-90deg); filter: blur(2px) } to { transform: rotateY(0) } }
.flipcard.fo { animation: flipout 140ms cubic-bezier(.4,0,1,1) both; }
.flipcard.fi { animation: flipin 260ms var(--ease-grow) both; }

/* ── direction C: the deck ── */
.deck { position: relative; height: 282px; transform-style: preserve-3d; }
.dk { position: absolute; inset: 0; border-radius: var(--radius-xl); background: var(--surface-1); padding: 0 16px; box-shadow: 0 18px 40px rgba(0,0,0,.35);
  transition: transform var(--motion-grow) var(--ease-grow), opacity var(--motion-grow) var(--ease-grow), filter 150ms linear; will-change: transform; }
.dk .sc .col, .dk .sc .tile:not(.you):not(.a):not(.b):not(.c), .dk .card9, .dk .lbr:not(.you) { background: var(--surface-2); }
.dk .strip i { background: var(--surface-3); }
.deck.moving .dk { filter: blur(2px); }

/* ── mini phone (E, F) ── */
.mp, .dvp { width: 393px; border-radius: 44px; background: var(--bg); box-shadow: 0 0 0 6px var(--surface-3), 0 0 0 7px var(--line), 0 30px 60px rgba(0,0,0,.4); overflow: hidden; }
.mp { height: 600px; position: relative; }
.mp-st { height: 34px; display: flex; justify-content: space-between; align-items: end; padding: 0 30px; font: 600 13px/18px var(--font-sans); }
.mp-st i { width: 90px; height: 24px; border-radius: 12px; background: var(--surface-2); align-self: center; }
.mp-ti { height: 66px; padding: 8px 20px 0; }
.mp-body { position: absolute; left: 20px; right: 20px; top: 100px; height: 282px; }
.mp-tabs { position: absolute; left: 16px; right: 16px; bottom: 22px; height: 60px; border-radius: 30px; background: var(--surface-1); box-shadow: var(--shadow-dock);
  display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
.mp-tabs i { width: 22px; height: 22px; border-radius: 7px; background: var(--surface-3); }
.mp-tabs i.on { background: var(--text); }
.stage.clip { overflow: hidden; }
.stage.clipc { clip-path: inset(18px 0 0 0); }
.stage.fade { -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }

/* ── E: a phone on screen ── */
.pd { position: relative; height: 282px; transform-style: preserve-3d; }
.mpw { position: absolute; left: 0; top: 0; width: 228px; height: 348px; transition: transform 600ms var(--ease-grow); will-change: transform; }
.mpw .mp { transform: scale(.58); transform-origin: top left; }
.call { position: absolute; top: 70px; width: 112px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.call.r { right: 0; } .call.l { left: 0; }
.call .cv { animation: ptin 420ms var(--ease-grow) both; animation-delay: 450ms; }
.tap { position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--text); opacity: 0; animation: ripple .45s .1s ease-out both; pointer-events: none; }
@keyframes ripple { 0% { opacity: .55; transform: scale(.7) } 100% { opacity: 0; transform: scale(1.35) } }

/* ── F: dive in ── */
.dv { position: relative; height: 282px; }
.dvcam { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.dvp { position: absolute; top: 0; height: 500px; }

/* ── G: watch a hole ── */
.crs { width: 100%; height: 150px; display: block; overflow: visible; }
.ball { transition: opacity 200ms linear; }
.ball circle { fill: var(--surface-3); stroke: var(--text-muted); stroke-width: 1.5; }
.ball text { font: 700 12px var(--font-mono); fill: var(--text); }
.ball.y circle { fill: var(--cart-you); stroke: none; } .ball.y text { fill: var(--bg); }
.trl line { stroke: var(--text-muted); stroke-width: 1.5; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .45; }
.trl line.y { stroke: var(--cart-you); opacity: .7; }
.lgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.lg { background: var(--surface-1); border-radius: 12px; padding: 6px 4px; text-align: center; display: grid; gap: 2px; transition: background 300ms var(--ease-grow), box-shadow 300ms var(--ease-grow); }
.lg .nm { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); }
.lg.y .nm { color: var(--cart-you-text); }

  .go .sco.pop, .go .sco svg path, .go .pt, .btn.bump, .call .cv, .tap, .bmp { animation: none !important; opacity: 1; }

<div class="wrap">

    <div class="lbl muted">Golf Live Board · 032 brainstorm</div>
    <h1>Today's game, in motion</h1>
    <p>Pick a game and a direction. Round two: A, B and C stay, and E to H are new. Everything here is animated code, not video. Tap the scene to skip ahead; <b>Let's play</b> is always there.</p>

  <div class="ctl">
    <div class="lbl muted">Game</div>

  <div class="stagewrap">

<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
let timers = [];
const later = (ms, f) => { const t = setTimeout(f, RM ? Math.min(ms, 1) : ms); timers.push(t); return t; };
const clearAll = () => { timers.forEach(clearTimeout); timers = []; };
const half = (n) => { const w = Math.floor(n + 1e-9), h = n - w > 1e-9; return (w || !h ? String(w) : '') + (h ? '½' : ''); };

// ── score mark (022 markPaths, gross) ──
function mark(score, par, d, size = 40) {
  const k = score - par, h = size / 2;
  const circ = (r) => ({ d: `M ${h} ${h - r} a ${r} ${r} 0 1 1 0 ${2*r} a ${r} ${r} 0 1 1 0 ${-2*r}`, len: 2 * Math.PI * r });
  const sq = (i) => { const a = i, b = size - i; return { d: `M ${a+4} ${a} H ${b-4} Q ${b} ${a} ${b} ${a+4} V ${b-4} Q ${b} ${b} ${b-4} ${b} H ${a+4} Q ${a} ${b} ${a} ${b-4} V ${a+4} Q ${a} ${a} ${a+4} ${a}`, len: 4 * (b - a) }; };
  const paths = k <= -2 ? [circ(h-1), circ(h-5.5)] : k === -1 ? [circ(h-1)] : k === 1 ? [sq(1)] : k >= 2 ? [sq(1), sq(5.5)] : [];
  const svg = paths.length ? `<svg viewBox="0 0 ${size} ${size}">${paths.map(p => `<path d="${p.d}" style="--len:${p.len.toFixed(1)}"/>`).join('')}</svg>` : '';
  return `<span class="sco pop${k >= 2 ? ' dbl' : ''}" style="--d:${d}ms">${score}${svg}</span>`;
}

// ── scenes: (args) → { html, play(el) } ──
const S = {
  versus: ({ us, them, usLbl = 'Your side', themLbl = 'Them', sub }) => ({ html: `<div class="sc">
      <div class="tile you e" style="--d:0ms"><span class="label youtxt">${usLbl}</span><span class="row">${us}</span></div>
      <div class="vs label e" style="--d:220ms">vs</div>
      <div class="tile e" style="--d:380ms"><span class="label muted">${themLbl}</span><span class="row">${them}</span></div>
      ${sub ? `<div class="small muted e" style="--d:560ms;text-align:center">${sub}</div>` : ''}</div>` }),

  hole: ({ hole = 4, par = 4, us, them, tie }) => {
    const best = (a) => Math.min(...a.map(r => r[1]));
    const bu = best(us), bt = best(them);
    let d = 120;
    const rows = (arr, side, b) => arr.map(([n, s], i) => {
      const r = `<div class="pr${s === b && arr.findIndex(x => x[1] === b) === i ? ' best ' + side : ''}" style="--d2:1050ms"><span class="nm">${n}</span>${mark(s, par, d)}</div>`; d += 170; return r; }).join('');
    const ru = rows(us, 'y', bu), rt = rows(them, 't', bt);
    const pts = tie ? `<span class="pt t" style="--d:1500ms">½</span><span class="pt t" style="--d:1500ms">½</span>`
      : `<span class="pt y" style="--d:1500ms">+1</span><span></span>`;
    return { html: `<div class="sc">
      <div class="label muted e" style="--d:0ms">Hole ${hole} · Par ${par}</div>
      <div class="cols e" style="--d:40ms"><div class="col">${ru}</div><div class="col">${rt}</div></div>
      <div class="ptline">${pts}</div></div>` };
  },

  switch: ({ partners }) => ({ html: `<div class="sc">
      <div class="swapbox" id="pw"><div class="title-row"><span class="label muted">Holes 1–6 · partner</span><div class="h" style="margin-top:4px">${partners[0]}</div></div></div>
      <div class="strip e" style="--d:0ms">${Array.from({ length: 18 }, () => '<i></i>').join('')}</div>
      <div class="stretch-lbls label e" style="--d:100ms"><span>1–6</span><span>7–12</span><span>13–18</span></div></div>`,
    play(el) {
      const cells = [...el.querySelectorAll('.strip i')], lbls = [...el.querySelectorAll('.stretch-lbls span')], pw = el.querySelector('#pw');
      const ranges = ['1–6', '7–12', '13–18'];
      const step = (k) => {
        cells.forEach((c, i) => { c.className = Math.floor(i / 6) === k ? 'on' : Math.floor(i / 6) < k ? 'past' : ''; });
        lbls.forEach((l, i) => l.classList.toggle('on', i === k));
        if (k) swapIn(pw, `<div><span class="label muted">Holes ${ranges[k]} · partner</span><div class="h" style="margin-top:4px">${partners[k]}</div></div>`);
      };
      later(300, () => step(0)); later(1300, () => step(1)); later(2300, () => step(2));
    } }),

  stretches: ({ res }) => ({ html: `<div class="sc">
      <div class="grid3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${res.map(([r, w, p], i) =>
        `<div class="tile ${w === 'W' ? 'you' : ''} e" style="--d:${i * 380}ms;text-align:center"><span class="label muted">${r}</span><span class="row ${w === 'W' ? 'youtxt' : ''}">${w === 'W' ? 'Won' : w === 'H' ? 'Halved' : 'Lost'}</span><span class="small muted">with ${p}</span></div>`).join('')}</div>
      <div class="e" style="--d:1400ms;display:flex;align-items:baseline;gap:10px;justify-content:center"><span class="nxl youtxt">2</span><span class="row">stretches won</span></div></div>` }),

  tug: ({ total, toWin, us, them, unit = 'points', lbl }) => ({ html: `<div class="sc" style="gap:16px">
      <div class="e" style="--d:0ms;display:flex;justify-content:space-between;align-items:end">
        <div><span class="label youtxt">You</span><div class="nxl youtxt" data-count="${us}">0</div></div>
        <div style="text-align:right"><span class="label muted">Them</span><div class="ttl-mono muted" data-count="${them}">0</div></div></div>
      <div class="tug e" style="--d:80ms"><span class="y" style="--d:300ms"></span><span class="t" style="--d:300ms"></span><span class="tick" style="left:calc(${toWin / total * 100}% - 1px)"></span></div>
      <div class="tickl label muted e" style="--d:120ms"><span style="left:${toWin / total * 100}%" id="tl">${lbl}</span></div>
      <div class="small muted e" style="--d:200ms;text-align:center">${total} ${unit} on the course</div></div>`,
    play(el) {
      later(40, () => { el.querySelector('.tug .y').style.width = `${us / total * 100}%`; el.querySelector('.tug .t').style.width = `${them / total * 100}%`; });
      el.querySelectorAll('[data-count]').forEach(n => countUp(n, +n.dataset.count, 340, 1400));
      later(1800, () => el.querySelector('#tl').classList.add('lit'));
    } }),

  carts: ({ mine, others }) => ({ html: `<div class="sc">
      <div class="label muted" style="text-align:center"><span id="cr">Holes 1–6</span></div>
      <div class="grid2">
        <div class="tile you cart e" style="--d:0ms"><span class="label youtxt">Your cart</span><span class="row">${mine}</span></div>
        ${others.map(([n, c], i) => `<div class="tile cart dim e" data-c="${c}" style="--d:${120 + i * 90}ms"><span class="label muted">Cart</span><span class="row">${n}</span></div>`).join('')}
      </div>
      <div class="small muted e" style="--d:500ms;text-align:center" id="cvs">&nbsp;</div></div>`,
    play(el) {
      const cs = [...el.querySelectorAll('.cart[data-c]')], cr = el.querySelector('#cr'), cvs = el.querySelector('#cvs');
      const r = ['Holes 1–6', 'Holes 7–12', 'Holes 13–18'];
      const step = (k) => { cs.forEach((c, i) => { c.classList.toggle(c.dataset.c, i === k); c.classList.toggle('dim', i !== k); });
        cr.textContent = r[k]; cvs.textContent = `vs ${cs[k].querySelector('.row').textContent}${k === 1 ? ' · other tee time' : ''}`; };
      later(600, () => step(0)); later(1600, () => step(1)); later(2600, () => step(2));
    } }),

  bars: ({ rows, max, note }) => ({ html: `<div class="sc">
      <div class="hbars">${rows.map(([n, v, you], i) => `<div class="hb ${you ? 'you' : ''} e" style="--d:${i * 80}ms"><span class="nm">${n}</span><span class="trk"><span class="fill" data-w="${v / max * 100}" style="--d:${250 + i * 80}ms"></span></span><span class="v" data-count="${v}">0</span></div>`).join('')}</div>
      ${note ? `<div class="small muted e" style="--d:600ms;text-align:center">${note}</div>` : ''}</div>`,
    play(el) { later(40, () => el.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'));
      el.querySelectorAll('[data-count]').forEach((n, i) => countUp(n, +n.dataset.count, 250 + i * 80, 1200)); } }),

  players: ({ names }) => ({ html: `<div class="sc"><div class="grid2">${names.map((n, i) =>
      `<div class="tile ${i === 0 ? 'you' : ''} e" style="--d:${i * 140}ms"><span class="label ${i === 0 ? 'youtxt' : 'muted'}">${i === 0 ? 'You' : 'Player'}</span><span class="row">${n}</span></div>`).join('')}</div></div>` }),

  aloneHole: ({ par = 4, scores, hole = 7 }) => {
    const low = Math.min(...scores.map(s => s[1])), k = scores.filter(s => s[1] === low).length;
    return { html: `<div class="sc">
      <div class="label muted e" style="--d:0ms">Hole ${hole} · Par ${par}</div>
      <div class="grid2">${scores.map(([n, s], i) => `<div class="pr ptile${s === low ? ' best y' : ''}" style="--d2:1100ms">
        <span class="nm">${n}</span>${mark(s, par, 140 + i * 160)}</div>`).join('')}</div>
      <div class="chipline"><span class="pt y" style="--d:1500ms">${k === 1 ? '+1 to the low score' : `${k === 2 ? '½' : '⅓'} each to the ${k} tied`}</span></div></div>` };
  },

  race: ({ rows, left }) => {
    const max = 10, second = rows[1][1];
    return { html: `<div class="sc" style="gap:14px">
      <div class="label muted e" style="--d:0ms;display:flex;justify-content:space-between"><span>After 16</span><span>${left} holes left</span></div>
      <div class="hbars" style="position:relative">${rows.map(([n, v, you], i) => `<div class="hb ${you ? 'you' : ''} e" style="--d:${i * 70}ms"><span class="nm">${n}</span><span class="trk"><span class="fill" data-w="${v / max * 100}" style="--d:${200 + i * 70}ms"></span>${i === 1 ? `<span class="lockline" style="--x:${second / max * 100}%"></span>` : ''}</span><span class="v" data-count="${v}">0</span></div>`).join('')}</div>
      <div class="small muted e" style="--d:1300ms;text-align:center">Best Chris can do: ${second} + ${left} = ${second + left}</div>
      <div class="chipline e" style="--d:1300ms"><span class="flagchip" id="lk">Still open</span></div></div>`,
      play(el) { later(40, () => el.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'));
        el.querySelectorAll('[data-count]').forEach((n, i) => countUp(n, +n.dataset.count, 200 + i * 70, 1100, true));
        later(1500, () => { const l = el.querySelector('.lockline'); l.style.left = ((second + left) / max * 100) + '%'; });
        later(2600, () => { const k = el.querySelector('#lk'); k.textContent = `Locked · ${rows[0][1]} beats ${second + left}`; k.classList.add('lit'); }); } };
  },

  card9: ({ pars, scores }) => ({ html: `<div class="sc" style="gap:16px">
      <div class="card9 e" style="--d:0ms">${pars.map((p, i) => `<div class="hc"><span class="hn">${i + 1}</span>${mark(scores[i], p, 200 + i * 150, 32)}</div>`).join('')}</div>
      <div class="e" style="--d:100ms;display:flex;justify-content:space-between;align-items:end">
        <div><span class="label muted">Front 9</span><div class="nxl" data-count="${scores.reduce((a, b) => a + b, 0)}">0</div></div>
        <div style="text-align:right"><span class="label muted">To par</span><div class="ttl-mono" id="tp">E</div></div></div></div>`,
    play(el) { const n = el.querySelector('[data-count]'); countUp(n, +n.dataset.count, 200, 1500);
      const tp = el.querySelector('#tp'); let run = 0; pars.forEach((p, i) => later(200 + i * 150, () => { run += scores[i] - p; tp.textContent = run === 0 ? 'E' : (run > 0 ? '+' : '−') + Math.abs(run); })); } }),

  board: ({ steps }) => ({ html: `<div class="sc"><div class="label muted e" style="--d:0ms">The Board · live</div><div class="lb e" style="--d:60ms;height:${4 * 52}px">${steps[0].map(([n, v, you]) =>
      `<div class="lbr ${you ? 'you' : ''}" data-n="${n}"><span class="pos"></span><span class="nm">${n}</span><span class="v">${v}</span></div>`).join('')}</div></div>`,
    play(el) {
      const place = (st) => { st.forEach(([n, v], i) => { const r = el.querySelector(`[data-n="${n}"]`); r.style.transform = `translateY(${i * 52}px)`; r.querySelector('.v').textContent = v; r.querySelector('.pos').textContent = i + 1; }); };
      place(steps[0]); steps.slice(1).forEach((st, k) => later(1100 + k * 1100, () => place(st)));
    } }),

  sides: () => ({ html: `<div class="sc"><div class="grid2">
      <div class="tile you e" style="--d:0ms"><span class="label youtxt">Your side</span><div class="dots" style="grid-template-columns:repeat(4,22px);justify-content:start;gap:8px;margin-top:6px">${'<i class="w"></i>'.repeat(4)}</div><span class="small muted">4 carts · 8 players</span></div>
      <div class="tile e" style="--d:200ms"><span class="label muted">Them</span><div class="dots" style="grid-template-columns:repeat(4,22px);justify-content:start;gap:8px;margin-top:6px">${'<i class="l"></i>'.repeat(4)}</div><span class="small muted">4 carts · 8 players</span></div>
    </div><div class="small muted e" style="--d:450ms;text-align:center">Your cart is green on your phone.</div></div>` }),

  ryderRot: ({ mine, opps }) => ({ html: `<div class="sc">
      <div class="label muted" style="text-align:center" id="rr">Holes 1–6</div>
      <div class="tile you e" style="--d:0ms"><span class="label youtxt">Your cart</span><span class="row">${mine}</span></div>
      <div class="vs label e" style="--d:150ms">vs</div>
      <div class="swapbox e" style="--d:250ms" id="ro"><div class="tile"><span class="label muted">Their cart</span><span class="row">${opps[0]}</span></div></div></div>`,
    play(el) { const r = ['Holes 1–6', 'Holes 7–12', 'Holes 13–18'], ro = el.querySelector('#ro'), rr = el.querySelector('#rr');
      [1, 2].forEach(k => later(k * 1100, () => { rr.textContent = r[k]; swapIn(ro, `<div class="tile"><span class="label muted">Their cart</span><span class="row">${opps[k]}</span></div>`); })); } }),

  matches: ({ seq }) => ({ html: `<div class="sc" style="gap:16px">
      <div class="dots e" style="--d:0ms">${seq.map(() => '<i></i>').join('')}</div>
      <div class="e" style="--d:80ms;display:flex;justify-content:space-between;align-items:end">
        <div><span class="label youtxt">Your side</span><div class="nxl youtxt" id="ms">0</div></div>
        <div style="text-align:right"><span class="label muted">Them</span><div class="ttl-mono muted" id="mt">0</div></div></div>
      <div class="small muted e" style="--d:120ms;text-align:center">12 matches · 1 point each · a tie is ½</div></div>`,
    play(el) { const ds = [...el.querySelectorAll('.dots i')]; let us = 0, th = 0;
      seq.forEach((r, i) => later(300 + i * 140, () => { ds[i].className = r; if (r === 'w') us += 1; else if (r === 'l') th += 1; else { us += .5; th += .5; }
        el.querySelector('#ms').textContent = half(us) || '0'; el.querySelector('#mt').textContent = half(th) || '0'; })); } }),
};

function countUp(n, to, delay, dur, whole) {
  if (RM) { n.textContent = half(to); return; }
  later(delay, () => { const t0 = performance.now();
    const tick = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3), v = to * e;
      n.textContent = whole || Number.isInteger(to) ? String(Math.round(v)) : (p < 1 ? String(Math.floor(v)) : half(to));
      if (p < 1 && n.isConnected) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); });
}
function swapIn(box, html) {
  const old = box.firstElementChild; const nu = document.createElement('div'); nu.innerHTML = html; const el = nu.firstElementChild;
  if (old && !RM) { old.classList.add('out'); later(120, () => old.remove()); } else if (old) old.remove();
  if (!RM) el.classList.add('in'); box.appendChild(el);
}

// ── G: a hole from above ──
function tween(el, dur, fn, done) {
  if (RM) { fn(1); done && done(); return; }
  const t0 = performance.now();
  const f = (t) => { if (!el.isConnected) return; const p = Math.min(1, (t - t0) / dur); fn(p); if (p < 1) requestAnimationFrame(f); else done && done(); };
  requestAnimationFrame(f);
}
const bumpEl = (n) => { n.classList.remove('bmp'); void n.offsetWidth; n.classList.add('bmp'); };
S.course = ({ par = 4, hole = 4, players, mode }) => ({ html: `<div class="sc" style="gap:8px;align-content:start">
    <div class="label muted e" style="--d:0ms">Hole ${hole} · Par ${par}</div>
    <svg class="crs e" style="--d:60ms" viewBox="0 0 353 150" aria-hidden="true">
      <path d="M40 110 Q 160 150 298 46" fill="none" stroke="var(--surface-1)" stroke-width="84" stroke-linecap="round"/>
      <path d="M40 110 Q 160 150 298 46" fill="none" stroke="var(--surface-2)" stroke-width="52" stroke-linecap="round"/>
      <ellipse cx="206" cy="52" rx="20" ry="11" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>
      <ellipse cx="258" cy="112" rx="15" ry="9" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>
      <circle cx="298" cy="46" r="36" fill="var(--surface-3)"/>
      <rect x="24" y="98" width="30" height="24" rx="7" fill="var(--surface-3)"/>
      <circle cx="298" cy="46" r="4.5" fill="var(--bg)"/>
      <path d="M298 46 V16" stroke="var(--text)" stroke-width="1.5"/><path d="M298 16 l15 5 l-15 5z" fill="var(--text)"/>
      <g class="trl"></g><g class="bls"></g>
    </svg>
    <div class="lgs e" style="--d:120ms;grid-template-columns:repeat(${players.length},1fr)">${players.map(([n, , side], i) => `<div class="lg ${side}" data-p="${i}"><span class="nm">${n}</span><span class="cn">0</span></div>`).join('')}</div>
    <div class="ptline" style="grid-template-columns:1fr"></div></div>`,
  play(el) {
    const NS = 'http://www.w3.org/2000/svg', tr = el.querySelector('.trl'), bl = el.querySelector('.bls'), pl = el.querySelector('.ptline');
    const T = [40, 110], Q = [160, 150], C = [298, 46];
    const bez = (f) => [0, 1].map(a => (1 - f) * (1 - f) * T[a] + 2 * (1 - f) * f * Q[a] + f * f * C[a]);
    const P = players.map(([n, s, side], pi) => {
      const wild = s >= par + 2 ? 2 : 1, pts = [[T[0], T[1] + (pi - (players.length - 1) / 2) * 7]];
      for (let i = 1; i <= s; i++) { const f = 1 - Math.pow(1 - i / s, 2), [x, y] = bez(f), j = (((pi * 37 + i * 53) % 21) - 10) * (1.15 - f) * 2.6 * wild; pts.push(i === s ? C : [x + j * .5, y + j]); }

      q('.mpw').style.transform = left ? 'translateX(0) rotateY(16deg) rotateX(3deg)' : 'translateX(125px) rotateY(-16deg) rotateX(3deg)';
      const put = () => { q('.mp-ti').innerHTML = chromeTop(b); q('.mp-tabs').innerHTML = chromeTabs(b); const { el } = mountScene(body, b);
        const s0 = el.querySelector('.sco'); if (s0 && tabOf(b)[0] === 'Enter') s0.insertAdjacentHTML('beforeend', '<span class="tap"></span>'); };
      if (first || RM) put(); else { body.firstElementChild?.classList.add('out'); later(140, put); }
      const [l, v] = b.call, c = q('.call'); c.className = 'call ' + (left ? 'r' : 'l');
      c.innerHTML = `<span class="label muted">${l}</span><span class="cv ${v.length <= 3 ? 'nxl youtxt' : v.length <= 6 ? 'h' : 'row'}">${v}</span>`; } },
  dive: { name: 'F · Dive in', extra: 900, notes: `<h2>F · Dive in</h2>
    <p>It opens on a row of small phones, one per idea. The camera dives into the first until it fills your screen, plays it, pulls back, slides to the next and dives again. It ends pulled back on the whole row.</p>
    <ul><li>The most "motion graphics" of the set; the zoom is the hook.</li><li>You see how many ideas there are before it starts.</li><li>Most movement, so it needs the calmest scenes inside.</li></ul>
    <div class="flag"><b>Flag:</b> the camera zoom (about 1 second between ideas) is a new pattern, and longer than our 300ms motion.</div>`,
    setup() { $('stage').innerHTML = `<div class="dv"><div class="dvcam">${BEATS.map((b, i) => `<div class="dvp" style="left:${i * PW}px"><div class="mp-st"><span>9:41</span><i></i><span></span></div><div class="mp-ti">${chromeTop(b)}</div><div class="mp-body"></div><div class="mp-tabs" style="bottom:22px">${chromeTabs(b)}</div></div>`).join('')}</div></div>`;
      $('stage').querySelector('.dvcam').style.transform = cam(0, RM ? 1 : .44); },
    show(k, b, first) { const c = $('stage').querySelector('.dvcam'), body = c.children[k].querySelector('.mp-body');
      if (RM) { c.style.transform = cam(k, 1); return mountScene(body, b); }
      const kf = first ? [{ transform: cam(0, .44) }, { transform: cam(0, .44), offset: .5 }, { transform: cam(0, 1) }]
        : [{ transform: cam(k - 1, 1) }, { transform: cam(k - 1, .44), offset: .32 }, { transform: cam(k, .44), offset: .64 }, { transform: cam(k, 1) }];
      c.animate(kf, { duration: first ? 1300 : 1000, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'forwards' });
      later(first ? 1150 : 850, () => mountScene(body, b)); },
    end() { const c = $('stage').querySelector('.dvcam'), k = BEATS.length - 1; if (!RM) c.animate([{ transform: cam(k, 1) }, { transform: cam(k - .5, .44) }], { duration: 700, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'forwards' }); } },
  course: { name: 'G · Watch a hole', notes: `<h2>G · Watch a hole</h2>
    <p>The middle beat is a hole seen from above. Everyone's ball flies shot by shot, the counters tick, the balls drop, and the point goes to whoever earned it. The other beats stay simple.</p>
    <ul><li>The only one that looks like golf, not like an app.</li><li>The rule is shown by playing it: nobody needs to read.</li><li>The hole takes about 7 seconds, the longest single beat.</li></ul>
    <div class="flag"><b>Flag:</b> the top-down hole drawing is a new illustration style (built only from our surface colours).</div>`,
    beats(g) { const out = []; let done = false; const tie = g.beats.some(b => b.sc[1].tie);
      for (const b of g.beats) { const k = b.sc[0], a = b.sc[1];
        if (!['hole', 'aloneHole', 'card9'].includes(k)) { out.push(b); continue; }
        if (done) continue; done = true;
        const players = k === 'hole' ? [...a.us.map(([n, s]) => [n, s, 'y']), ...a.them.map(([n, s]) => [n, s, 't'])] : k === 'aloneHole' ? a.scores.map(([n, s], i) => [n, s, i ? 't' : 'y']) : [['You', 4, 'y'], ['Chris', 5, 't'], ['Sam', 4, 't'], ['Jake', 6, 't']];
        const s = k === 'card9' ? 'Each shot adds one. No partners, no points.' : b.s + (tie && !/tie/i.test(b.s) ? ' A tie splits it.' : '');
        out.push({ h: b.h, s, call: b.call, hold: 500 + Math.max(...players.map(p => p[1])) * 560 + 2900, sc: ['course', { par: 4, hole: 4, players, mode: k === 'hole' ? 'best' : k === 'aloneHole' ? 'low' : 'none' }] }); }
      return out; },
    show(k, b, first) { DIRS.play.show(k, b, first); } },
  ff: { name: 'H · Fast-forward', notes: `<h2>H · Fast-forward</h2>
    <p>No steps. One round plays through in about 15 seconds: the hole counter runs, the 18 squares fill, the score moves. It stops itself at the moments that matter (the first point, a tie, the switch at 7, the winning point) and the line below explains just that moment. Tap to jump to the next one.</p>
    <ul><li>Shows the shape of the whole day, which the others don't.</li><li>The rules arrive at the moment they matter.</li><li>One screen, so nothing to page through.</li></ul>
    <div class="flag"><b>Flag:</b> nothing new except the pacing: it runs and pauses on its own.</div>` },
};

// ── state + render ──
let game = 'oneMatch', dir = 'play', cur = 0, BEATS = [], deckCards = [];
try { const s = JSON.parse(localStorage.getItem('g032') || '{}'); if (GAMES[s.game]) game = s.game; if (DIRS[s.dir]) dir = s.dir; } catch (e) {}
const save = () => { try { localStorage.setItem('g032', JSON.stringify({ game, dir })); } catch (e) {} };

function chips() {
  $('games').innerHTML = Object.entries(GAMES).map(([k, g]) => `<button class="chip" type="button" data-g="${k}" aria-pressed="${k === game}">${g.name} <small>${g.tag}</small></button>`).join('');
  $('dirs').innerHTML = Object.entries(DIRS).map(([k, d]) => `<button class="chip" type="button" data-d="${k}" aria-pressed="${k === dir}">${d.name}</button>`).join('');
}
$('games').addEventListener('click', (e) => { const b = e.target.closest('[data-g]'); if (b) { game = b.dataset.g; save(); chips(); start(); } });
$('dirs').addEventListener('click', (e) => { const b = e.target.closest('[data-d]'); if (b) { dir = b.dataset.d; save(); chips(); start(); } });

const HOLD = 3600;
function sceneOf(b) { const [k, a] = b.sc; return S[k](a); }
function mountScene(host, b, playNow = true) { const sc = sceneOf(b); host.innerHTML = sc.html; const el = host.firstElementChild; if (playNow) runScene(el, sc, b); return { el, sc }; }
function runScene(el, sc, b) { requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add('go'); if (sc.play && !b.noplay) sc.play(el); })); }
function segs(n) { $('segs').innerHTML = Array.from({ length: n }, () => '<i><b></b></i>').join(''); }
function segTo(k, hold) { [...$('segs').children].forEach((s, i) => { const b = s.firstChild; b.style.transition = 'none';
  b.style.transform = i < k ? 'scaleX(1)' : 'scaleX(0)'; if (i === k && !RM) { b.getBoundingClientRect(); b.style.transition = `transform ${hold}ms linear`; b.style.transform = 'scaleX(1)'; } }); }
function setCopy(b, first) {
  const html = `<div><p class="h">${b.h}</p><p class="s" style="margin-top:8px">${b.s}</p></div>`, box = $('copy');
  if (first || RM) { box.innerHTML = html; return; }
  [...box.children].forEach(c => c.style.gridArea = '1/1'); swapIn(box, html); box.lastElementChild.style.gridArea = '1/1';
}
function deckPos() { deckCards.forEach((c, i) => { const k = i - cur; c.style.zIndex = 50 - Math.abs(k);
  c.style.opacity = k < 0 ? 0 : k === 0 ? 1 : k === 1 ? 'var(--peek)' : k === 2 ? .3 : 0;
  c.style.transform = k < 0 ? 'translateX(-115%) rotateY(28deg) translateZ(-40px)' : k === 0 ? 'none' : `translateX(${k * 26}px) translateZ(${-k * 70}px) rotateY(${-k * 9}deg)`; }); }
function finish() { $('hint').textContent = 'Tap Replay to watch it again'; const p = $('play'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); DIRS[dir].end && DIRS[dir].end(); }
function go(k, first) {
  if (k >= BEATS.length) { clearAll(); return finish(); }
  clearAll(); cur = k; const b = BEATS[k], hold = (b.hold || HOLD) + (DIRS[dir].extra || 0);
  segTo(k, hold); setCopy(b, first); $('hint').textContent = ''; DIRS[dir].show(k, b, first); later(hold, () => go(k + 1));
}
function start() {
  clearAll(); cur = 0; ff = null; const g = GAMES[game], d = DIRS[dir], st = $('stage');
  $('notes').innerHTML = d.notes + '<p class="small muted">D (mood + 3 lines) is retired.</p>'; $('hint').textContent = ''; st.innerHTML = ''; $('copy').innerHTML = '';
  st.className = 'stage' + (dir === 'phone' ? ' clip fade' : dir === 'dive' ? ' clip clipc' : '');
  $('segs').classList.toggle('hide', dir === 'ff');
  if (dir === 'ff') return startFF(g);
  BEATS = d.beats ? d.beats(g) : g.beats; segs(BEATS.length); d.setup && d.setup(); go(0, true);
}
$('stage').addEventListener('click', () => { if (dir !== 'ff') return go(cur + 1); if (!ff) return; if (ff.paused) { clearAll(); ff.step(); } else ff.fast = true; });
$('replay').addEventListener('click', () => start());
$('play').addEventListener('click', () => { $('hint').textContent = 'In the app this opens Enter on hole 1.'; });

// ── fit the 393 × 659 phone to narrow screens ──
function fit() { const w = $('fitbox').parentElement.clientWidth, s = Math.min(1, (w - 8) / 393);
  $('fit').style.transform = `scale(${s})`; $('fitbox').style.width = 393 * s + 'px'; $('fitbox').style.height = 659 * s + 'px'; }
addEventListener('resize', fit);
chips(); fit(); start();
})();
</script>
