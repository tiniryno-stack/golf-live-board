<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;800&family=Geist+Mono:wght@600;700&display=swap">
<style>
/* Layout: one full-height phone column. Top bar, the hole (takes all spare height), 18-hole strip,
   scoreboard zone, caption, Let's play. Only Golf Live Board tokens, the six type styles, 027 / 022 motion. */
:root {
  --font-sans: Geist, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --radius-lg: 16px; --radius-xl: 18px;
  /* dark (the app's default) */
  --bg: #0a0b0d; --surface-1: #15171b; --surface-2: #1f2227; --surface-3: #2a2e35;
  --text: #f4f5f7; --text-muted: #a7acb4; --line: #2b2f36;
  --cart-you: #3ddc84; --cart-you-text: #3ddc84; --tint-you: rgba(61,220,132,0.10);
  --cart-a: #ff9f43; --cart-b: #5b9bff; --cart-c: #ff6fb5; --tint-a: rgba(255,159,67,0.12); --tint-b: rgba(91,155,255,0.12); --tint-c: rgba(255,111,181,0.12);
  --bad: #ff5a5f;
  --shadow-dock: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 28px rgba(255,255,255,0.06);
  /* 027 */
  --motion-grow: 300ms; --ease-grow: cubic-bezier(.2,.8,.2,1); --blur-swap: 8px;
  --glow-you: 0 0 20px rgba(61,220,132,.35); --peek: .6;
  /* page chrome only (outside the phone) */
  --page: #050607; --frame: #23262c;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f3f5; --surface-1: #ffffff; --surface-2: #e8eaee; --surface-3: #ffffff;
  --text: #0b0d10; --text-muted: #4f555e; --line: #d5d9df;
  --cart-you: #12a35c; --cart-you-text: #0a7a43; --tint-you: rgba(18,163,92,0.09);
  --cart-a: #b35c00; --cart-b: #1a5fd0; --cart-c: #c02a70; --tint-a: rgba(179,92,0,0.08); --tint-b: rgba(26,95,208,0.08); --tint-c: rgba(192,42,112,0.08);
  --bad: #c62828; --shadow-dock: 0 8px 24px rgba(11,13,16,0.12); --glow-you: none;
  --page: #e4e6ea; --frame: #c9cdd3; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f3f5; --surface-1: #ffffff; --surface-2: #e8eaee; --surface-3: #ffffff;
  --text: #0b0d10; --text-muted: #4f555e; --line: #d5d9df;
  --cart-you: #12a35c; --cart-you-text: #0a7a43; --tint-you: rgba(18,163,92,0.09);
  --cart-a: #b35c00; --cart-b: #1a5fd0; --cart-c: #c02a70; --tint-a: rgba(179,92,0,0.08); --tint-b: rgba(26,95,208,0.08); --tint-c: rgba(192,42,112,0.08);
  --bad: #c62828; --shadow-dock: 0 8px 24px rgba(11,13,16,0.12); --glow-you: none;
  --page: #e4e6ea; --frame: #c9cdd3; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; display: grid; place-items: center; }
.app { width: 100%; height: 100%; max-width: 430px; max-height: 940px; background: var(--bg); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.pad { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.label { font-family: var(--font-mono); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.small { font-size: 13px; line-height: 18px; font-weight: 500; } .row { font-size: 17px; line-height: 22px; font-weight: 600; }
.muted { color: var(--text-muted); } .youtxt { color: var(--cart-you-text); }
.ttl-mono { font-family: var(--font-mono); font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.nxl { font-family: var(--font-mono); font-size: 64px; line-height: 64px; font-weight: 700; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
button { font-family: inherit; } button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.top { padding-top: 14px; display: grid; gap: 10px; flex: none; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text-muted); min-height: 30px; }
.toprow > span { white-space: nowrap; } .toprow > .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.toprow button.done { color: var(--text); }
.toprow button { background: none; border: 0; color: var(--text-muted); font: 500 13px/18px var(--font-sans); padding: 6px 0 6px 14px; cursor: pointer; }
.segs { display: flex; gap: 4px; height: 3px; }
.segs i { flex: 1; border-radius: 2px; background: var(--surface-3); overflow: hidden; position: relative; }
.segs i b { position: absolute; inset: 0; background: var(--text); transform-origin: left; transform: scaleX(0); }

.hero { flex: 1; min-height: 0; position: relative; margin-top: 8px; overflow: hidden; cursor: pointer; }
.hero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bk { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.fn { font: 700 12px var(--font-mono); fill: var(--bg); }
.ball circle { fill: var(--surface-3); stroke: var(--text-muted); stroke-width: 1.5; transition: fill 300ms var(--ease-grow); }
.ball text { font: 700 12px var(--font-mono); fill: var(--text); }
.ball.y circle { fill: var(--cart-you); stroke: none; } .ball.y text { fill: var(--bg); }
.trl line { stroke: var(--text-muted); stroke-width: 1.5; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .45; }
.trl line.y { stroke: var(--cart-you); opacity: .7; }

.strip { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; margin-top: 8px; flex: none; }
.strip i { height: 20px; border-radius: 5px; background: var(--surface-2); transition: background 300ms var(--ease-grow); }
.strip i.w { background: var(--cart-you); } .strip i.l { background: var(--surface-3); } .strip i.d { background: var(--bad); }
.strip i.h { background: linear-gradient(90deg, var(--cart-you) 50%, var(--surface-3) 50%); }
.strip i.cur { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--text); }
.strip.s3 i:nth-child(6), .strip.s3 i:nth-child(12) { margin-right: 6px; }

.zone { height: 112px; margin-top: 12px; position: relative; display: grid; flex: none; }
.zone > .za, .zone > .zb { grid-area: 1 / 1; min-width: 0; }
.lgs, .cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cells { margin-top: 8px; }
.lg { background: var(--surface-1); border-radius: 12px; padding: 6px 4px; height: 56px; text-align: center; display: grid; gap: 2px; justify-items: center; transition: opacity 300ms var(--ease-grow); }
.lg .nm { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); }
.lg.y .nm { color: var(--cart-you-text); }
.lg .cn { font: 700 17px/22px var(--font-mono); min-width: 34px; padding: 1px 8px; border-radius: 8px; transition: background 300ms var(--ease-grow), color 300ms var(--ease-grow), box-shadow 300ms var(--ease-grow); }
.lgs.judged .lg:not(.best) { opacity: var(--peek); }
.lg.best.y .cn { background: var(--cart-you); color: var(--bg); box-shadow: var(--glow-you); }
.lg.best.t .cn { background: var(--surface-3); }
.cell { height: 40px; border-radius: 12px; background: var(--surface-1); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; min-width: 0; }
.cell.one { justify-content: center; }
.cell .cl { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.y .cl { color: var(--cart-you-text); }
.cell .cv { font: 700 17px/22px var(--font-mono); font-variant-numeric: tabular-nums; }
.fly { position: absolute; left: 0; top: 0; font: 700 17px/22px var(--font-mono); padding: 4px 12px; border-radius: 999px; pointer-events: none; z-index: 3; }
.fly.y { background: var(--cart-you); color: var(--bg); box-shadow: var(--glow-you); } .fly.t { background: var(--surface-3); color: var(--text); }

.zb { display: grid; gap: 6px; align-content: start; }
.brow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.brow .small { text-align: center; min-width: 0; }
.tug { position: relative; height: 18px; border-radius: 9px; background: var(--surface-2); }
.tug .y, .tug .t { position: absolute; top: 0; bottom: 0; border-radius: 9px; width: 0; transition: width 300ms var(--ease-grow); }
.tug .y { left: 0; background: var(--cart-you); box-shadow: var(--glow-you); } .tug .t { right: 0; background: var(--surface-3); }
.tug .tick { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--text); border-radius: 1px; }
.tickl { position: relative; height: 16px; } .tickl span { position: absolute; transform: translateX(-50%); white-space: nowrap; transition: color 300ms var(--ease-grow); }
.tickl span.lit { color: var(--cart-you-text); }
.ffoot { display: flex; gap: 6px; justify-content: center; align-items: center; min-height: 28px; }
.flagchip { font: 600 12px/16px var(--font-mono); letter-spacing: 1px; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-muted); }
.flagchip.lit { background: var(--tint-you); color: var(--cart-you-text); box-shadow: inset 0 0 0 1.5px var(--cart-you), var(--glow-you); }
.hbars { display: grid; gap: 8px; }
.hb { display: grid; grid-template-columns: 64px minmax(0,1fr) 34px; align-items: center; gap: 10px; }
.hb .nm { font-size: 15px; line-height: 20px; font-weight: 500; } .hb.you .nm { color: var(--cart-you-text); font-weight: 600; }
.hb .trk { height: 14px; border-radius: 7px; background: var(--surface-2); position: relative; }
.hb .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 7px; background: var(--surface-3); transition: width 300ms var(--ease-grow); }
.hb.you .fill { background: var(--cart-you); box-shadow: var(--glow-you); }
.hb .v { font: 700 15px/20px var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.lockline { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--text); left: 0; opacity: 0; transition: left 900ms var(--ease-grow), opacity 200ms linear; }

.copy { min-height: 118px; padding-top: 12px; display: grid; align-content: start; flex: none; }
.copy > div { grid-area: 1 / 1; }
.h { font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -1px; margin: 0; text-wrap: balance; }
.s { font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text-muted); margin: 6px 0 0; text-wrap: pretty; }
.foot { padding-bottom: 20px; position: relative; flex: none; }
.btn { height: 56px; border-radius: var(--radius-lg); border: 0; background: var(--text); color: var(--bg); font: 600 17px/22px var(--font-sans); cursor: pointer; width: 100%; }
.hint { position: absolute; left: 0; right: 0; top: -24px; text-align: center; font-size: 13px; line-height: 18px; color: var(--text-muted); }

@keyframes swap-out { from { opacity: 1; filter: blur(0) } to { opacity: 0; filter: blur(var(--blur-swap)) } }
@keyframes swap-in  { from { opacity: 0; filter: blur(var(--blur-swap)) } to { opacity: 1; filter: blur(0) } }
.out { animation: swap-out calc(var(--motion-grow) * .4) cubic-bezier(.4,0,1,1) both; }
.in  { animation: swap-in calc(var(--motion-grow) * .8) calc(var(--motion-grow) * .2) var(--ease-grow) both; }
@keyframes bump { 0% { transform: scale(.92) } 55% { transform: scale(1.06) } 100% { transform: scale(1) } }
.bmp { animation: bump .22s cubic-bezier(.2,.8,.2,1); }
@keyframes ripple { 0% { opacity: .55; transform: scale(.7) } 100% { opacity: 0; transform: scale(1.35) } }

/* the phone moment */
.mpw { position: absolute; right: 12px; bottom: -64px; width: 157px; height: 240px; transform: translateY(125%) rotate(6deg); transition: transform 500ms var(--ease-grow); pointer-events: none; z-index: 2; }
.mpw.on { transform: translateY(0) rotate(-5deg); }
.mp { width: 393px; height: 600px; border-radius: 44px; background: var(--bg); box-shadow: 0 0 0 6px var(--surface-3), 0 0 0 7px var(--line), 0 30px 60px rgba(0,0,0,.45); overflow: hidden; transform: scale(.4); transform-origin: top left; }
.mp-st { height: 34px; display: flex; justify-content: space-between; align-items: end; padding: 0 30px; font: 600 13px/18px var(--font-sans); }
.mp-st i { width: 90px; height: 24px; border-radius: 12px; background: var(--surface-2); align-self: center; }
.mp-ti { height: 66px; padding: 8px 20px 0; }
.mp-body { padding: 4px 20px; display: grid; gap: 12px; }
.er { display: flex; align-items: center; gap: 12px; } .er .row { width: 62px; }
.pads { display: grid; grid-template-columns: repeat(4, 62px); gap: 8px; }
.pads i { height: 62px; border-radius: 16px; background: var(--surface-1); display: grid; place-items: center; font: 700 32px/36px var(--font-mono); font-style: normal; position: relative; transition: background 200ms linear, color 200ms linear; }
.pads i.sel { background: var(--text); color: var(--bg); }
.tap { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--text); opacity: 0; animation: ripple .45s ease-out both; }

/* options sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 8; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface-1); border-radius: 24px 24px 0 0; padding-top: 18px; padding-bottom: 24px; display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px/18px var(--font-sans); color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.chip small { font: 500 13px/18px var(--font-sans); color: var(--text-muted); }
.chip[aria-pressed="true"] { background: var(--tint-you); border-color: var(--cart-you); }

@media (prefers-reduced-motion: reduce) {
  .out, .in, .bmp, .tap { animation: none !important; } .tap { opacity: 0 !important; }
  .mpw, .tug .y, .tug .t, .hb .fill, .lockline, .lg, .lg .cn, .strip i { transition-duration: 1ms !important; }
}
</style>

<div class="app" id="app">
  <div class="top pad">
    <div class="toprow"><span class="label" id="gname">2v2</span><span><button type="button" id="opt">Options</button><button type="button" id="replay">Replay</button></span></div>
    <div class="segs" id="segs"></div>
  </div>
  <div class="hero" id="hero"><svg id="hole" aria-hidden="true"></svg><div class="mpw" id="mpw" hidden></div></div>
  <div class="pad"><div class="strip" id="strip"></div><div class="zone" id="zone"></div></div>
  <div class="copy pad" id="copy"></div>
  <div class="foot pad"><div class="hint" id="hint"></div><button class="btn" id="play" type="button">Let's play</button></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet pad" id="sheet" hidden>
    <div class="label muted">Game</div><div class="chips" id="games"></div>
    <div class="label muted">Try</div>
    <div class="chips"><button class="chip" type="button" id="tphone" aria-pressed="true">Phone moment</button><button class="chip" type="button" id="ttie" aria-pressed="true">Second hole</button></div>
    <div class="small muted" id="size"></div>
    <button class="btn" type="button" id="close">Done</button>
  </div>
</div>
<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
let timers = [], gen = 0;
const later = (ms, f) => { timers.push(setTimeout(f, ms)); };
const clearAll = () => { timers.forEach(clearTimeout); timers = []; gen++; };
const half = (n) => { const w = Math.floor(n + 1e-9), h = n - w > 1e-9; return (w || !h ? String(w) : '') + (h ? '½' : ''); };
const parFmt = (n) => n === 0 ? 'E' : (n > 0 ? '+' : '−') + Math.abs(n);
const bumpEl = (n) => { n.classList.remove('bmp'); void n.offsetWidth; n.classList.add('bmp'); };
function tween(dur, fn, done) { const g0 = gen; if (RM) { fn(1); done && done(); return; } const t0 = performance.now();
  const f = (t) => { if (g0 !== gen) return; const p = Math.min(1, Math.max(0, (t - t0) / dur)); fn(p); if (p < 1) requestAnimationFrame(f); else done && done(); }; requestAnimationFrame(f); }
function swapIn(box, html) { const old = [...box.children], w = document.createElement('div'); w.innerHTML = html; const el = w.firstElementChild;
  old.forEach(o => { if (RM) o.remove(); else { o.classList.add('out'); setTimeout(() => o.remove(), 120); } }); if (!RM) el.classList.add('in'); box.appendChild(el); return el; }
const setCopy = (c, first) => { const html = `<div><p class="h">${c.h}</p><p class="s">${c.s}</p></div>`; if (first) $('copy').innerHTML = html; else swapIn($('copy'), html); };

// ── the six games (031 names + rules). players: [name, side]; cells: [label, span, side] ──
function tugFrames(stretches, per = 1) { const fr = []; stretches.forEach((st, si) => { let u = 0, t = 0;
  [...st.res].forEach((r) => { const us = r === 'w' ? per : r === 'l' ? 0 : r === 'h' ? per / 2 : r; u += us; t += per - us; fr.push({ cell: us > per / 2 ? 'w' : us < per / 2 ? 'l' : 'h', us: u, them: t, si, sub: st.sub, balls: st.balls }); }); }); return fr; }
const chipsFoot = (lbl, arr) => `<span class="small muted">${lbl}</span>${arr.map(r => `<span class="flagchip${r === 'W' ? ' lit' : ''}">${r === 'W' ? 'Won' : r === 'L' ? 'Lost' : '—'}</span>`).join('')}`;
const P4 = [['You', 'y'], ['Mike', 'y'], ['Tyler', 't'], ['Sam', 't']], SOLO = [['You', 'y'], ['Chris', 't'], ['Sam', 't'], ['Jake', 't']];
const PAIR = [['You + Mike', 2, 'y'], ['Tyler + Sam', 2, 't']], ONES = [['', 1, 'y'], ['', 1, 't'], ['', 1, 't'], ['', 1, 't']];
const WIN = { par: 4, sc: [4, 6, 5, 5], h: 'Best ball takes the hole.', s: 'Your 4 beats their 5. One point.' }, TIE = { par: 3, sc: [4, 3, 3, 4], h: 'A tie splits it.', s: '3 against 3: ½ each.' };
const GAMES = {
  oneMatch: { name: '2v2', tag: 'same partners', players: P4, cells: PAIR, mode: 'best', who: { h: 'You and Mike vs Tyler and Sam.', s: 'Same partners, all 18 holes.' }, holes: [WIN, TIE],
    sim: () => ({ kind: 'tug', total: 18, tick: [9.5, '9½ to win'], intro: { h: 'Now the whole round.', s: '18 points out there. First to 9½ wins.' },
      frames: tugFrames([{ sub: 'A point a hole', res: 'whlwwlwhwlwwlhw' }]), pauses: { 15: { h: "9½. That's the match.", s: "More than half of 18, so they can't catch you." } } }) },
  partners: { name: '2v2', tag: 'partners switch', players: P4, cells: PAIR, mode: 'best', who: { h: 'You and Mike vs Tyler and Sam.', s: 'For the first 6 holes.' }, holes: [WIN, TIE],
    sim: () => { const fr = tugFrames([{ sub: 'Holes 1–6 · with Mike', res: 'whlwwh', balls: ['YMTS', 'yytt'] }, { sub: 'Holes 7–12 · with Tyler', res: 'lwlhlw', balls: ['YMTS', 'ytyt'] }, { sub: 'Holes 13–18 · with Sam', res: 'wwhlww', balls: ['YMTS', 'ytty'] }]);
      const R = ['W', 'L', 'W']; fr.forEach((f, i) => { const done = Math.floor((i + 1) / 6); f.foot = chipsFoot('Stretches', [0, 1, 2].map(k => k < done ? R[k] : '')); });
      return { kind: 'tug', total: 6, s3: true, frames: fr, intro: { h: 'Now the whole round.', s: 'Watch what happens at 7 and 13.' },
        pauses: { 7: { h: 'New partner at 7.', s: "Now you're with Tyler. The score starts over." }, 13: { h: 'And again at 13.', s: "Now with Sam. You've played with everyone." }, 18: { h: 'Most stretches won takes the day.', s: 'You won 2 of 3.' } } }; } },
  cart: { name: '2v2', tag: '8 players · 4 carts', players: P4, cells: PAIR, mode: 'best', who: { h: 'You and Mike are a cart.', s: 'First up: Tyler and Sam.' }, holes: [WIN, TIE],
    sim: () => { const fr = tugFrames([{ sub: 'Holes 1–6 · vs Tyler + Sam', res: 'whwlwh', balls: ['YMTS', 'yytt'] }, { sub: 'Holes 7–12 · vs Chris + Jake', res: 'lhwwlw', balls: ['YMCJ', 'yytt'] }, { sub: 'Holes 13–18 · vs Ben + Luke', res: 'whwwlw', balls: ['YMBL', 'yytt'] }]);
      const base = [0, 4, 7.5]; fr.forEach((f) => { f.foot = `<span class="small muted">Your cart today</span><span class="flagchip lit">${half(base[f.si] + f.us)} pts</span>`; });
      return { kind: 'tug', total: 6, s3: true, frames: fr, intro: { h: 'Now the whole round.', s: 'A new cart to beat every 6 holes.' },
