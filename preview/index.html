<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Golf Board">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Golf Live Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M26 12v34' stroke='%23ECEEF1' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M28 13l16 6-16 7z' fill='%23F4C95D'/%3E%3Cellipse cx='32' cy='50' rx='14' ry='4' fill='none' stroke='%23ECEEF1' stroke-width='3'/%3E%3C/svg%3E">
  <script>
    // Theme before first paint: dark by default, light if this phone chose it.
    try { if (JSON.parse(localStorage.getItem('glb.theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=2d64e16">
  <link rel="stylesheet" href="css/styles.css?v=2d64e16">
  <!-- Supabase client (pinned; no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js?v=2d64e16"></script>
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar"></header>
    <main id="content" class="content"></main>
    <nav id="tabbar" class="tabbar" aria-label="Round"></nav>
  </div>
  <div id="banners" class="banner-root"></div>
  <div id="toasts" class="toast-root" aria-live="polite"></div>
  <div id="overlay" class="overlay-root"></div>
  <div id="sheet" class="sheet-root"></div>

  <div class="landscape" role="alert">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
    Turn your phone upright
  </div>

  <div id="splash" class="splash" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 10v38"/><path d="M27 11l17 6.5L27 24z" fill="currentColor" stroke="none"/><ellipse cx="32" cy="52" rx="16" ry="4.5"/>
    </svg>
  </div>
  <noscript>Golf Live Board needs JavaScript.</noscript>
</body>
</html>
